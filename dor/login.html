<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>tiDye265 | Admin Login</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#121212">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://*.supabase.co https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co;">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        :root { --bg: #F4F6F8; --primary: #FFD700; --card-bg: #FFFFFF; --text: #1a1d21; --dim: #6b7280; --danger: #ff4757; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: var(--bg); font-family: system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: var(--card-bg); border-radius: 24px; padding: 40px 30px; width: 100%; max-width: 380px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-bottom: 30px; font-weight: 700; color: var(--text); }
        .input-row { margin-bottom: 20px; }
        .input-row input {
            width: 100%; height: 50px; border: 1.5px solid #e5e7eb; border-radius: 14px; padding: 0 16px; font-size: 15px; outline: none; background: #f9fafb; transition: 0.2s;
        }
        .input-row input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(255,215,0,0.1); }
        .turnstile-wrap { display: flex; justify-content: center; margin: 20px 0; }
        .btn {
            width: 100%; height: 50px; border: none; border-radius: 14px; background: var(--primary); color: #1a1d21; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:active { transform: scale(0.98); }
        .btn.loading { background: #e5e7eb !important; color: #9ca3af; pointer-events: none; }
        .alert { padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 15px; display: none; }
        .alert.error { background: #fef2f2; color: #991b1b; }
        .alert.success { background: #ecfdf5; color: #065f46; }
        .hidden { display: none !important; }
        .double-ring {
            width: 20px; height: 20px; position: relative;
        }
        .double-ring::before, .double-ring::after {
            content:''; position: absolute; top:50%; left:50%; width:18px; height:18px; border-radius:50%; border:3px solid transparent; border-top-color:var(--primary);
            transform: translate(-50%,-50%);
        }
        .double-ring::before { animation: spin 0.8s linear infinite; }
        .double-ring::after { width:12px; height:12px; animation: spinReverse 0.6s linear infinite; border-top-color:#1a1d21; }
        @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
        @keyframes spinReverse { to { transform: translate(-50%,-50%) rotate(-360deg); } }
    </style>
</head>
<body>
    <div class="login-box" id="loginBox">
        <h2><i class="bi bi-shield-lock-fill" style="color: var(--primary);"></i> Admin Portal</h2>
        <div id="alertBox" class="alert"></div>

        <!-- Step 1: Credentials -->
        <div id="stepCredentials">
            <div class="input-row">
                <input type="email" id="email" placeholder="Admin email" autocomplete="email" required>
            </div>
            <div class="input-row">
                <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
            </div>
            <div class="turnstile-wrap">
                <div class="cf-turnstile" data-sitekey="0x4AAAAAADQhPHJB5viRCO84"></div>
            </div>
            <button class="btn" id="loginBtn" onclick="submitLogin()">Authenticate</button>
        </div>

        <!-- Step 2: OTP -->
        <div id="stepOtp" class="hidden">
            <p style="text-align:center; margin-bottom:15px;">Enter OTP sent to your phone</p>
            <div class="input-row">
                <input type="text" id="otpInput" placeholder="OTP code" maxlength="6" inputmode="numeric" required>
            </div>
            <button class="btn" id="otpBtn" onclick="verifyOtp()">Verify OTP</button>
        </div>
    </div>

    <script src="../supabase.js"></script>
    <script>
        let tempToken = '';

        // Pre‑check IP whitelist
        async function checkIpAccess() {
            try {
                const res = await fetch(`${SUPABASE_URL}/functions/v1/api-admin-login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
                const data = await res.json();
                if (!res.ok || data.error) {
                    showAlert("Access denied. Your IP is not authorized.", "error");
                    document.getElementById('stepCredentials').classList.add('hidden');
                }
            } catch(e) {
                showAlert("Network error", "error");
            }
        }

        function showAlert(msg, type) {
            const box = document.getElementById('alertBox');
            box.textContent = msg;
            box.className = `alert ${type}`;
            box.style.display = 'block';
        }

        function hideAlert() { document.getElementById('alertBox').style.display = 'none'; }

        async function submitLogin() {
            hideAlert();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const turnstileResponse = document.querySelector('[name="cf-turnstile-response"]')?.value;
            if (!email || !password) return showAlert("Fill all fields", "error");
            if (!turnstileResponse) return showAlert("Complete the security check", "error");

            const btn = document.getElementById('loginBtn');
            btn.classList.add('loading');
            btn.innerHTML = '<div class="double-ring"></div>';

            try {
                const res = await fetch(`${SUPABASE_URL}/functions/v1/api-admin-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
                    body: JSON.stringify({ email, password, turnstileToken: turnstileResponse })
                });
                const data = await res.json();

                if (data.success && data.otp_required) {
                    tempToken = data.temp_token;
                    document.getElementById('stepCredentials').classList.add('hidden');
                    document.getElementById('stepOtp').classList.remove('hidden');
                    showAlert(data.message || "OTP sent", "success");
                } else {
                    showAlert(data.description || "Login failed", "error");
                }
            } catch(e) {
                showAlert("Network error", "error");
            } finally {
                btn.classList.remove('loading');
                btn.innerHTML = 'Authenticate';
                if (typeof turnstile !== 'undefined') turnstile.reset();
            }
        }

        async function verifyOtp() {
            hideAlert();
            const otp = document.getElementById('otpInput').value.trim();
            if (!otp) return showAlert("Enter OTP", "error");

            const btn = document.getElementById('otpBtn');
            btn.classList.add('loading');
            btn.innerHTML = '<div class="double-ring"></div>';

            try {
                const res = await fetch(`${SUPABASE_URL}/functions/v1/api-admin-verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
                    body: JSON.stringify({ temp_token: tempToken, otp })
                });
                const data = await res.json();
                if (data.success) {
                    sessionStorage.setItem('admin_token', data.token);
                    sessionStorage.setItem('admin_user', JSON.stringify(data.admin));
                    window.location.href = 'dashboard.html';
                } else {
                    showAlert(data.description || "Invalid OTP", "error");
                }
            } catch(e) {
                showAlert("Network error", "error");
            } finally {
                btn.classList.remove('loading');
                btn.innerHTML = 'Verify OTP';
            }
        }

        checkIpAccess();
    </script>
</body>
</html>
