<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tiDye265 | Admin Dashboard</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: #121212;
            color: #fff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #FFD700; margin-bottom: 10px; }
        p { color: #aaa; }
        .logout-btn {
            margin-top: 20px;
            background: #ff4757;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <i class="bi bi-shield-lock-fill" style="font-size: 40px; color: #FFD700;"></i>
        <h1>Admin Dashboard</h1>
        <p>Welcome, <span id="adminName">Admin</span></p>
        <p>You are logged into the tiDye265 administration panel.</p>
        <button class="logout-btn" onclick="logout()">Log Out</button>
    </div>

    <script>
        const admin = JSON.parse(sessionStorage.getItem('admin_user') || '{}');
        document.getElementById('adminName').innerText = admin.full_name || admin.email || 'Admin';

        function logout() {
            sessionStorage.removeItem('admin_token');
            sessionStorage.removeItem('admin_user');
            window.location.href = 'login.html';
        }

        // Optional: Verify token validity (could call a protected endpoint)
    </script>
</body>
</html>
