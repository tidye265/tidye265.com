<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tiDye265 | Admin Dashboard</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --primary: #FFD700;
            --text: #e0e0e0;
            --dim: #9ca3af;
            --success: #10b981;
            --danger: #ff4757;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Header */
        .admin-header {
            background: var(--card);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .admin-header .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .admin-header .logo-area img {
            height: 36px;
            border-radius: 6px;
        }
        .admin-header .logo-area h3 {
            font-size: 18px;
            color: var(--primary);
        }
        .admin-header .user-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logout-btn {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: opacity 0.2s;
        }
        .logout-btn:hover { opacity: 0.9; }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 4px;
            background: #1a1a1a;
            padding: 12px 20px;
            border-bottom: 1px solid #333;
            overflow-x: auto;
        }
        .tab-btn {
            background: transparent;
            color: var(--dim);
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: var(--primary);
            color: #121212;
        }

        /* Content */
        .tab-content {
            display: none;
            padding: 20px;
            flex: 1;
        }
        .tab-content.active {
            display: block;
        }

        /* Stats cards */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-card .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
        }
        .stat-card .stat-label {
            font-size: 12px;
            color: var(--dim);
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Tables */
        .table-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            color: var(--dim);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        td {
            color: var(--text);
        }
        .badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge.win { background: #065f46; color: #a7f3d0; }
        .badge.lose { background: #7f1d1d; color: #fecaca; }
        .badge.play { background: #1e3a5f; color: #bfdbfe; }
        .badge.deposit { background: #064e3b; color: #a7f3d0; }
        .badge.withdraw { background: #7c2d12; color: #fecaca; }
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--dim);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="admin-header">
        <div class="logo-area">
            <img src="../logo.jpg" alt="tiDye265">
            <h3>Admin Panel</h3>
        </div>
        <div class="user-area">
            <span id="adminNameDisplay" style="font-size:13px; color: var(--dim);"></span>
            <button class="logout-btn" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
        </div>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="users">Users</button>
        <button class="tab-btn" data-tab="casino">Casino Transactions</button>
        <button class="tab-btn" data-tab="financial">Deposits / Withdrawals</button>
    </div>

    <!-- USERS TAB -->
    <div class="tab-content active" id="tab-users">
        <div class="stats-row" id="userStats"></div>
        <div class="table-wrapper">
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>Phone / Username</th>
                        <th>Balance (MWK)</th>
                        <th>Last Wallet Update</th>
                        <th>Registered</th>
                    </tr>
                </thead>
                <tbody id="usersBody"></tbody>
            </table>
        </div>
    </div>

    <!-- CASINO TRANSACTIONS TAB -->
    <div class="tab-content" id="tab-casino">
        <div class="table-wrapper">
            <table id="casinoTable">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Round</th>
                        <th>Game</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="casinoBody"></tbody>
            </table>
        </div>
    </div>

    <!-- FINANCIAL TRANSACTIONS TAB -->
    <div class="tab-content" id="tab-financial">
        <div class="table-wrapper">
            <table id="financialTable">
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Reference</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="financialBody"></tbody>
            </table>
        </div>
    </div>

    <script src="../supabase.js"></script>
    <script>
        // ---------- AUTH CHECK ----------
        const adminToken = sessionStorage.getItem('admin_token');
        const adminUser = JSON.parse(sessionStorage.getItem('admin_user') || '{}');

        if (!adminToken || !adminUser.id) {
            window.location.href = 'login.html';
        }

        document.getElementById('adminNameDisplay').textContent = adminUser.full_name || adminUser.email || 'Admin';

        let allData = null;

        // ---------- FETCH DATA ----------
        async function fetchAllUsers() {
            try {
                const res = await fetch(`${SUPABASE_URL}/functions/v1/api-admin-all-users`, {
                    headers: {
                        'Authorization': `Bearer ${adminToken}`,
                    }
                });
                if (res.status === 401) {
                    logout();
                    return;
                }
                const data = await res.json();
                if (data.success) {
                    allData = data.data;
                    renderAll();
                } else {
                    showError('Failed to load data');
                }
            } catch (e) {
                console.error(e);
                showError('Network error');
            }
        }

        function showError(msg) {
            document.querySelectorAll('.tab-content').forEach(el => {
                el.innerHTML = `<div class="loading"><i class="bi bi-exclamation-triangle" style="color: var(--danger); font-size: 24px;"></i><p>${msg}</p></div>`;
            });
        }

        // ---------- RENDER ----------
        function renderAll() {
            renderUserStats();
            renderUsersTable();
            renderCasinoTable();
            renderFinancialTable();
        }

        function renderUserStats() {
            const users = allData.users || [];
            const totalBalance = users.reduce((sum, u) => sum + Number(u.balance), 0);
            const active24h = users.filter(u => u.lastWalletUpdate && (Date.now() - new Date(u.lastWalletUpdate).getTime()) < 86400000).length;

            document.getElementById('userStats').innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${users.length}</div>
                    <div class="stat-label">Total Users</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">MWK ${totalBalance.toLocaleString()}</div>
                    <div class="stat-label">Total Balance</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${active24h}</div>
                    <div class="stat-label">Active (24h)</div>
                </div>
            `;
        }

        function renderUsersTable() {
            const users = allData.users || [];
            const tbody = document.getElementById('usersBody');
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>${u.phone}</td>
                    <td>MWK ${Number(u.balance).toLocaleString()}</td>
                    <td>${u.lastWalletUpdate ? new Date(u.lastWalletUpdate).toLocaleString() : 'N/A'}</td>
                    <td>${new Date(u.createdAt).toLocaleDateString()}</td>
                </tr>
            `).join('');
        }

        function renderCasinoTable() {
            const tx = allData.casino_transactions || [];
            const tbody = document.getElementById('casinoBody');
            tbody.innerHTML = tx.slice(0, 500).map(t => `
                <tr>
                    <td>${t.user_code}</td>
                    <td>${t.round_id}</td>
                    <td>${t.game}</td>
                    <td><span class="badge ${t.type.toLowerCase()}">${t.type}</span></td>
                    <td>MWK ${Number(t.amount).toLocaleString()}</td>
                    <td>${new Date(t.created_at).toLocaleString()}</td>
                </tr>
            `).join('');
        }

        function renderFinancialTable() {
            const tx = allData.financial_transactions || [];
            const tbody = document.getElementById('financialBody');
            tbody.innerHTML = tx.slice(0, 500).map(t => `
                <tr>
                    <td>${t.user_id}</td>
                    <td><span class="badge ${t.type}">${t.type}</span></td>
                    <td>MWK ${Number(t.amount).toLocaleString()}</td>
                    <td>${t.reference || 'N/A'}</td>
                    <td>${new Date(t.created_at).toLocaleString()}</td>
                </tr>
            `).join('');
        }

        // ---------- TABS ----------
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const tabId = this.getAttribute('data-tab');
                document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
                document.getElementById(`tab-${tabId}`).classList.add('active');
            });
        });

        // ---------- LOGOUT ----------
        function logout() {
            sessionStorage.removeItem('admin_token');
            sessionStorage.removeItem('admin_user');
            window.location.href = 'login.html';
        }

        // ---------- INIT ----------
        fetchAllUsers();
    </script>
</body>
</html>
