<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account | Tidye265</title>
    <style>
        body { background: #F8F9FA; font-family: sans-serif; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: auto; border: 1px solid #ddd; }
        .label { color: #888; font-size: 12px; }
        .value { font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>User Profile</h2>
    <div id="content">
        <div class="label">Username</div>
        <div id="username" class="value">Loading...</div>
        <div class="label">Phone Number</div>
        <div id="phone" class="value">Loading...</div>
        <button onclick="logout()">Logout</button>
    </div>
</div>

<script>
    // Source of truth: Token imene login_265 inapanga
    const token = localStorage.getItem('tidye_session_token');

    // Logic: Ngati palibe token, pitani ku login (osati loop)
    if (!token) {
        window.location.href = 'login.html';
    } else {
        fetchUserDetails();
    }

    async function fetchUserDetails() {
        try {
            const response = await fetch("https://YOUR_PROJECT_ID.supabase.co/functions/v1/settings-api", {
                method: "GET",
                headers: { "Authorization": `Bearer ${token}` }
            });

            if (response.status === 401) {
                // Apa ndipopano loop imatha: ngati API yati 401 (Unauthorized), chotsani token ndipo pitani ku login
                localStorage.removeItem('tidye_session_token');
                window.location.href = 'login.html';
                return;
            }

            const data = await response.json();
            document.getElementById('username').innerText = data.username;
            document.getElementById('phone').innerText = data.phone_number;

        } catch (err) {
            console.error("Failed to fetch:", err);
        }
    }

    function logout() {
        localStorage.removeItem('tidye_session_token');
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
