<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* White Dashboard Theme */
        body {
            background-color: #F8F9FA;
            color: #333333;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding-bottom: 80px;
        }

        .container {
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
        }

        .card {
            background: #FFFFFF;
            border: 1px solid #E0E0E0;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .profile-icon {
            font-size: 40px;
            color: #2D3436;
            background: #F0F0F0;
            padding: 20px;
            border-radius: 50%;
            margin-bottom: 10px;
        }

        .info-group {
            margin-bottom: 15px;
            padding: 10px;
            border-bottom: 1px solid #EEE;
        }

        .label { font-size: 12px; color: #888; text-transform: uppercase; }
        .value { font-size: 16px; font-weight: 600; color: #333; }

        .btn-logout {
            width: 100%;
            padding: 12px;
            background: #FF4D4D;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        /* Loading Skeleton */
        .skeleton { background: #EEE; height: 20px; border-radius: 4px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="profile-header">
            <div class="profile-icon"><i class="fas fa-user"></i></div>
            <h2>Account Details</h2>
        </div>

        <div id="profileContent">
            <div class="info-group">
                <div class="label">Username</div>
                <div id="username" class="value"><div class="skeleton" style="width: 60%;"></div></div>
            </div>
            <div class="info-group">
                <div class="label">Phone Number</div>
                <div id="phone" class="value"><div class="skeleton" style="width: 80%;"></div></div>
            </div>
        </div>

        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</div>

<script>
    async function loadProfile() {
        // Retrieve the token saved during login_265
        const token = localStorage.getItem("sessionToken"); 
        
        if (!token) {
            window.location.href = "login.html";
            return;
        }

        try {
            const response = await fetch("https://YOUR_PROJECT_ID.supabase.co/functions/v1/settings-api", {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                }
            });

            if (!response.ok) throw new Error("Could not load profile");

            const data = await response.json();
            document.getElementById("username").innerText = data.username;
            document.getElementById("phone").innerText = data.phone_number;

        } catch (err) {
            document.getElementById("profileContent").innerHTML = "<p style='color:red;'>Error Loading Profile. Please login again.</p>";
            console.error(err);
        }
    }

    function logout() {
        localStorage.removeItem("sessionToken");
        window.location.href = "login.html";
    }

    loadProfile();
</script>

</body>
</html>
