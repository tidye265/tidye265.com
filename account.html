<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Account | Tidye265</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #F8F9FA; --primary: #FFD700; --card-bg: #FFFFFF;
            --text-light: #1a1d21; --text-dim: #4b5563; --danger: #ff4757; --border: #e5e7eb;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--text-light); font-family: 'Inter', sans-serif; padding-bottom: 30px; }

        /* Skeleton Loader Engine */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #F8F9FA; z-index: 9999; display: flex; flex-direction: column; padding: 20px; gap: 20px; }
        .skeleton { background: #e5e7eb; background: linear-gradient(90deg, #f0f2f5 25%, #e5e7eb 50%, #f0f2f5 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; border-radius: 12px; }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .sk-avatar { width: 80px; height: 80px; border-radius: 50%; margin: 20px auto; }
        .sk-line { height: 20px; width: 100%; border-radius: 8px; }

        /* Header */
        .header { background: #fff; padding: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .back-btn { font-size: 18px; color: var(--text-dim); }
        .page-title { font-family: 'Lexend'; font-weight: 800; }

        /* Profile Section */
        .profile-container { padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .avatar-box { width: 90px; height: 90px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; color: #000; margin-bottom: 15px; border: 4px solid #fff; box-shadow: 0 4px 12px rgba(255,215,0,0.3); }
        .user-name { font-family: 'Lexend'; font-size: 20px; font-weight: 800; }
        .user-phone { color: var(--text-dim); font-size: 14px; margin-top: 5px; }

        /* Menu Items */
        .menu-list { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .menu-item { background: #fff; padding: 18px; border-radius: 16px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: inherit; border: 1px solid var(--border); transition: 0.2s; }
        .menu-item:active { transform: scale(0.98); background: #f9f9f9; }
        .menu-left { display: flex; align-items: center; gap: 15px; font-weight: 600; }
        .menu-icon { width: 40px; height: 40px; background: #f3f4f6; border-radius: 10px; display: flex; align-items: center; justify-content: center; }

        .btn-logout { margin: 20px; background: #fee2e2; color: #dc2626; border: none; padding: 15px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="skeleton sk-avatar"></div>
        <div class="skeleton sk-line" style="width: 60%; margin: 0 auto;"></div>
        <div class="skeleton sk-line" style="height: 60px; border-radius: 16px;"></div>
        <div class="skeleton sk-line" style="height: 60px; border-radius: 16px;"></div>
    </div>

    <header class="header">
        <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="page-title">Account</div>
        <div style="width: 20px;"></div> </header>

    <div class="profile-container">
        <div class="avatar-box"><i class="fa-solid fa-user"></i></div>
        <div class="user-name" id="userName">User Profile</div>
        <div class="user-phone" id="userPhone">Loading...</div>
    </div>

    <div class="menu-list">
        <a href="#" class="menu-item">
            <div class="menu-left"><div class="menu-icon"><i class="fa-solid fa-gear"></i></div> Settings</div>
            <i class="fa-solid fa-chevron-right"></i>
        </a>
        <a href="#" class="menu-item">
            <div class="menu-left"><div class="menu-icon"><i class="fa-solid fa-headset"></i></div> Support</div>
            <i class="fa-solid fa-chevron-right"></i>
        </a>
        <a href="#" class="menu-item">
            <div class="menu-left"><div class="menu-icon"><i class="fa-solid fa-shield"></i></div> Security</div>
            <i class="fa-solid fa-chevron-right"></i>
        </a>
    </div>

    <button class="btn-logout" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
    </button>

    <script src="supabase.js"></script>
    <script>
        const loader = document.getElementById('loader');

        async function fetchUserDetails() {
            const token = localStorage.getItem('tidye_session_token');
            if (!token) { window.location.href = 'login.html'; return; }

            try {
                // Settings API endpoint
                const response = await fetch(`${window.SUPABASE_URL}/functions/v1/settings-api`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401) { window.location.href = 'login.html'; return; }

                const data = await response.json();
                
                // Update UI
                document.getElementById('userName').innerText = data.username || "Tidye Player";
                document.getElementById('userPhone').innerText = data.phone_number || "No number set";

            } catch (err) {
                console.error("Error loading profile:", err);
            } finally {
                // Hide loader
                setTimeout(() => loader.style.display = 'none', 500);
            }
        }

        function logout() {
            localStorage.removeItem('tidye_session_token');
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', fetchUserDetails);
    </script>
</body>
</html>
