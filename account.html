<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <style>
        .error-card { background: #fee2e2; border: 1px solid #f87171; color: #991b1b; padding: 15px; border-radius: 8px; margin: 20px; display: none; }
    </style>
</head>
<body>

<div id="errorDisplay" class="error-card"></div>

<div id="profileContent">
    <div id="username">Loading...</div>
    <div id="phone">...</div>
</div>

<script>
    async function loadProfile() {
        const token = localStorage.getItem('tidye_session_token');
        const errorDisplay = document.getElementById('errorDisplay');

        if (!token) {
            window.location.href = 'login.html';
            return;
        }

        try {
            // Dziwani: Sinthani [YOUR-PROJECT-ID] ndi yanu yeniyeni
            const response = await fetch("https://[YOUR-PROJECT-ID].supabase.co/functions/v1/settings-api", {
                method: "GET",
                headers: { 
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                }
            });

            const result = await response.json();

            if (!response.ok) {
                // Iyi ndi error yochokera ku backend
                throw new Error(result.error || "Server returned error: " + response.status);
            }

            // Success
            document.getElementById('username').innerText = result.username;
            document.getElementById('phone').innerText = result.phone_number;

        } catch (err) {
            // Iyi ndiyo imatenga "Failed to fetch" (Network Error)
            errorDisplay.style.display = "block";
            errorDisplay.innerText = "Connection Error: " + err.message + ". Check if URL is correct.";
            console.error("DEBUG:", err);
        }
    }

    loadProfile();
</script>
</body>
</html>
