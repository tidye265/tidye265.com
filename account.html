<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | Tidye265</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #F8F9FA; color: #1a1d21; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
        .card { background: #FFFFFF; border: 1px solid #e5e7eb; border-radius: 16px; padding: 24px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 30px; }
        .icon-circle { background: #F3F4F6; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 32px; color: #4b5563; }
        .item { padding: 15px 0; border-bottom: 1px solid #f3f4f6; }
        .label { font-size: 12px; font-weight: 700; color: #9ca3af; text-transform: uppercase; }
        .value { font-size: 16px; font-weight: 600; margin-top: 4px; }
        .btn-logout { width: 100%; padding: 14px; background: #ef4444; color: white; border: none; border-radius: 10px; font-weight: 600; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card" id="mainContainer">
    <div class="header">
        <div class="icon-circle"><i class="fa-solid fa-user"></i></div>
        <h3>Account Details</h3>
    </div>

    <div id="loading" style="text-align: center;">Loading profile...</div>
    
    <div id="profileData" style="display: none;">
        <div class="item">
            <div class="label">Username</div>
            <div id="username" class="value">-</div>
        </div>
        <div class="item">
            <div class="label">Phone Number</div>
            <div id="phone" class="value">-</div>
        </div>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</div>

<script>
    // 1. Tsimikizani token ili ku localStorage
    const token = localStorage.getItem('tidye_session_token');

    if (!token) {
        window.location.href = 'login.html';
    } else {
        fetchProfile();
    }

    async function fetchProfile() {
        try {
            // Sinthani URL iyi kukhala ya inu
            const response = await fetch("https://YOUR_PROJECT_ID.supabase.co/functions/v1/settings-api", {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                }
            });

            if (!response.ok) throw new Error("Unauthorized");

            const data = await response.json();
            
            document.getElementById('username').innerText = data.username;
            document.getElementById('phone').innerText = data.phone_number;
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('profileData').style.display = 'block';

        } catch (err) {
            console.error(err);
            window.location.href = 'login.html'; // Redirect to login if API fails
        }
    }

    function logout() {
        localStorage.removeItem('tidye_session_token');
        window.location.href = 'login.html';
    }
</script>

</body>
</html>
