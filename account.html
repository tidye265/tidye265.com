<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Account | Tidye265</title>
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' https: data: blob:; connect-src 'self' https://*.supabase.co;">
    <meta name="theme-color" content="#FFD700">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #F4F6F8; --primary: #FFD700; --card-bg: #FFFFFF;
            --text-light: #1a1d21; --text-dim: #6b7280; --danger: #ef4444; 
            --border: #e5e7eb; --accent: #f3f4f6;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text-light); font-family: 'Inter', sans-serif; padding-bottom: 30px; line-height: 1.5; }

        /* Loader */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #F4F6F8; z-index: 9999; display: flex; flex-direction: column; padding: 20px; gap: 15px; }
        .skeleton { background: #e5e7eb; border-radius: 8px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Header */
        .header { background: #fff; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .header-logo { height: 32px; border-radius: 4px; }
        .page-title { font-family: 'Lexend'; font-weight: 700; font-size: 16px; }
        .header-action { color: var(--text-dim); font-size: 18px; text-decoration: none; }

        /* Profile */
        .profile-container { background: #fff; padding: 15px 15px 10px; display: flex; flex-direction: column; align-items: center; }
        .avatar-box { width: 65px; height: 65px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #000; margin-bottom: 8px; border: 2px solid #fff; }
        .user-name { font-family: 'Lexend'; font-size: 16px; font-weight: 700; }
        .user-phone { color: var(--text-dim); font-size: 12px; font-weight: 500; }

        /* Compact Wallet Card Box */
        .wallet-card-mini { background: #1a1d21; color: #fff; border-radius: 12px; padding: 12px 15px; width: calc(100% - 30px); margin: 10px 15px; display: flex; align-items: center; justify-content: space-between; }
        .wallet-card-mini .lbl { font-size: 11px; text-transform: uppercase; color: #9ca3af; font-weight: 600; letter-spacing: 0.5px; }
        .wallet-card-mini .amt { font-family: 'Lexend'; font-size: 18px; font-weight: 800; color: var(--primary); margin-top: 2px; }
        .wallet-card-mini i { font-size: 20px; color: #9ca3af; }

        /* Navigation Menu */
        .menu-section-title { padding: 12px 15px 6px; font-size: 11px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; }
        .menu-list { padding: 0 15px; display: flex; flex-direction: column; gap: 6px; }
        
        /* Accordion Style */
        .menu-group { background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .menu-trigger { width: 100%; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; background: none; border: none; font-family: inherit; font-size: 13.5px; font-weight: 600; color: var(--text-light); cursor: pointer; text-align: left; }
        .menu-trigger i.main-icon { margin-right: 10px; width: 18px; color: var(--text-dim); }
        .chevron { transition: transform 0.2s ease; font-size: 11px; color: #9ca3af; }
        
        .submenu { max-height: 0; overflow: hidden; transition: max-height 0.25s ease-out; background: #fafafa; border-top: 0 solid var(--border); }
        .submenu-item { display: flex; align-items: center; padding: 10px 15px 10px 43px; text-decoration: none; color: var(--text-dim); font-size: 13px; font-weight: 500; border-bottom: 1px solid #f3f4f6; }
        .submenu-item:last-child { border-bottom: none; }
        .submenu-item i { margin-right: 8px; font-size: 8px; color: #d1d5db; }

        /* Active State */
        .menu-group.active .submenu { max-height: 200px; border-top-width: 1px; }
        .menu-group.active .chevron { transform: rotate(90deg); }

        /* Simple Link Items */
        .single-link { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: var(--text-light); font-size: 13.5px; font-weight: 600; }

        /* Logout */
        .btn-logout { width: calc(100% - 30px); margin: 15px 15px; background: #fff; color: var(--danger); border: 1px solid #fecaca; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="skeleton" style="height: 50px; width: 100%;"></div>
        <div class="skeleton" style="height: 100px; width: 100%;"></div>
        <div class="skeleton" style="height: 50px; width: 100%;"></div>
        <div class="skeleton" style="height: 50px; width: 100%;"></div>
    </div>

    <header class="header">
        <img src="logo.jpg" alt="Logo" class="header-logo">
        <div class="page-title">My Account</div>
        <a href="dashboard.html" class="header-action"><i class="fa-solid fa-xmark"></i></a>
    </header>

    <div class="profile-container">
        <div class="avatar-box"><i class="fa-solid fa-user"></i></div>
        <div class="user-name" id="userName">User</div>
        <div class="user-phone" id="userPhone">...</div>
    </div>

    <div class="wallet-card-mini">
        <div>
            <div class="lbl">Wallet Balance</div>
            <div class="amt" id="walletBalance">MWK 0.00</div>
        </div>
        <i class="fa-solid fa-building-columns"></i>
    </div>

    <div class="menu-section-title">Finance</div>
    <div class="menu-list">
        <div class="menu-group">
            <button class="menu-trigger" onclick="toggleMenu(this)">
                <span><i class="fa-solid fa-wallet main-icon"></i> Wallet & Transactions</span>
                <i class="fa-solid fa-chevron-right chevron"></i>
            </button>
            <div class="submenu">
                <a href="deposit.html" class="submenu-item"><i class="fa-solid fa-circle"></i> Deposit Funds</a>
                <a href="withdraw.html" class="submenu-item"><i class="fa-solid fa-circle"></i> Withdraw Money</a>
                <a href="transactions.html" class="submenu-item"><i class="fa-solid fa-circle"></i> View History</a>
            </div>
        </div>
    </div>

    <div class="menu-section-title">Security</div>
    <div class="menu-list">
        <div class="menu-group">
            <button class="menu-trigger" onclick="toggleMenu(this)">
                <span><i class="fa-solid fa-shield-halved main-icon"></i> Security Settings</span>
                <i class="fa-solid fa-chevron-right chevron"></i>
            </button>
            <div class="submenu">
                <a href="change-pin.html" class="submenu-item"><i class="fa-solid fa-circle"></i> Change Account PIN</a>
                <a href="sessions.html" class="submenu-item"><i class="fa-solid fa-circle"></i> Active Sessions</a>
            </div>
        </div>
        <a href="settings.html" class="single-link">
            <span><i class="fa-solid fa-gear" style="margin-right: 10px; color: var(--text-dim);"></i> Profile Settings</span>
            <i class="fa-solid fa-chevron-right" style="font-size: 11px; color: #9ca3af;"></i>
        </a>
    </div>

    <div class="menu-section-title">Support</div>
    <div class="menu-list">
        <a href="https://wa.me/265992672764" class="single-link">
            <span><i class="fa-brands fa-whatsapp" style="margin-right: 10px; color: #25d366;"></i> WhatsApp Help</span>
            <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 11px; color: #9ca3af;"></i>
        </a>
    </div>

    <button class="btn-logout" onclick="AccountManager.secureLogout()">
        <i class="fa-solid fa-power-off"></i> Logout
    </button>

    <script src="supabase.js"></script>
    <script>
        "use strict";

        function toggleMenu(btn) {
            const group = btn.parentElement;
            const isActive = group.classList.contains('active');
            document.querySelectorAll('.menu-group').forEach(el => el.classList.remove('active'));
            if (!isActive) group.classList.add('active');
        }

        const AccountManager = (function() {
            const DOM = {
                loader: document.getElementById('loader'),
                userName: document.getElementById('userName'),
                userPhone: document.getElementById('userPhone'),
                walletBalance: document.getElementById('walletBalance')
            };

            async function initialize() {
                const token = localStorage.getItem('tidye_session_token');
                if (!token) { secureLogout(); return; }

                try {
                    // 1. Fetch Profile info ku settings-api
                    const profilePromise = fetch(`${window.SUPABASE_URL}/functions/v1/settings-api`, {
                        method: 'GET',
                        headers: { 'Authorization': `Bearer ${token}` }
                    }).then(res => res.status === 401 ? secureLogout() : res.json());

                    // 2. Fetch Wallet balance ku wallet-api
                    const walletPromise = fetch(`${window.SUPABASE_URL}/functions/v1/wallet-api`, {
                        method: 'GET',
                        headers: { 'Authorization': `Bearer ${token}` }
                    }).then(res => res.ok ? res.json() : { balance: 0.00 });

                    // Run zontse pamodzi kuti website iziwerenga mwachangu
                    const [profileData, walletData] = await Promise.all([profilePromise, walletPromise]);

                    if (profileData) {
                        DOM.userName.textContent = profileData.username || "Tidye Player";
                        DOM.userPhone.textContent = profileData.phone_number || "No number";
                    }

                    if (walletData) {
                        const formattedBalance = Number(walletData.balance).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                        DOM.walletBalance.textContent = `MWK ${formattedBalance}`;
                    }

                } catch (err) {
                    console.error("Initialization failed:", err);
                } finally {
                    setTimeout(() => {
                        DOM.loader.style.opacity = '0';
                        setTimeout(() => DOM.loader.style.display = 'none', 300);
                    }, 400);
                }
            }

            function secureLogout() {
                localStorage.clear();
                window.location.replace('login.html');
            }

            return { init: initialize, secureLogout: secureLogout };
        })();

        document.addEventListener('DOMContentLoaded', AccountManager.init);
    </script>
</body>
</html>
