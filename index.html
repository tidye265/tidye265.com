            <!-- Sport Box -->
            <a href="matches.html" class="feature-box" aria-label="Explore Sports betting">
                <span class="feature-box-badge">LIVE ⚡</span>
                <img src="sports.jpg" alt="Sports betting at Tidye265"
                onerror="this.onerror=null; this.style.display='none'; this.parentElement.style.background='linear-gradient(135deg, #0d1b2a 0%, #1b2838 40%, #1a3a4a 100%)'; this.parentElement.querySelector('.feature-box-fallback').style.display='flex';">
                <div class="feature-box-fallback" style="display:none; position:absolute; top:0;left:0;width:100%;height:100%;z-index:1; align-items:center; justify-content:center; font-size:60px; color:rgba(255,215,0,0.3); pointer-events:none;">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 9l6-6 6 6"/>
                        <path d="M6 21v-7a6 6 0 0 1 12 0v7"/>
                    </svg>
                </div>
                <div class="feature-box-label">
                    <!-- Sport SVG icon (trophy) -->
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 9H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h2" stroke="#FFD700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M18 9h2a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-2" stroke="#FFD700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 17v4" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
                        <path d="M8 21h8" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
                        <path d="M12 3C9.5 3 7 7 7 12c0 0 2 3 5 3s5-3 5-3c0-5-2.5-9-5-9z" stroke="#FFD700" stroke-width="2" fill="none"/>
                        <circle cx="12" cy="12" r="2" fill="#FFD700"/>
                    </svg>
                    Sport
                </div>
            </a>
        </section>

        <!-- Important Links for SEO (kept for Google crawl) -->
        <div class="important-links">
            <a href="faq.html"><i class="bi bi-question-circle"></i> FAQ</a>
            <a href="terms.html"><i class="bi bi-file-text"></i> Terms</a>
            <a href="privacy.html"><i class="bi bi-shield-lock"></i> Privacy</a>
            <a href="login.html"><i class="bi bi-box-arrow-in-right"></i> Login</a>
            <a href="register.html"><i class="bi bi-person-plus"></i> Register</a>
        </div>
    </main>

    <!-- ========== LOGIN MODAL (shows when clicking sub-header links if not logged in) ========== -->
    <div class="login-modal-overlay" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="login-modal-card">
            <div class="login-modal-icon">
                <i class="bi bi-lock-fill"></i>
            </div>
            <h2 id="modalTitle" class="login-modal-title">Welcome to Tidye265</h2>
            <p class="login-modal-text">Please log in or create an account to access Live, Matches, Casino and more.</p>
            <div class="login-modal-buttons">
                <a href="login.html" class="modal-btn modal-btn-login">LOGIN</a>
                <a href="register.html" class="modal-btn modal-btn-join">JOIN NOW</a>
            </div>
            <button class="modal-close-btn" id="closeModalBtn">Maybe later</button>
        </div>
    </div>

    <!-- ========== FOOTER (loaded from footer.html) ========== -->
    <footer id="footer-placeholder" role="contentinfo"></footer>

    <!-- ========== SCRIPTS ========== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        // ========== AUTO-REDIRECT: Logged-in users go straight to dashboard ==========
        (function checkSessionAndRedirect() {
            const sessionToken = localStorage.getItem('tidye_session_token');
            if (sessionToken) {
                window.location.replace('dashboard.html');
                throw new Error('SESSION_REDIRECT');
            }
        })();

        const AppState = {
            stillLoading: true,
            maintenanceMode: false
        };

        const loader = document.getElementById('loader');
        const errorContainer = document.getElementById('errorContainer');
        const mainLogo = document.getElementById('mainLogo');
        const loginModal = document.getElementById('loginModal');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // Logo fallback
        if (mainLogo) {
            mainLogo.addEventListener('error', () => {
                mainLogo.src = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22150%22 height=%2248%22%3E%3Crect fill=%22%231a1d21%22 width=%22150%22 height=%2248%22 rx=%228%22/%3E%3Ctext fill=%22%23FFD700%22 x=%2275%22 y=%2230%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22bold%22 font-size=%2216%22%3ETidye265%3C/text%3E%3C/svg%3E';
            });
        }

        // Telemetry
        function trackUserTelemetry(eventType, metadata = {}) {
            console.log(`[TELEMETRY]:`, { event: eventType, timestamp: new Date().toISOString(), ...metadata });
        }

        // Error display
        function showAppError(type, message) {
            if (!errorContainer) return;
            errorContainer.style.display = 'block';
            const title = type === 'offline' ? 'Network Disconnected' : 'Maintenance Window Active';
            errorContainer.innerHTML = `
                <strong><i class="bi bi-exclamation-triangle-fill"></i> ${title}</strong>
                <p style="font-size:13px;">${message}</p>
                <button class="btn-retry" onclick="location.reload()"><i class="bi bi-arrow-clockwise"></i> Retry</button>
            `;
        }

        // Loader
        function dismissLoaderBackdrop() {
            AppState.stillLoading = false;
            if (loader) {
                loader.classList.add('fade-out');
                setTimeout(() => loader?.remove(), 400);
            }
        }

        // Search toggle
        const searchToggle = document.getElementById('searchToggle');
        const searchClose = document.getElementById('searchClose');
        const searchBar = document.getElementById('searchBar');
        const searchInput = document.getElementById('searchInput');

        searchToggle?.addEventListener('click', () => {
            searchBar?.classList.add('active');
            searchBar?.setAttribute('aria-hidden', 'false');
            setTimeout(() => searchInput?.focus(), 150);
        });

        searchClose?.addEventListener('click', () => {
            searchBar?.classList.remove('active');
            searchBar?.setAttribute('aria-hidden', 'true');
            if (searchInput) searchInput.value = '';
        });

        searchInput?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && searchInput.value.trim()) {
                const query = encodeURIComponent(searchInput.value.trim());
                trackUserTelemetry('search_submitted', { query });
                window.location.href = `matches.html?search=${query}`;
            }
        });

        // ========== SUB-HEADER INTERCEPT (show login modal for non-logged-in users) ==========
        function interceptSubHeaderClicks() {
            const subItems = document.querySelectorAll('#categoryNav .sub-item');
            subItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    // Check if user is logged in (we already redirected if token exists, but double-check)
                    const token = localStorage.getItem('tidye_session_token');
                    if (!token) {
                        e.preventDefault();
                        // Show login modal
                        loginModal?.classList.add('show');
                        trackUserTelemetry('modal_triggered', { category: this.getAttribute('data-category') });
                    }
                    // If token exists, they wouldn't be on this page anyway (redirected), but let it pass.
                });
            });
        }

        // Close modal
        closeModalBtn?.addEventListener('click', () => {
            loginModal?.classList.remove('show');
        });
        // Close modal when clicking outside the card
        loginModal?.addEventListener('click', (e) => {
            if (e.target === loginModal) {
                loginModal.classList.remove('show');
            }
        });

        // Also intercept the two big feature boxes? They can remain direct links because they are part of the content.
        // No need to intercept.

        // Active sub-header state
        function updateSubHeaderActive() {
            const currentPath = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('#categoryNav .sub-item').forEach(item => {
                const href = item.getAttribute('href') || '';
                item.classList.remove('active');
                item.removeAttribute('aria-current');
                if (href && currentPath.includes(href.replace('.html', '')) && href !== '#') {
                    item.classList.add('active');
                    item.setAttribute('aria-current', 'page');
                }
            });
        }

        // Verify session (for auth button display, though redirect already handled)
        async function verifyUserSessionAllocation() {
            try {
                if (typeof window.supabaseClient !== 'undefined') {
                    const { data: { session } } = await window.supabaseClient.auth.getSession();
                    if (session) {
                        const loginBtn = document.querySelector('.btn-login');
                        const joinBtn = document.getElementById('btnJoin');
                        if (loginBtn) loginBtn.style.display = 'none';
                        if (joinBtn) {
                            joinBtn.innerText = 'DASHBOARD';
                            joinBtn.href = 'dashboard.html';
                            joinBtn.classList.add('btn-dashboard');
                        }
                    }
                }
            } catch (e) {
                console.error("[SESSION CHECK ERROR]:", e);
            }
        }

        // Footer injection from footer.html
        async function processFooterModularInjection() {
            try {
                const response = await fetch('footer.html');
                if (response.ok) {
                    const html = await response.text();
                    const placeholder = document.getElementById('footer-placeholder');
                    if (placeholder) {
                        placeholder.innerHTML = html;
                        // Execute any scripts inside footer
                        placeholder.querySelectorAll('script').forEach(oldScript => {
                            const newScript = document.createElement('script');
                            newScript.textContent = oldScript.textContent;
                            document.body.appendChild(newScript).parentNode.removeChild(newScript);
                        });
                    }
                }
            } catch (err) {
                console.error("[FOOTER ERROR]:", err);
            }
        }

        // Handle URL search param
        function handleIncomingURLSearchQuery() {
            const params = new URLSearchParams(window.location.search);
            const q = params.get('search');
            if (q && searchInput) {
                searchInput.value = q;
                searchBar?.classList.add('active');
                searchBar?.setAttribute('aria-hidden', 'false');
            }
        }

        // Network listeners
        window.addEventListener('online', () => {
            if (errorContainer) errorContainer.style.display = 'none';
            trackUserTelemetry('network_online');
        });
        window.addEventListener('offline', () => {
            showAppError('offline', "Network connection lost. Please check your internet connection.");
            trackUserTelemetry('network_offline');
        });

        // DOM ready
        document.addEventListener("DOMContentLoaded", () => {
            // Loader timeout
            setTimeout(() => {
                if (AppState.stillLoading) dismissLoaderBackdrop();
            }, 5000);

            updateSubHeaderActive();
            interceptSubHeaderClients(); // called
            verifyUserSessionAllocation();
            processFooterModularInjection();
            handleIncomingURLSearchQuery();

            // Dismiss loader after a short delay
            setTimeout(() => dismissLoaderBackdrop(), 700);

            trackUserTelemetry('index_page_view', { referrer: document.referrer || 'direct' });
        });

        // fix function name (typo above)
        function interceptSubHeaderClients() { interceptSubHeaderClicks(); }
        // replace with correct call
        document.addEventListener("DOMContentLoaded", () => {
            // already called above, but ensure
            interceptSubHeaderClicks();
        });
    </script>
</body>
</html>
