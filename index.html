<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>tidye265 | Professional Malawi Gaming & Trading</title>
    <meta name="theme-color" content="#FFD700">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Lexend:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #F8F9FA;
            --primary: #FFD700;
            --soft-black: #FFFFFF;
            --container-grey: #f0f2f5;
            --text-light: #1a1d21;
            --text-dim: #4b5563;
            --success: #10b981;
            --border: #e5e7eb;
            --footer-bg: #2E2F33; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text-light); font-family: 'Inter', sans-serif; padding-bottom: 90px; overflow-x: hidden; }
        
        #loader { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: var(--bg); 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            z-index: 9999; 
        }
        .loader-logo-big { height: 120px; width: auto; }

        /* HEADER UPDATED: Balance Container Inside, Search Icon Only */
        header { 
            padding: 0 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #fff; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            border-bottom: 1px solid var(--border); 
            height: 75px; 
        }
        .logo-container img { height: 45px; width: auto; object-fit: contain; }
        
        .header-balance {
            background: #f3f4f6;
            padding: 8px 12px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border);
            min-width: 120px;
        }
        .header-balance .bal-label { font-size: 8px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; display: block; line-height: 1; margin-bottom: 2px; }
        .header-balance .bal-amount { font-family: 'Lexend'; font-size: 13px; font-weight: 800; color: #000; }

        .header-actions { display: flex; align-items: center; gap: 15px; }
        .search-icon-btn { font-size: 18px; color: var(--text-dim); cursor: pointer; }

        /* GRID UPDATED: 2X2 Large Containers */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 0 20px;
        }
        .grid-item {
            background: var(--soft-black);
            height: 140px; /* Big size */
            border-radius: 20px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Lexend';
            font-size: 14px;
            font-weight: 700;
            color: var(--text-light);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: 0.3s;
        }
        .grid-item:active { transform: scale(0.96); }
        .grid-item i { font-size: 35px; color: var(--primary); margin-bottom: 12px; }

        .list-title { padding: 25px 20px 15px 20px; font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 14px; color: var(--text-dim); text-transform: uppercase; }

        /* FOOTER */
        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            background: var(--footer-bg); 
            display: flex; 
            justify-content: space-around; 
            align-items: center;
            padding: 8px 0 20px 0; 
            z-index: 1000; 
            height: 70px;
        }
        .nav-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: #ffffff; 
            text-decoration: none; 
            font-size: 9px; 
            font-family: 'Lexend'; 
        }
        .nav-item i { font-size: 18px; margin-bottom: 3px; }
        .nav-item.active { color: var(--primary); }

        .trade-btn-main { 
            width: 50px; 
            height: 50px; 
            background: var(--primary); 
            color: #000; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 10px; 
            font-weight: 800;
            font-family: 'Lexend';
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 20px; backdrop-filter: blur(4px); }
        .modal-content { background: #ffffff; padding: 30px; border-radius: 28px; width: 100%; max-width: 300px; text-align: center; }
        .modal-btn { background: var(--primary); color: #000; border: none; padding: 12px; border-radius: 12px; margin-top: 20px; font-weight: 700; width: 100%; }
    </style>
</head>
<body>
    
    <div id="loader">
        <img src="IMG_20260504_221316.jpg" alt="tidye265" class="loader-logo-big">
        <div style="margin-top: 15px; font-family: 'Lexend'; font-size: 11px; color: var(--text-dim); letter-spacing: 1px;">LOADING...</div>
    </div>

    <header>
        <div class="logo-container">
            <img src="IMG_20260504_221316.jpg" alt="tidye265">
        </div>

        <div class="header-balance">
            <span class="bal-label">Available Balance</span>
            <span class="bal-amount">MWK 1,250,496</span>
        </div>

        <div class="header-actions">
            <i class="fa-solid fa-magnifying-glass search-icon-btn" onclick="showSoon()"></i>
        </div>
    </header>

    <div class="list-title">265 Pool (Casino)</div>
    <div class="grid-container">
        <div class="grid-item" onclick="showSoon()"><i class="fa-solid fa-clover"></i>Slot</div>
        <div class="grid-item" onclick="showSoon()"><i class="fa-solid fa-diamond"></i>Poker</div>
        <div class="grid-item" onclick="showSoon()"><i class="fa-solid fa-circle-dot"></i>Dice</div>
        <div class="grid-item" onclick="showSoon()"><i class="fa-solid fa-star"></i>Crash</div>
    </div>

    <div class="list-title">265 P2P Games</div>
    <div class="grid-container" style="margin-bottom: 30px;">
        <div class="grid-item" onclick="showSoon()"><i class="fa-solid fa-chess"></i>Chess</div>
        <div class="grid-item" onclick="showSoon()"><i class="fa-solid fa-chess-board"></i>Draft</div>
        <div class="grid-item" onclick="showSoon()"><i class="fa-solid fa-table-cells"></i>Bawo</div>
        <div class="grid-item" onclick="showSoon()"><i class="fa-solid fa-gamepad"></i>Cards</div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="javascript:void(0)" class="nav-item" onclick="showSoon()">
            <i class="fa-solid fa-gamepad"></i>
            <span>Games</span>
        </a>
        <div class="trade-btn-container" onclick="showSoon()">
            <div class="trade-btn-main">
                <span>tidye</span>
            </div>
        </div>
        <a href="javascript:void(0)" class="nav-item" onclick="showSoon()">
            <i class="fa-solid fa-wallet"></i>
            <span>Wallet</span>
        </a>
        <a href="javascript:void(0)" class="nav-item" onclick="showSoon()">
            <i class="fa-solid fa-bars"></i>
            <span>Menu</span>
        </a>
    </nav>

    <div id="comingSoon" class="modal-overlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <i class="fa-solid fa-rocket" style="font-size: 40px; color: var(--primary); margin-bottom: 15px;"></i>
            <h3 style="font-family:'Lexend'; margin-bottom: 10px;">Coming Soon</h3>
            <p style="font-size:13px; color:var(--text-dim);">Tidye265 Game features are under development.</p>
            <button class="modal-btn" onclick="closeModal()">Got it</button>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                if(loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => { loader.style.display = 'none'; }, 500);
                }
            }, 800);
        });

        function showSoon() { document.getElementById('comingSoon').style.display = 'flex'; }
        function closeModal() { document.getElementById('comingSoon').style.display = 'none'; }
    </script>
</body>
</html>
