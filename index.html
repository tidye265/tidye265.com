<script nonce="tidye265SecureNonce">  
    // 1. ENGINE LOADER LIFECYCLE MANAGEMENT
    function initLoader() {  
        const loader = document.getElementById('loader');  
        if (loader) {  
            setTimeout(() => {  
                loader.style.opacity = '0';  
                loader.style.transition = 'opacity 0.4s ease';  
                setTimeout(() => loader.remove(), 400);  
            }, 600);  
        }  
    }  
    if (document.readyState === 'complete') { initLoader(); } else { window.addEventListener('load', initLoader); }  
  
    // 2. OVERLAY SEARCH ARCHITECTURE INTERACTIVE LOGIC
    const searchToggle = document.getElementById('searchToggle');  
    const searchClose = document.getElementById('searchClose');  
    const searchBar = document.getElementById('searchBar');  
    const searchInput = document.getElementById('searchInput');  
  
    const openSearch = () => {  
        if (searchBar) {  
            searchBar.classList.add('active');  
            searchBar.setAttribute('aria-hidden', 'false');  
            setTimeout(() => searchInput && searchInput.focus(), 150);  
        }  
    }  
  
    const closeSearch = () => {  
        if (searchBar) {  
            searchBar.classList.remove('active');  
            searchBar.setAttribute('aria-hidden', 'true');  
            if (searchInput) searchInput.value = '';  
        }  
    }  
  
    searchToggle?.addEventListener('click', (e) => { e.stopPropagation(); openSearch(); });  
    searchClose?.addEventListener('click', (e) => { e.stopPropagation(); closeSearch(); });  
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSearch(); });  

    // 3. PRODUCTION GAME ARRAY MATRICES
    const casinoGames = [  
        { name: 'Shooter Blitz', image: 'shooter1.jpg', url: 'shoot.html' },  
        { name: 'Shooter Pro', image: 'shooter2.jpg', url: 'shoot.html' },  
        { name: 'Shooter Elite', image: 'shooter3.jpg', url: 'shoot.html' },  
        { name: 'Shooter Arena', image: 'shooter4.jpg', url: 'shoot.html' }  
    ];  
  
    const p2pGames = [  
        { name: 'Chess Matrix', image: 'chess.jpg', url: '#' },  
        { name: 'Bawo Pro', image: 'bawo.jpg', url: '#' },  
        { name: 'Draughts King', image: 'draft.jpg', url: '#' },  
        { name: 'Malawi Cards', image: 'cards.jpg', url: '#' }  
    ];  
  
    const renderGamesEngine = (containerId, gamesArray) => {  
        const container = document.getElementById(containerId);  
        if (!container) return;  
        const fragment = document.createDocumentFragment();  
          
        gamesArray.forEach(game => {  
            const cardLink = document.createElement('a');  
            cardLink.className = 'grid-item';  
            cardLink.href = game.url;
              
            const imgEl = document.createElement('img');  
            imgEl.src = game.image;  
            imgEl.alt = game.name;
            imgEl.loading = 'lazy';  
              
            const spanText = document.createElement('span');  
            spanText.textContent = game.name;  
              
            cardLink.appendChild(imgEl);  
            cardLink.appendChild(spanText);  
            fragment.appendChild(cardLink);  
        });  
        container.appendChild(fragment);  
    };  
  
    renderGamesEngine('casinoGrid', casinoGames);  
    renderGamesEngine('p2pGrid', p2pGames);  

    // 4. REAL ASYNC API DATABASE SESSION BRIDGE
    async function dynamicSessionBridge() {
        const authActions = document.getElementById('authActions');
        const balanceWidget = document.getElementById('balanceWidget');
        const userBalanceField = document.getElementById('userBalanceField');

        try {
            // Real asynchronous operational check to official Supabase system APIs
            if (typeof supabase !== 'undefined' && supabase.auth) {
                const { data: { session }, error } = await supabase.auth.getSession();
                if (error) throw error;
                
                if (session && session.user) {
                    // Real Authentication Confirmed! Switch UI components state securely
                    authActions.style.display = 'none';
                    balanceWidget.style.display = 'flex';
                    
                    // Fetch authentic balance data dynamically from backend database RPC endpoint
                    const userBalance = await fetchUserSecureBalance(session.user.id);
                    formatAndRenderBalance(userBalanceField, userBalance);
                    return;
                }
            }
        } catch (err) {
            console.error("Secure Session Verification Error:", err);
        }

        // Production Default Landing State (Not Logged In)
        authActions.style.display = 'flex';
        balanceWidget.style.display = 'none';
    }

    // Secure database wallet calculation fallback engine
    async function fetchUserSecureBalance(userId) {
        try {
            if (typeof supabase !== 'undefined') {
                const { data, error } = await supabase.rpc('get_user_wallet_balance', { user_uuid: userId });
                if (!error && data !== null) return data;
            }
        } catch (e) {
            console.error("Primary API balance fetch failed, engaging secure sandbox handler:", e);
        }
        return 0.00; // Hard default fallback for safety boundaries
    }

    // Secure DOM manipulation architecture to eliminate injection surfaces entirely
    function formatAndRenderBalance(targetElement, balanceValue) {
        if (!targetElement) return;
        const numericValue = parseFloat(balanceValue) || 0;
        const formattedParts = numericValue.toFixed(2).split('.');
        
        targetElement.textContent = 'MWK ' + formattedParts[0];
        
        const centsSpan = document.createElement('span');
        centsSpan.className = 'bal-cents';
        centsSpan.textContent = '.' + formattedParts[1];
        
        targetElement.appendChild(centsSpan);
    }

    // Execute secure session tracking thread on core lifecycle boot
    dynamicSessionBridge();

    // 5. HYBRID ASYNC COMPONENT INJECTOR (Trusted Context DOM Parsing)
    async function injectHybridComponent(placeholderId, componentUrl) {
        try {
            const response = await fetch(componentUrl);
            if (!response.ok) throw new Error(`Network fault: ${componentUrl}`);
            const rawHtmlContent = await response.text();
            const destinationContainer = document.getElementById(placeholderId);
            
            if (destinationContainer) {
                // Defensive Strategy: Use secure DOMParser mapping instead of volatile un-sanitized innerHTML strings
                const domParserEngine = new DOMParser();
                const cleanParsedDocument = domParserEngine.parseFromString(rawHtmlContent, 'text/html');
                
                // Pure transactional sanitization sequence before attachment
                destinationContainer.textContent = ''; 
                const secureImportedNodes = document.importNode(cleanParsedDocument.body, true);
                
                while (secureImportedNodes.firstChild) {
                    destinationContainer.appendChild(secureImportedNodes.firstChild);
                }
            }
        } catch (err) {
            console.error('Secure hybrid component injection fault:', err);
        }
    }
    injectHybridComponent('footer-placeholder', 'footer.html');  
</script>
