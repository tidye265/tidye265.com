    <style>
        /* Global Structural Engineering tokens (Asungidwa 100%) */
        :root {

        .empty-state-card i { font-size: 24px; margin-bottom: 8px; color: #ccc; display: block; }

    <script>
        // 1. STATE MANAGEMENT LAYER
        const AppState = {
            catalog: [],
            stillLoading: true,
            maintenanceMode: false,
            selectedCategory: 'Trending' // Real senior live tracking mechanism
        };

        const loader = document.getElementById('loader');
        const errorContainer = document.getElementById('errorContainer');
        const mainLogo = document.getElementById('mainLogo');

        // Safe, non-inline image error handler configuration for global static views
        if(mainLogo) {
            mainLogo.addEventListener('error', function handlingLogoFallback() {
                this.src = 'https://via.placeholder.com/150?text=Tidye265';
            });
        }

        // 2. USER TELEMETRY COMPONENT WRAPPER
        function trackUserTelemetry(eventType, metadata = {}) {
            const payload = {
                event: eventType,
                timestamp: new Date().toISOString(),
                url: window.location.href,
                ...metadata
            };
            console.log(`[TELEMETRY LOG]:`, payload);
            // Space available for direct tracking client integrations (e.g., Mixpanel/PostHog API calls)
        }

        // 3. CORE INTERACTIVE RUNTIME APP ERROR & RECOVERY RENDER ENGINE
        function showAppError(type, message) {
            if (!errorContainer) return;
            errorContainer.style.display = 'block';

            let title = "Initialization Error";
            let ariaLabelAttr = "Platform infrastructure alert execution exception";

            if (type === 'offline') {
                title = "Network Disconnected";
                ariaLabelAttr = "System network interface state drop notification";
            } else if (type === 'maintenance') {
                title = "Maintenance Window Operational";
                ariaLabelAttr = "System security engineering maintenance active window";
            }

            errorContainer.setAttribute('aria-label', ariaLabelAttr);
            errorContainer.innerHTML = `
                <strong><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> ${title}</strong>
                <p style="font-size: 13px; line-height: 1.4;">${message}</p>
                <button class="btn-retry" id="appRetryBtn" aria-label="Trigger manual runtime components reboot">
                    <i class="fa-solid fa-arrow-rotate-right" aria-hidden="true"></i> Retry Connection
                </button>
            `;

            document.getElementById('appRetryBtn')?.addEventListener('click', () => {
                errorContainer.style.display = 'none';
                rebootPlatformLifecycle();
            });
        }

        // 4. HARD DETERMINISTIC LOADING LIFECYCLE WATCHDOG TIMEOUT
        function launchLoadingWatchdog() {
            setTimeout(() => {
                if (AppState.stillLoading) {
                    console.error("[CRITICAL TIMEOUT ERROR]: Edge pipeline response breached 8000ms ceiling.");
                    dismissLoaderBackdrop();
                    showAppError('offline', "Connection timed out. Please verify your data coverage status or network strength and tap retry.");
                }
            }, 8000); // Strict production window threshold allocation
        }

        // Dismiss Backdrop
        function dismissLoaderBackdrop() {
            AppState.stillLoading = false;
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 400);
            }
        }

        // 5. DEBOUNCE PATTERN ENGINE FOR OPTIMIZED KEYBOARD TYPING
        function debounce(callback, delayWindow) {
            let executionTimer;
            return function (...args) {
                clearTimeout(executionTimer);
                executionTimer = setTimeout(() => callback.apply(this, args), delayWindow);
            };
        }

        // 6. ADAPTIVE SEARCH LAYER MECHANICS (REAL CLIENT-SIDE FILTERING)
        const searchToggle = document.getElementById('searchToggle');
        const searchClose = document.getElementById('searchClose');
        const searchBar = document.getElementById('searchBar');
        const searchInput = document.getElementById('searchInput');

        searchToggle?.addEventListener('click', () => {
            searchBar?.classList.add('active');
            searchBar?.setAttribute('aria-hidden', 'false');
            setTimeout(() => searchInput?.focus(), 150);
        });

        searchClose?.addEventListener('click', () => {
            searchBar?.classList.remove('active');
            searchBar?.setAttribute('aria-hidden', 'true');
            if(searchInput) searchInput.value = '';
            executeLiveCatalogFilter('');
        });

        searchInput?.addEventListener('input', debounce((e) => {
            const QueryToken = e.target.value.trim();
            executeLiveCatalogFilter(QueryToken);
        }, 250)); // Fast tracking optimization threshold

        // 7. MULTI-CRITERIA ADVANCED FILTER CORE ENGINE
        function executeLiveCatalogFilter(queryString) {
            const normalizedQuery = queryString.toLowerCase();
            trackUserTelemetry('search_execution', { query: queryString, activeCategory: AppState.selectedCategory });

            const filtered = AppState.catalog.filter(game => {
                // Check title match allocation
                const matchesSearch = game.name.toLowerCase().includes(normalizedQuery);
                if (!matchesSearch) return false;

                // Check dynamic context categorization mapping
                if (AppState.selectedCategory === 'Trending') return true;

                // Clean dynamic text strings boundary matches
                const cleanCategoryTarget = AppState.selectedCategory.toLowerCase();
                const matchesNameCategorization = game.name.toLowerCase().includes(cleanCategoryTarget);
                const matchesObjectField = game.category_tag && game.category_tag.toLowerCase() === cleanCategoryTarget;

                return matchesNameCategorization || matchesObjectField;
            });

            const casinoSubset = filtered.filter(g => g.category === 'casino');
            const p2pSubset = filtered.filter(g => g.category === 'p2p');

            renderGamesGrid('casinoGrid', casinoSubset, "No matching casino items found.");
            renderGamesGrid('p2pGrid', p2pSubset, "No matching P2P products found.");
        }

        // 8. PRO ROUTING PATTERNS: PARSE URL SEARCH QUERIES FOR SEARCH ENGINE OPTIMIZATION
        function handleIncomingURLSearchQuery() {
            const structuralParameters = new URLSearchParams(window.location.search);
            const externalSearchQuery = structuralParameters.get('search');

            if (externalSearchQuery && searchInput) {
                searchInput.value = externalSearchQuery;
                searchBar?.classList.add('active');
                searchBar?.setAttribute('aria-hidden', 'false');
                executeLiveCatalogFilter(externalSearchQuery);
                trackUserTelemetry('seo_intent_parameter_triggered', { query: externalSearchQuery });
            }
        }

        // 9. LIVE CLIENT CATEGORY DESKTOP NAVIGATION INTERCEPTOR
        function linkCategoryInteractiveLayers() {
            const categoriesElements = document.querySelectorAll('#categoryNav .sub-item');
            categoriesElements.forEach(anchorNode => {
                if (anchorNode.getAttribute('href') === '#') {
                    anchorNode.addEventListener('click', (eventInstance) => {
                        eventInstance.preventDefault();

                        categoriesElements.forEach(node => {
                            node.classList.remove('active');
                            node.removeAttribute('aria-current');
                        });

                        anchorNode.classList.add('active');
                        anchorNode.setAttribute('aria-current', 'page');

                        // Safe injection target assignment execution
                        const selectedNameValue = anchorNode.textContent.trim();
                        AppState.selectedCategory = selectedNameValue;

                        executeLiveCatalogFilter(searchInput ? searchInput.value : '');
                    });
                }
            });
        }

        // 10. SEMANTIC ASYNC CORE EDGE CORE CONTENT LAYERS
        async function fetchDynamicGames() {
            console.log("[SYSTEM SYSTEM]: Invoking edge orchestration tier via boundary wrapper...");

            // Connectivity pre-flight health validation check
            if (!navigator.onLine) {
                dismissLoaderBackdrop();
                showAppError('offline', "You are currently offline. Check your mobile device cellular connection settings.");
                return;
            }

            try {
                if (typeof window.supabaseClient === 'undefined') {
                    throw new Error("window.supabaseClient instances match an undefined mapping allocation state.");
                }

                const response = await window.supabaseClient.functions.invoke('games_265', {
                    body: { action: 'get_public_catalog' }
                });

                console.log("[SYSTEM LOG]: Edge function returns raw envelope:", response);

                if (response.error) {
                    throw new Error(`Edge Core Isolation Fail: ${response.error.message || 'Network stream error standard exception'}`);
                }

                const payloadResult = response.data;
                if (!payloadResult || payloadResult.success === false) {
                    // Handling Maintenance Flag structures dynamically returned from administrative variables
                    if(payloadResult?.maintenance === true || AppState.maintenanceMode) {
                        showAppError('maintenance', "Tidye265 is undergoing server capacity updates. Back shortly.");
                        return;
                    }
                    throw new Error(`Business Layer Rejection: ${payloadResult?.error || 'Malformed API structure detected'}`);
                }

                const catalogPayload = payloadResult.data || [];
                AppState.catalog = catalogPayload; // Inject inside operational registry state memory

                trackUserTelemetry('catalog_retrieval_success', { totalRecords: catalogPayload.length });

                // Run structural template compilation wrappers
                const casinoRecords = catalogPayload.filter(g => g.category === 'casino');
                const p2pRecords = catalogPayload.filter(g => g.category === 'p2p');

                renderGamesGrid('casinoGrid', casinoRecords, "No active games found inside the casino collection.");
                renderGamesGrid('p2pGrid', p2pRecords, "No active products mapped inside the P2P game portfolio.");

                // Launch Pro Integration layers cleanly upon catalog assembly completion
                handleIncomingURLSearchQuery();

            } catch (executionError) {
                console.error("[CRITICAL CORE PERSISTENCE LAYER FAULT]:", executionError);
                showAppError('generic', executionError.message);
            } finally {
                dismissLoaderBackdrop();
            }
        }

        // 11. SEMANTIC DOCUMENT OBJECT OBJECT MODULAR BUILDER (NO INLINE INJECTIONS)
        function renderGamesGrid(containerId, dataArray, emptyStateMessage) {
            const targetSection = document.getElementById(containerId);
            if (!targetSection) return;
            targetSection.innerHTML = ''; // Safely wipe inner contexts cleanly

            // Real Empty States realization block logic execution
            if (!dataArray || dataArray.length === 0) {
                const emptyCard = document.createElement('div');
                emptyCard.className = 'empty-state-card';
                emptyCard.setAttribute('role', 'status');
                emptyCard.innerHTML = `
                    <i class="fa-solid fa-folder-open" aria-hidden="true"></i>
                    <p>${emptyStateMessage}</p>
                `;
                targetSection.appendChild(emptyCard);
                return;
            }

            // Programmatic dynamic creation tree bypassing inline strings injection hazards
            dataArray.forEach((gameItem, iterationIndex) => {
                const cardAnchor = document.createElement('a');
                cardAnchor.className = 'grid-item';
                cardAnchor.href = gameItem.game_url || '#';
                cardAnchor.setAttribute('tabindex', '0');
                cardAnchor.setAttribute('role', 'link');
                cardAnchor.setAttribute('aria-label', `Play ${gameItem.name} processing link activation`);

                // Attach explicit structural keyboard navigation bindings for accessibility profiles
                cardAnchor.addEventListener('keydown', (eventKey) => {
                    if (eventKey.key === 'Enter' || eventKey.key === ' ') {
                        eventKey.preventDefault();
                        cardAnchor.click();
                    }
                });

                // Inline telemetry click stream captures
                cardAnchor.addEventListener('click', (event) => {
                    trackUserTelemetry('game_card_click', {
                        gameId: gameItem.id,
                        gameName: gameItem.name,
                        indexPosition: iterationIndex
                    });
                });

                const gameImage = document.createElement('img');
                const calculatedImgPath = gameItem.image_url.startsWith('http') ? gameItem.image_url : `./${gameItem.image_url}`;
                gameImage.src = calculatedImgPath;
                gameImage.alt = `Visual capture layout configuration banner for ${gameItem.name}`;
                gameImage.loading = 'lazy';

                // Absolute elimination of direct inline error bindings via programmatic encapsulation
                gameImage.addEventListener('error', function handlingFallbackImage() {
                    this.src = 'https://via.placeholder.com/300x160?text=Image+Unavailable';
                    console.warn(`[IMAGE LOAD WARNING]: Asset resolution fail for location stream: ${calculatedImgPath}`);
                });

                const gameTitleSpan = document.createElement('span');
                gameTitleSpan.textContent = gameItem.name;

                // Chain component hierarchies structurally inside DOM contexts
                cardAnchor.appendChild(gameImage);
                cardAnchor.appendChild(gameTitleSpan);
                targetSection.appendChild(cardAnchor);
            });
        }

        // 12. IDENTITY SECURITY BOUNDARY STATE AUDITS
        async function verifyUserSessionAllocation() {
            try {
                if (typeof window.supabaseClient !== 'undefined') {
                    const { data: { session } } = await window.supabaseClient.auth.getSession();
                    if (session) {
                        trackUserTelemetry('active_session_verified', { userIdentifier: session.user.id });
                        const joinBtn = document.querySelector('.btn-join');
                        const loginBtn = document.querySelector('.btn-login');
                        if(loginBtn) loginBtn.style.display = 'none';
                        if(joinBtn) {
                            joinBtn.innerText = 'DASHBOARD';
                            joinBtn.href = 'dashboard.html';
                            joinBtn.setAttribute('aria-label', 'Navigate towards administration desktop platform panels');
                        }
                    }
                }
            } catch (sessionEx) {
                console.error("[SESSION ACQUISITION PROCESS INTERRUPTION]:", sessionEx);
            }
        }

        // 13. MODULAR INJECTION STRUCTURAL FOOTER PIPELINES
        async function processFooterModularInjection() {
            try {
                const systemFetchResponse = await fetch('footer.html');
                if (systemFetchResponse.ok) {
                    const convertedRawText = systemFetchResponse.text();
                    const structuralTargetPlaceholder = document.getElementById('footer-placeholder');
                    if(structuralTargetPlaceholder) {
                        structuralTargetPlaceholder.innerHTML = await convertedRawText;
                        const activeEmbeddedScripts = structuralTargetPlaceholder.querySelectorAll('script');
                        activeEmbeddedScripts.forEach(historicalScriptNode => {
                            const executableScriptTag = document.createElement('script');
                            executableScriptTag.textContent = historicalScriptNode.textContent;
                            document.body.appendChild(executableScriptTag).parentNode.removeChild(executableScriptTag);
                        });
                    }
                }
            } catch (footerCaptureException) {
                console.error("[FOOTER SUBSYSTEM INJECTION BLOCK INTERRUPTION]:", footerCaptureException);
            }
        }

        // Global unified recovery bootstrapping mechanism logic
        function rebootPlatformLifecycle() {
            if(!AppState.stillLoading) {
                window.location.reload();
                return;
            }
            fetchDynamicGames();
        }

        // Handle environment device hardware online switches actively via browser states
        window.addEventListener('online', () => {
            if(errorContainer) errorContainer.style.display = 'none';
            console.log("[NETWORK CHANGE STATE]: Client browser recovered online socket interfaces.");
        });
        window.addEventListener('offline', () => {
            showAppError('offline', "Network connection terminated context updates. Please re-enable dynamic connection toggles.");
        });

        // 14. BIND SYSTEM START EVENTS UNIFIED SEQUENCE
        document.addEventListener("DOMContentLoaded", () => {
            launchLoadingWatchdog();
            linkCategoryInteractiveLayers(); // Mount high performance filters layout
            fetchDynamicGames();
            verifyUserSessionAllocation();
            processFooterModularInjection();
        });
    </script>
</body>
</html>
