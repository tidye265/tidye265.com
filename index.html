<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>tidye265 | Professional Malawi Crypto Trading</title>
    <meta name="description" content="tidye265 - The leading professional crypto trading platform in Malawi. Trade BTC, ETH, and USDT with ease.">
    <meta name="keywords" content="Crypto Malawi, Bitcoin Malawi, tidye265, Trade Bitcoin MWK, Malawi Crypto Exchange">
    <meta name="author" content="tidye265 Dev Team">
    <meta name="theme-color" content="#FFD700">

    <meta property="og:title" content="tidye265 | Professional Trading">
    <meta property="og:description" content="Trade assets in real-time with tidye265 Live.">
    <meta property="og:image" content="logo.png">
    <meta property="og:url" content="https://testing.page.gd">
    <meta property="og:type" content="website">

    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Lexend:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #F8F9FA; /* Light Mode Background */
            --primary: #FFD700; /* Gold/Yellow Color */
            --soft-black: #FFFFFF; /* Light Card background */
            --container-grey: #f0f2f5;
            --text-light: #1a1d21; /* Dark text for Light Mode */
            --text-dim: #4b5563;
            --success: #10b981;
            --border: #e5e7eb;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text-light); font-family: 'Inter', sans-serif; padding-bottom: 110px; overflow-x: hidden; }
        
        #loader { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: var(--bg); 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            z-index: 9999; 
            transition: 0.6s ease-in-out; 
        }

        .loader-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 200px;
            height: 200px;
        }

        .loader-logo-big {
            height: 120px; 
            width: auto;
            z-index: 10;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.2));
            animation: pulseLogo 2s ease-in-out infinite;
        }

        .custom-loader {
            position: absolute;
            transform: rotateZ(45deg);
            perspective: 1000px;
            border-radius: 50%;
            width: 180px; 
            height: 180px;
            color: var(--text-light);
        }
        .custom-loader:before,
        .custom-loader:after {
            content: '';
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: inherit;
            height: inherit;
            border-radius: 50%;
            transform: rotateX(70deg);
            animation: 1s spin linear infinite;
        }
        .custom-loader:after {
            color: var(--primary);
            transform: rotateY(70deg);
            animation-delay: .4s;
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        @keyframes spin {
            0%, 100% { box-shadow: .3em 0px 0 0px currentcolor; }
            12% { box-shadow: .3em .3em 0 0 currentcolor; }
            25% { box-shadow: 0 .3em 0 0px currentcolor; }
            37% { box-shadow: -.3em .3em 0 0 currentcolor; }
            50% { box-shadow: -.3em 0 0 0 currentcolor; }
            62% { box-shadow: -.3em -.3em 0 0 currentcolor; }
            75% { box-shadow: 0px -.3em 0 0 currentcolor; }
            87% { box-shadow: .3em -.3em 0 0 currentcolor; }
        }

        header { 
            padding: 0 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(255, 255, 255, 0.98); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            border-bottom: 1px solid var(--border); 
            height: 75px; 
        }

        .logo-container {
            display: flex;
            align-items: center;
            height: 100%;
        }
        .logo-container img {
            height: 92px; 
            width: auto;
            object-fit: contain;
            margin-top: 5px;
        }

        .top-right-icons { display: flex; align-items: center; gap: 18px; }
        .bell-box { position: relative; cursor: pointer; }
        .bell-dot { position: absolute; top: -2px; right: -2px; width: 7px; height: 7px; background: #ff4d4d; border-radius: 50%; border: 1.5px solid white; }
        .top-right-icons i { font-size: 18px; color: var(--text-dim); transition: 0.3s; cursor: pointer; }

        .search-overlay {
            position: fixed;
            top: 75px;
            left: 0;
            width: 100%;
            background: rgba(248, 249, 250, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            z-index: 999;
            transform: translateY(-150%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 1px solid var(--border);
        }
        .search-overlay.active { transform: translateY(0); }
        .search-box {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            height: 45px;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: var(--text-light);
            width: 100%;
            padding: 10px;
            outline: none;
            font-size: 14px;
        }

        .list-title { padding: 15px 20px 10px 20px; font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 12px; color: var(--text-dim); text-transform: uppercase; }
        .asset-row { background: var(--soft-black); padding: 15px; border-radius: 18px; margin: 0 20px 10px 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); text-decoration: none; color: inherit; transition: 0.3s; }
        .asset-info { display: flex; align-items: center; gap: 12px; }
        .asset-icon { width: 40px; height: 40px; background: var(--container-grey); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 20px; }
        .asset-name { font-family: 'Lexend'; font-weight: 700; font-size: 14px; }
        .asset-sub { color: var(--text-dim); font-size: 11px; }
        .price-box { text-align: right; }
        .price-now { font-family: 'Lexend'; font-weight: 700; font-size: 15px; }
        .price-up { color: var(--success); font-size: 11px; font-weight: 700; }
    </style>
</head>
<body>
    
    <div id="loader">
        <div class="loader-wrapper">
            <div class="custom-loader"></div>
            <img src="logo.png" alt="tidye265" class="loader-logo-big">
        </div>
        <div style="margin-top: 20px; font-family: 'Lexend'; font-size: 12px; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; font-weight: 600;">
            Loading..
        </div>
    </div>

    <header>
        <div class="logo-container">
            <img src="logo.png" alt="tidye265 Logo">
        </div>
        <div class="top-right-icons">
            <i class="fa-solid fa-magnifying-glass" id="searchToggle"></i>
            <div class="bell-box" onclick="showSoon()">
                <i class="fa-solid fa-bell"></i>
                <div class="bell-dot"></div>
            </div>
        </div>
    </header>

    <div class="search-overlay" id="searchBar">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search assets..." onkeyup="filterAssets()">
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                if(loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => { loader.style.display = 'none'; }, 600);
                }
            }, 1500);
        });

        const searchToggle = document.getElementById('searchToggle');
        const searchBar = document.getElementById('searchBar');
        const searchInput = document.getElementById('searchInput');

        if(searchToggle) {
            searchToggle.addEventListener('click', () => {
                searchBar.classList.toggle('active');
                if(searchBar.classList.contains('active')) {
                    searchInput.focus();
                }
            });
        }

        function filterAssets() {
            let filter = searchInput.value.toUpperCase();
            let assets = document.getElementsByClassName('asset-row');
            for (let i = 0; i < assets.length; i++) {
                let name = assets[i].getElementsByClassName('asset-name')[0];
                let sub = assets[i].getElementsByClassName('asset-sub')[0];
                if (name || sub) {
                    let textValue = (name.textContent || name.innerText) + (sub.textContent || sub.innerText);
                    assets[i].style.display = textValue.toUpperCase().indexOf(filter) > -1 ? "" : "none";
                }
            }
        }
    </script>
