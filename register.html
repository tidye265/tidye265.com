<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - Tidye265</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
    --gold:#FFD700;
    --dark:#111827;
    --gray:#6b7280;
    --soft:#f3f4f6;
    --border:#e5e7eb;
    --success:#10b981;
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}
body{
    background:#fff;
    color:var(--dark);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
    padding-bottom:90px;
}
/* HEADER */
.top-header{
    height:72px;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
    background:#fff;
}
.logo img{
    height:42px;
    border-radius:8px;
}
.login-btn{
    text-decoration:none;
    border:1.5px solid var(--dark);
    color:var(--dark);
    padding:9px 18px;
    border-radius:10px;
    font-size:13px;
    font-family:'Lexend';
    font-weight:700;
}
/* MAIN */
.register-wrapper{
    width:100%;
    max-width:420px;
    margin:0 auto;
    padding:35px 20px 40px;
}
.steps{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:40px;
    font-family:'Lexend';
    font-size:13px;
}
.circle{
    width:24px;
    height:24px;
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:var(--gold);
    font-size:11px;
    font-weight:700;
    margin-right:6px;
}
.line{
    width:35px;
    height:1px;
    background:#d1d5db;
    margin:0 12px;
}
.inactive{
    color:var(--gray);
}
.inactive .circle{
    background:#fff;
    border:1px solid #d1d5db;
}
.title{
    margin-bottom:30px;
}
.title h1{
    font-family:'Lexend';
    font-size:30px;
    line-height:1.2;
    margin-bottom:10px;
}
.title p{
    color:var(--gray);
    font-size:14px;
}
.register-form{
    display:flex;
    flex-direction:column;
    gap:18px;
}
.input-box{
    position:relative;
}
.input-box input{
    width:100%;
    height:56px;
    border:none;
    outline:none;
    background:var(--soft);
    border:1.5px solid transparent;
    border-radius:14px;
    padding:0 16px;
    font-size:15px;
    font-family:'Inter';
    transition:0.25s ease;
}
.input-box input:focus{
    background:#fff;
    border-color:var(--dark);
    box-shadow:0 8px 25px rgba(0,0,0,0.05);
}
/* PHONE */
.phone-box img{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    width:26px;
    height:18px;
    object-fit:cover;
    border-radius:2px;
    z-index:2;
}
.phone-box input{
    padding-left:58px;
}
/* LEGAL */
.legal{
    display:flex;
    align-items:flex-start;
    gap:10px;
}
.legal input{
    margin-top:3px;
    width:18px;
    height:18px;
    accent-color:#111827;
}
.legal p{
    font-size:13px;
    color:var(--gray);
    line-height:1.5;
}
/* BUTTON */
.submit-btn{
    height:56px;
    border:none;
    border-radius:14px;
    background:var(--gold);
    color:#000;
    font-family:'Lexend';
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:0.2s ease;
}
/* UPDATED LOADING STATE: Gray background, disabled cursor */
.submit-btn.loading{
    background: #e5e7eb !important; 
    color: #9ca3af !important; 
    pointer-events: none;
    cursor: not-allowed;
    box-shadow: none;
}
.submit-btn:active{
    transform:scale(.98);
}
/* ALERT */
.alert{
    padding:15px;
    border-radius:12px;
    font-size:14px;
    display:none;
    margin-bottom: 20px;
}
.alert.success{
    background:#ecfdf5;
    color:#065f46;
    border:1px solid #a7f3d0;
}
.alert.error{
    background:#fef2f2;
    color:#991b1b;
    border:1px solid #fecaca;
}
/* FINISH */
.finish-screen{
    display:none;
    text-align:center;
    padding:60px 20px;
}
.finish-icon{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#ecfdf5;
    color:var(--success);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    margin:0 auto 25px;
}
.finish-screen h2{
    font-family:'Lexend';
    margin-bottom:10px;
    font-size:28px;
}
.finish-screen p{
    color:var(--gray);
    line-height:1.6;
    font-size:14px;
}
</style>
</head>
<body>

<div class="top-header">
    <a href="index.html" class="logo">
        <img src="logo.jpg" alt="Tidye265">
    </a>
    <a href="login.html" class="login-btn">
        LOGIN
    </a>
</div>

<div class="register-wrapper" id="registerSection">
    <div class="steps">
        <span><span class="circle">1</span>Sign Up</span>
        <span class="line"></span>
        <span class="inactive"><span class="circle">2</span>Finish</span>
    </div>
    <div class="title">
        <h1>Create Account</h1>
        <p>Join Tidye265 and start playing professional Malawi games.</p>
    </div>
    <div id="alertBox" class="alert"></div>
    <form class="register-form" id="registerForm">
        <div class="input-box phone-box">
            <img src="https://flagcdn.com/w40/mw.png" alt="Malawi">
            <input type="tel" id="phone" placeholder="Phone Number" required>
        </div>
        <div class="input-box">
            <input type="password" id="pin" maxlength="6" inputmode="numeric" placeholder="Secret PIN" required>
        </div>
        <label class="legal">
            <input type="checkbox" required>
            <p>I confirm that I am <b>18 years or older</b> and I agree to the Terms of Service.</p>
        </label>
        <button type="submit" class="submit-btn" id="submitBtn">
            REGISTER NOW
        </button>
    </form>
</div>

<div class="finish-screen" id="finishScreen">
    <div class="finish-icon">
        <i class="fa-solid fa-check"></i>
    </div>
    <h2>Registration Successful</h2>
    <p>Your Tidye265 account has been created successfully.<br>Redirecting...</p>
</div>

<div id="footer-placeholder"></div>

<script src="supabase.js"></script>

<script>
const form = document.getElementById("registerForm");
const btn = document.getElementById("submitBtn");
const alertBox = document.getElementById("alertBox");
const registerSection = document.getElementById("registerSection");
const finishScreen = document.getElementById("finishScreen");

// Function to generate username like user_1GxVKKc
function generateCustomUsername() {
    const num = Math.floor(Math.random() * 9) + 1; // 1-9
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    let str = '';
    for (let i = 0; i < 7; i++) {
        str += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return `user_${num}${str}`;
}

form.addEventListener("submit", async function(e){
    e.preventDefault();
    let rawPhone = document.getElementById("phone").value.trim().replace(/\s+/g, '');
    const pin = document.getElementById("pin").value.trim();

    if(pin.length < 4){
        showAlert("PIN must be at least 4 digits", "error");
        return;
    }

    // UPDATED PHONE LOGIC: Format to 10 digits starting with 0
    let formattedPhone = rawPhone;
    if (formattedPhone.startsWith("+265")) {
        formattedPhone = "0" + formattedPhone.slice(4);
    } else if (formattedPhone.startsWith("265")) {
        formattedPhone = "0" + formattedPhone.slice(3);
    } else if (formattedPhone.length === 9 && /^[8934]/.test(formattedPhone)) {
        // ngati wayika 9 digits (mwa: 99xxxxxxx) wayambila ndi 9, 8, 3, or 4
        formattedPhone = "0" + formattedPhone;
    }

    // Now validate exactly 10 digits starting with 0
    const malawiRegex = /^0(88|99|98|89|97|31|41)\d{7}$/;
    if (!malawiRegex.test(formattedPhone)) {
        showAlert("Please enter a valid 9 or 10 digit Malawi phone number.", "error");
        return;
    }

    const username = generateCustomUsername(); // E.g., user_3Ppvxtt

    // CHANGE BUTTON TO GRAY PROCESSING STATE
    btn.classList.add("loading");
    btn.innerText = "Processing...";

    try {
        // 1. Check if the normalized phone number is already registered inside Supabase DB
        const checkResponse = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}?phone_number=eq.${encodeURIComponent(formattedPhone)}`, {
            method: "GET",
            headers: {
                "apikey": SUPABASE_ANON_KEY,
                "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
            }
        });

        if (!checkResponse.ok) {
            throw new Error("NETWORK_ISSUE");
        }

        const exactUsers = await checkResponse.json();
        if (exactUsers && exactUsers.length > 0) {
            throw new Error("DUPLICATE_PHONE"); // Ponyani error yadala kuti idzakhale caught pansi
        }

        // 2. Insert record safely if phone verification checks out completely clear
        const response = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}`, {
            method: "POST",
            headers: {
                "apikey": SUPABASE_ANON_KEY,
                "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
                "Content-Type": "application/json",
                "Prefer": "return=minimal"
            },
            body: JSON.stringify({
                username: username,
                phone_number: formattedPhone, 
                pin: pin,
                created_at: new Date().toISOString()
            })
        });

        // Supabase returns 409 Conflict if a unique constraint (like unique phone_number) fails
        if (response.status === 409) {
            throw new Error("DUPLICATE_PHONE");
        }
        if (!response.ok) {
            throw new Error("NETWORK_ISSUE");
        }

        localStorage.setItem("tidye_user", JSON.stringify({ username, phone: formattedPhone }));

        registerSection.style.display = "none";
        finishScreen.style.display = "block";

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 2500);

    } catch (error) {
        console.error("Supabase Operation Error:", error);
        
        // CUSTOM ERROR HANDLING
        if (error.message === "DUPLICATE_PHONE") {
            showAlert("Phone number is already registered.", "error");
        } else {
            showAlert("Network error! Please verify your database configurations.", "error");
        }
        
        // Re-enable button
        btn.classList.remove("loading");
        btn.innerText = "REGISTER NOW";
    }
});

function showAlert(msg, type){
    alertBox.style.display = "block";
    alertBox.className = "alert " + type;
    alertBox.innerText = msg;
    setTimeout(() => {
        alertBox.style.display = "none";
    }, 4000);
}

// HYBRID PLATFORM WAY: Inject Only footer.html Dynamically
async function injectFooterComponent() {
    try {
        const response = await fetch('footer.html');
        if (response.ok) {
            const rawHtml = await response.text();
            const placeholder = document.getElementById('footer-placeholder');
            placeholder.innerHTML = rawHtml;
            
            const scripts = placeholder.querySelectorAll('script');
            scripts.forEach(oldScript => {
                const newScript = document.createElement('script');
                newScript.textContent = oldScript.textContent;
                document.body.appendChild(newScript).parentNode.removeChild(newScript);
            });
        }
    } catch (err) {
        console.error("Failed to load hybrid footer element:", err);
    }
}
injectFooterComponent();
</script>
</body>
</html>
