    <script>
        // ========== SESSION CHECK – redirect if already logged in ==========
        function getCleanSessionToken() {
            let raw = localStorage.getItem('tidye_session_token');
            if (!raw || raw === 'null' || raw === 'undefined') return null;
            try {
                let p = JSON.parse(raw);
                if (p?.access_token) return p.access_token;
                if (typeof p === 'string') return p;
            } catch(e) {}
            return raw.replace(/^["']|["']$/g, '').trim();
        }

        async function checkExistingSession() {
            const token = getCleanSessionToken();
            if (!token) return;
            try {
                const res = await fetch(`${window.SUPABASE_URL}/functions/v1/wallet-api`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    window.location.href = 'dashboard.html';
                }
            } catch(e) {}
        }

        // ========== API LOCK (maintenance mode) ==========
        async function checkApiLock() {
            try {
                const response = await fetch(`${window.SUPABASE_URL}/functions/v1/api-lock`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${window.SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });
                if (!response.ok) return;
                const result = await response.json();
                if (result.locked) {
                    window.location.replace('updating.html');
                }
            } catch (e) {
                console.warn('API lock check failed:', e);
            }
        }

        // ========== LOGGING ==========
        const Logger = {
            info: (msg, data = {}) => console.log(`[INFO] ${new Date().toISOString()} - ${msg}`, data),
            warn: (msg, data = {}) => console.warn(`[WARN] ${new Date().toISOString()} - ${msg}`, data),
            error: (msg, data = {}) => console.error(`[ERROR] ${new Date().toISOString()} - ${msg}`, data)
        };

        // ========== DOM ELEMENTS ==========
        const form = document.getElementById('loginForm');
        const btn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');
        const passwordInput = document.getElementById('passwordInput');
        const togglePassword = document.getElementById('togglePassword');

        // Password view toggle
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            if (type === 'text') {
                togglePassword.classList.remove('bi-eye');
                togglePassword.classList.add('bi-eye-slash');
            } else {
                togglePassword.classList.remove('bi-eye-slash');
                togglePassword.classList.add('bi-eye');
            }
        });

        // ========== RATE LIMITING ==========
        function hitRateLimit() {
            const now = Date.now();
            let attempts = JSON.parse(localStorage.getItem('log_rate_limit') || '[]');
            attempts = attempts.filter(time => now - time < 3 * 60 * 1000);
            if (attempts.length >= 5) return false;
            attempts.push(now);
            localStorage.setItem('log_rate_limit', JSON.stringify(attempts));
            return true;
        }

        // ========== FORM SUBMIT ==========
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Honeypot protection
            if (document.getElementById('botSecurity').value !== "") {
                Logger.warn("Bot activity blocked via honeypot criteria.");
                return;
            }

            // Turnstile validation
            const turnstileResponse = document.querySelector('[name="cf-turnstile-response"]')?.value;
            if (!turnstileResponse) {
                showAlert("Please complete the security verification.", "error");
                return;
            }

            // Rate limiting
            if (!hitRateLimit()) {
                showAlert("Too many attempts. Locked for 3 minutes.", "error");
                return;
            }

            // Environment check
            if (typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined') {
                showAlert("System configuration error. Please try again later.", "error");
                Logger.error("Supabase credentials missing.");
                return;
            }

            let rawPhone = document.getElementById('phone').value.trim().replace(/\s+/g, '');
            const pin = passwordInput.value.trim();

            // Phone normalization
            if (rawPhone.startsWith("+265")) rawPhone = "0" + rawPhone.slice(4);
            else if (rawPhone.startsWith("265")) rawPhone = "0" + rawPhone.slice(3);
            else if (rawPhone.length === 9 && /^[8934]/.test(rawPhone)) rawPhone = "0" + rawPhone;

            const malawiRegex = /^0(88|99|98|89|97|31|41)\d{7}$/;
            if (!malawiRegex.test(rawPhone)) {
                showAlert("Enter a valid Malawi phone number (e.g. 088xxxxxxx)", "error");
                return;
            }

            // Loading state with double‑ring spinner
            btn.classList.add('loading');
            btn.innerHTML = '<div class="double-ring"></div> Loading..';

            try {
                Logger.info(`Login attempt for ${rawPhone}`);

                const response = await fetch(`${SUPABASE_URL}/functions/v1/login_265`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    },
                    body: JSON.stringify({
                        phone_number: rawPhone,
                        pin: pin,
                        turnstileToken: turnstileResponse
                    })
                });

                let dataResult = null;
                try { dataResult = await response.json(); } catch(e) {}

                if (!response.ok) {
                    const messageStr = dataResult?.error || `Server error: ${response.status}`;
                    throw new Error(messageStr);
                }

                if (dataResult.success && dataResult.sessionToken) {
                    localStorage.setItem('tidye_session_token', dataResult.sessionToken);
                    showAlert("Login successful! Redirecting...", "success");
                    Logger.info("Authentication validated, token stored.");
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1200);
                } else {
                    showAlert("Login succeeded but session token is missing. Contact support.", "error");
                    Logger.error("Login response missing sessionToken", dataResult);
                    btn.classList.remove('loading');
                    btn.innerText = 'LOGIN NOW';
                }

            } catch (error) {
                Logger.error("Authentication failed", error);
                
                if (error.message === "INVALID_CREDENTIALS") {
                    showAlert("The phone number or PIN you entered is incorrect.", "error");
                } else if (error.message.includes("Failed to fetch") || error.message.includes("NetworkError")) {
                    showAlert("Network error. Please check your connection and try again.", "error");
                } else {
                    showAlert(`Error: ${error.message}`, "error");
                }

                btn.classList.remove('loading');
                btn.innerText = 'LOGIN NOW';

                if (typeof turnstile !== 'undefined') turnstile.reset();
            }
        });

        function showAlert(msg, type) {
            alertBox.style.display = "block";
            alertBox.className = `alert ${type}`;
            alertBox.innerText = msg;
            if (type === 'success') {
                setTimeout(() => { alertBox.style.display = "none"; }, 4000);
            } else {
                setTimeout(() => { alertBox.style.display = "none"; }, 6000);
            }
        }

        // ========== OFFLINE DETECTION ==========
        function checkOffline() {
            const modal = document.getElementById('slowNetModal');
            if (!navigator.onLine) modal.classList.add('show');
            else modal.classList.remove('show');
        }

        // ========== FOOTER INJECTION (lightning fast) ==========
        async function injectFooter() {
            const placeholder = document.getElementById('footer-placeholder');
            if (!placeholder) return;
            // Use the pre‑fetched promise (started immediately above)
            const html = await footerPromise;
            if (html) {
                placeholder.innerHTML = html;
                // Re‑execute any scripts inside the footer
                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    document.body.appendChild(newScript).remove();
                });
            }
        }

        // ========== SEE MORE TOGGLE ==========
        function setupSeeMore() {
            const moreBtn = document.getElementById('seeMoreSubBtn');
            const subHeader = document.getElementById('categoryNav');
            if (moreBtn && subHeader) {
                moreBtn.addEventListener('click', e => {
                    e.preventDefault();
                    subHeader.classList.toggle('show-more');
                    moreBtn.querySelector('span').textContent = subHeader.classList.contains('show-more') ? 'Less' : 'See More';
                });
            }
        }

        // ========== INIT ==========
        document.addEventListener('DOMContentLoaded', async () => {
            checkOffline();
            await checkApiLock();
            await checkExistingSession();
            setupSeeMore();
            // Inject footer using the pre‑fetched promise – very fast
            injectFooter();

            window.addEventListener('offline', checkOffline);
            window.addEventListener('online', () => { checkOffline(); });
        });
    </script>
</body>
</html>
