<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
  
<meta http-equiv="X-Content-Type-Options" content="nosniff">  
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">  
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' https: data:; connect-src 'self' https://*.supabase.co; frame-src https://challenges.cloudflare.com;">  
  
<title>Create Account - Tidye265</title>  
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">  
  
<script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js" defer></script>  
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>  
  
<style>  
:root{  
    --gold:#FFD700;  
    --dark:#111827;  
    --gray:#6b7280;  
    --soft:#f3f4f6;  
    --border:#e5e7eb;  
    --success:#10b981;  
}  
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }  
body{ background:#fff; color:var(--dark); font-family:'Inter',sans-serif; overflow-x:hidden; padding-bottom:90px; }  
.honeypot-layer { opacity: 0; position: absolute; top: 0; left: 0; height: 0; width: 0; z-index: -1; }  
.top-header{ height:72px; padding:0 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); background:#fff; }  
.logo img{ height:42px; border-radius:8px; }  
.login-btn{ text-decoration:none; border:1.5px solid var(--dark); color:var(--dark); padding:9px 18px; border-radius:10px; font-size:13px; font-family:'Lexend'; font-weight:700; }  
.register-wrapper{ width:100%; max-width:420px; margin:0 auto; padding:35px 20px 40px; }  
.steps{ display:flex; align-items:center; justify-content:center; margin-bottom:40px; font-family:'Lexend'; font-size:13px; }  
.circle{ width:24px; height:24px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:var(--gold); font-size:11px; font-weight:700; margin-right:6px; }  
.line{ width:35px; height:1px; background:#d1d5db; margin:0 12px; }  
.inactive{ color:var(--gray); }  
.inactive .circle{ background:#fff; border:1px solid #d1d5db; }  
.title{ margin-bottom:30px; }  
.title h1{ font-family:'Lexend'; font-size:30px; line-height:1.2; margin-bottom:10px; }  
.title p{ color:var(--gray); font-size:14px; }  
.register-form{ display:flex; flex-direction:column; gap:18px; }  
.input-box{ position:relative; }  
.input-box input{ width:100%; height:56px; border:none; outline:none; background:var(--soft); border:1.5px solid transparent; border-radius:14px; padding:0 16px; font-size:15px; font-family:'Inter'; transition:0.25s ease; }  
.input-box input:focus{ background:#fff; border-color:var(--dark); box-shadow:0 8px 25px rgba(0,0,0,0.05); }  
.phone-box img{ position:absolute; left:16px; top:50%; transform:translateY(-50%); width:26px; height:18px; object-fit:cover; border-radius:2px; z-index:2; }  
.phone-box input{ padding-left:58px; }  
.legal{ display:flex; align-items:flex-start; gap:10px; }  
.legal input{ margin-top:3px; width:18px; height:18px; accent-color:#111827; }  
.legal p{ font-size:13px; color:var(--gray); line-height:1.5; }  
.turnstile-wrapper { display: flex; justify-content: center; margin: 5px 0; }  
.submit-btn{ height:56px; border:none; border-radius:14px; background:var(--gold); color:#000; font-family:'Lexend'; font-weight:700; font-size:15px; cursor:pointer; transition:0.2s ease; }  
.submit-btn.loading{ background: #e5e7eb !important; color: #9ca3af !important; pointer-events: none; cursor: not-allowed; box-shadow: none; }  
.submit-btn:active{ transform:scale(.98); }  
.alert{ padding:15px; border-radius:12px; font-size:14px; display:none; margin-bottom: 20px; }  
.alert.success{ background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }  
.alert.error{ background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }  
.finish-screen{ display:none; text-align:center; padding:60px 20px; }  
.finish-icon{ width:90px; height:90px; border-radius:50%; background:#ecfdf5; color:var(--success); display:flex; align-items:center; justify-content:center; font-size:40px; margin:0 auto 25px; }  
.finish-screen h2{ font-family:'Lexend'; margin-bottom:10px; font-size:28px; }  
.finish-screen p{ color:var(--gray); line-height:1.6; font-size:14px; }  
</style>  
</head>  
<body>  
  
<div class="top-header">  
    <a href="index.html" class="logo">  
        <img src="logo.jpg" alt="Tidye265">  
    </a>  
    <a href="login.html" class="login-btn">LOGIN</a>  
</div>  
  
<div class="register-wrapper" id="registerSection">  
    <div class="steps">  
        <span><span class="circle">1</span>Sign Up</span>  
        <span class="line"></span>  
        <span class="inactive"><span class="circle">2</span>Finish</span>  
    </div>  
    <div class="title">  
        <h1>Create Account</h1>  
        <p>Join Tidye265 and start playing professional Malawi games.</p>  
    </div>  
    <div id="alertBox" class="alert"></div>  
    <form class="register-form" id="registerForm">  
          
        <input type="text" name="b_firstname" id="botCheck" class="honeypot-layer" tabindex="-1" autocomplete="off">  
  
        <div class="input-box phone-box">  
            <img src="https://flagcdn.com/w40/mw.png" alt="Malawi">  
            <input type="tel" id="phone" placeholder="Phone Number" required>  
        </div>  
        <div class="input-box">  
            <input type="password" id="pin" maxlength="6" inputmode="numeric" placeholder="Secret PIN" required>  
        </div>  
        <label class="legal">  
            <input type="checkbox" required>  
            <p>I confirm that I am <b>18 years or older</b> and I agree to the Terms of Service.</p>  
        </label>  
          
        <div class="turnstile-wrapper">  
            <div class="cf-turnstile" data-sitekey="0x4AAAAAADQhPHJB5viRCO84"></div>  
        </div>  
  
        <button type="submit" class="submit-btn" id="submitBtn">REGISTER NOW</button>  
    </form>  
</div>  
  
<div class="finish-screen" id="finishScreen">  
    <div class="finish-icon"><i class="fa-solid fa-check"></i></div>  
    <h2>Registration Successful</h2>  
    <p>Your Tidye265 account has been created successfully.<br>Redirecting...</p>  
</div>  
  
<div id="footer-placeholder"></div>  
  
<script src="supabase.js"></script>  
  
<script>  
// ==========================================  
// 1. PROFESSIONAL LOGGING & ERROR HANDLING  
// ==========================================  
const Logger = {  
    info: (msg, data = {}) => console.log(`[INFO] ${new Date().toISOString()} - ${msg}`, data),  
    warn: (msg, data = {}) => console.warn(`[WARN] ${new Date().toISOString()} - ${msg}`, data),  
    error: (msg, data = {}) => console.error(`[ERROR] ${new Date().toISOString()} - ${msg}`, data)  
};  
  
window.addEventListener('error', (e) => Logger.error('Unhandled Exception', { message: e.message, file: e.filename }));  
window.addEventListener('unhandledrejection', (e) => Logger.error('Unhandled Promise', { reason: e.reason }));  
  
// ==========================================  
// 2. REAL SESSION CHECKER (Performance)  
// ==========================================  
document.addEventListener("DOMContentLoaded", () => {  
    const activeSession = localStorage.getItem("tidye_user");  
    if(activeSession) {  
        Logger.info("Active session detected. Redirecting to dashboard.");  
        window.location.replace("dashboard.html");  
    }  
});  
  
const form = document.getElementById("registerForm");  
const btn = document.getElementById("submitBtn");  
const alertBox = document.getElementById("alertBox");  
const registerSection = document.getElementById("registerSection");  
const finishScreen = document.getElementById("finishScreen");  
  
// ==========================================  
// 3. SECURE BCRYPT PIN HASHING (Argon2/Bcrypt Standard)  
// ==========================================  
async function hashSecurePIN(pin) {  
    return new Promise((resolve, reject) => {  
        try {  
            const salt = dcodeIO.bcrypt.genSaltSync(10);  
            const hash = dcodeIO.bcrypt.hashSync(pin, salt);  
            resolve(hash);  
        } catch (err) {  
            reject(err);  
        }  
    });  
}  
  
// 4. RATE LIMITER LOGIC  
function checkRateLimit() {  
    const now = Date.now();  
    let attempts = JSON.parse(localStorage.getItem('reg_rate_limit') || '[]');  
    attempts = attempts.filter(time => now - time < 5 * 60 * 1000);   
    if (attempts.length >= 5) return false;   
    attempts.push(now);  
    localStorage.setItem('reg_rate_limit', JSON.stringify(attempts));  
    return true;  
}  
  
function generateCustomUsername() {  
    const num = Math.floor(Math.random() * 9) + 1;   
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';  
    let str = '';  
    for (let i = 0; i < 7; i++) {  
        str += chars.charAt(Math.floor(Math.random() * chars.length));  
    }  
    return `user_${num}${str}`;  
}  
  
form.addEventListener("submit", async function(e){  
    e.preventDefault();  
  
    // A. ANTI-FRAUD: Honeypot Check  
    const botCheck = document.getElementById("botCheck").value;  
    if (botCheck !== "") {  
        Logger.warn("Bot detected via honeypot.");  
        return;   
    }  
  
    // B. ANTI-FRAUD: Cloudflare Turnstile Validation  
    const turnstileResponse = document.querySelector('[name="cf-turnstile-response"]')?.value;  
    if (!turnstileResponse) {  
        showAlert("Please complete the security verification.", "error");  
        return;  
    }  
  
    // C. RATE LIMITER  
    if (!checkRateLimit()) {  
        showAlert("Too many attempts. Please wait 5 minutes.", "error");  
        Logger.warn("Rate limit exceeded.");  
        return;  
    }  
  
    let rawPhone = document.getElementById("phone").value.trim().replace(/\s+/g, '');  
    const pin = document.getElementById("pin").value.trim();  
  
    if(pin.length < 4){  
        showAlert("PIN must be at least 4 digits", "error");  
        return;  
    }  
  
    let formattedPhone = rawPhone;  
    if (formattedPhone.startsWith("+265")) formattedPhone = "0" + formattedPhone.slice(4);  
    else if (formattedPhone.startsWith("265")) formattedPhone = "0" + formattedPhone.slice(3);  
    else if (formattedPhone.length === 9 && /^[8934]/.test(formattedPhone)) formattedPhone = "0" + formattedPhone;  
  
    const malawiRegex = /^0(88|99|98|89|97|31|41)\d{7}$/;  
    if (!malawiRegex.test(formattedPhone)) {  
        showAlert("Please enter a valid 9 or 10 digit Malawi phone number.", "error");  
        return;  
    }  
  
    const username = generateCustomUsername();   
  
    btn.classList.add("loading");  
    btn.innerText = "Processing...";  
  
    try {  
        Logger.info(`Starting secure registration for ${formattedPhone}`);  
        const hashedPIN = await hashSecurePIN(pin);  
  
        // =========================================================  
        // PRODUCTION UPDATE: CALLING EDGE FUNCTION INSTEAD OF DB  
        // =========================================================  
        const response = await fetch(`${SUPABASE_URL}/functions/v1/register_265`, {  
            method: "POST",  
            headers: {  
                "Content-Type": "application/json",  
                // Edge function requires Anon Key for invocation authorization  
                "Authorization": `Bearer ${SUPABASE_ANON_KEY}`   
            },  
            body: JSON.stringify({  
                username: username,  
                phone_number: formattedPhone,  
                pin: hashedPIN, // Strongly hashed via Bcrypt  
                turnstileToken: turnstileResponse // Sent to backend for secondary validation  
            })  
        });  
  
        const result = await response.json();  
  
        if (response.status === 409) throw new Error("DUPLICATE_PHONE");  
        if (!response.ok) throw new Error(result.error || "NETWORK_ISSUE");  
  
        Logger.info("Registration successful. Session fully secured.");  
        // Session fallback local (kuti zisabweretse error ngati backend cookie yachedwa)  
        localStorage.setItem("tidye_user", JSON.stringify({ username, phone: formattedPhone }));  
  
        registerSection.style.display = "none";  
        finishScreen.style.display = "block";  
  
        setTimeout(() => {  
            window.location.replace("dashboard.html");  
        }, 2500);  
  
    } catch (error) {  
        Logger.error("Registration Operation Failed", error);  
          
        if (error.message === "DUPLICATE_PHONE") {  
            showAlert("Phone number is already registered.", "error");  
        } else {  
            showAlert("Network error or security block! Please try again.", "error");  
        }  
          
        btn.classList.remove("loading");  
        btn.innerText = "REGISTER NOW";  
          
        if(typeof turnstile !== 'undefined') {  
            turnstile.reset();  
        }  
    }  
});  
  
function showAlert(msg, type){  
    alertBox.style.display = "block";  
    alertBox.className = "alert " + type;  
    alertBox.innerText = msg;  
    setTimeout(() => { alertBox.style.display = "none"; }, 4000);  
}  
  
// HYBRID COMPONENT LOADER  
async function injectFooterComponent() {  
    try {  
        const response = await fetch('footer.html');  
        if (response.ok) {  
            const rawHtml = await response.text();  
            const placeholder = document.getElementById('footer-placeholder');  
            placeholder.innerHTML = rawHtml;  
            const scripts = placeholder.querySelectorAll('script');  
            scripts.forEach(oldScript => {  
                const newScript = document.createElement('script');  
                newScript.textContent = oldScript.textContent;  
                document.body.appendChild(newScript).parentNode.removeChild(newScript);  
            });  
        }  
    } catch (err) {  
        Logger.error("Failed to load hybrid footer element", err);  
    }  
}  
injectFooterComponent();  
</script>  
</body>  
</html>
