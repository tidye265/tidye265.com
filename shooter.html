<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOOTER 265 | SUPER 3D EDITION</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* YOUR EXACT ORIGINAL CSS – KEEP UNCHANGED */
        :root {
            --sky-top: #050A1F;
            --sky-bottom: #0B1B3D;
            --red-main: #ff3b3b;
            --red-dark: #b30000;
            --red-deep: #7a0000;
            --white-glass: rgba(255, 255, 255, 0.7);
            --blue-light: #5bc0ff;
            --blue-main: #1a6dff;
            --blue-dark: #0033aa;
            --blue-glow: #00a6ff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100vh; width: 100vw; overflow: hidden; background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom)); font-family: 'Arial Black', sans-serif; }
        .game-header { position: absolute; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; z-index: 100; }
        .header-left { display: flex; gap: 15px; background: rgba(0,0,0,0.55); backdrop-filter: blur(8px); padding: 6px 18px; border-radius: 40px; border: 1px solid rgba(255,215,0,0.4); box-shadow: 0 8px 20px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1); }
        .pool-box, .rank-box { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: bold; color: #FFE6A3; text-shadow: 0 1px 2px black; }
        .pool-box i, .rank-box i { font-size: 14px; color: #FFD966; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .balance-box { background: rgba(0, 0, 0, 0.65); padding: 6px 14px; border-radius: 30px; color: #FFD966; border: 1px solid rgba(255,215,0,0.5); font-size: 14px; font-weight: bold; backdrop-filter: blur(4px); box-shadow: 0 5px 12px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2); }
        .balance-box i { margin-right: 6px; color: #FFD700; }
        .sound-toggle { background: rgba(0,0,0,0.6); border: none; color: #FFD966; font-size: 20px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; backdrop-filter: blur(4px); transition: 0.1s; }
        .sound-toggle:active { transform: scale(0.95); }
        .hamburger { display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
        .hamburger span { width: 25px; height: 3px; background: white; border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .timer-circle { position: absolute; top: 70px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: #0a1428; border: 3px solid #FFD700; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; color: #ffffff; text-shadow: 0 0 4px #0099ff; box-shadow: 0 0 12px rgba(0,160,255,0.4); z-index: 100; transition: all 0.2s ease; }
        .timer-circle.warning { background: #8b0000; border-color: #ff8800; color: #ffdd44; box-shadow: 0 0 18px red; animation: pulse-red 0.8s infinite; }
        @keyframes pulse-red { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.95; background: #b22222; } 100% { transform: scale(1); opacity: 1; } }
        #bgCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 35%, rgba(0,0,0,0.5) 100%); z-index: 2; pointer-events: none; }
        .ornament-container { position: absolute; top: 0; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; z-index: 5; animation: swing 4s ease-in-out infinite; transform-origin: top center; transition: left 0.1s linear; filter: drop-shadow(0 12px 20px rgba(0,0,0,0.4)); }
        .string { width: 4px; height: 110px; background: repeating-linear-gradient(45deg, #c0c0c0, #f0f0f0 5px, #a0a0a0 8px); box-shadow: 0 0 3px rgba(255,255,255,0.5), inset 0 0 2px black; border-radius: 2px; }
        .ring { width: 14px; height: 14px; border: 2px solid gold; border-radius: 50%; margin-top: -3px; background: rgba(255,215,0,0.2); box-shadow: 0 0 5px gold; }
        .cap { width: 16px; height: 9px; background: linear-gradient(135deg, #c0c0c0, #f0f0f0, #a0a0a0); border-radius: 4px 4px 2px 2px; margin-top: -6px; box-shadow: 0 2px 5px black; }
        .blue-3d-ball { width: 56px; height: 56px; border-radius: 50%; position: relative; background: radial-gradient(circle at 35% 35%, var(--blue-light) 0%, var(--blue-main) 50%, var(--blue-dark) 100%); box-shadow: 0 30px 40px rgba(0,0,0,0.4), inset -15px -15px 25px rgba(0,0,0,0.6), inset 12px 12px 30px rgba(255,255,255,0.5), 0 0 20px var(--blue-glow); transition: transform 0.05s linear; }
        .blue-3d-ball::before { content: ''; position: absolute; top: 12%; left: 18%; width: 38%; height: 28%; background: radial-gradient(ellipse, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 80%); border-radius: 50%; transform: rotate(-25deg); filter: blur(2px); }
        .blue-3d-ball::after { content: ''; position: absolute; bottom: 15%; right: 15%; width: 20%; height: 15%; background: radial-gradient(circle, rgba(255,255,255,0.6), transparent); border-radius: 50%; filter: blur(3px); }
        @keyframes swing { 0%, 100% { transform: translateX(-50%) rotate(-10deg); } 50% { transform: translateX(-50%) rotate(10deg); } }
        .shooter-wrapper { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; width: 170px; z-index: 10; filter: drop-shadow(0 15px 20px rgba(0,0,0,0.5)); }
        .nozzle { width: 44px; height: 22px; background: linear-gradient(145deg, #444, #888, #333); border-radius: 10px 10px 0 0; margin-bottom: -6px; box-shadow: inset 0 2px 3px rgba(255,255,255,0.3), 0 2px 4px black; }
        .shooter-base { width: 140px; height: 40px; background: linear-gradient(145deg, #b0b0b0, #707070, #505050); border-radius: 60% 60% 15px 15px; box-shadow: 0 15px 25px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.5); }
        .red-shooter-btn { width: 85px; height: 85px; border-radius: 50%; border: none; cursor: pointer; position: absolute; bottom: 20px; background: radial-gradient(circle at 40% 35%, #ff6666 0%, var(--red-main) 50%, var(--red-dark) 100%); box-shadow: 0 14px 0 var(--red-deep), 0 25px 35px rgba(0,0,0,0.7), inset 0 6px 12px var(--white-glass), inset 0 -12px 20px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; transition: all 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .go-text { color: white; font-size: 22px; text-transform: uppercase; text-shadow: 2px 3px 6px rgba(0,0,0,0.6); pointer-events: none; }
        .red-shooter-btn:active { transform: translateY(10px); box-shadow: 0 4px 0 var(--red-deep), 0 8px 20px rgba(0,0,0,0.6); }
        .marble { position: absolute; width: 22px; height: 22px; background: radial-gradient(circle at 30% 30%, #ff6b6b, #8b0000); border-radius: 50%; box-shadow: 0 3px 8px rgba(0,0,0,0.4); z-index: 8; }
        .particle { position: absolute; width: 7px; height: 7px; background: radial-gradient(circle, #ff4444, #aa0000); border-radius: 2px; pointer-events: none; z-index: 9; }
        .game-footer { position: absolute; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; z-index: 100; }
        .footer-left, .footer-right { display: flex; align-items: center; gap: 15px; background: rgba(0, 5, 30, 0.75); backdrop-filter: blur(10px); padding: 8px 18px; border-radius: 40px; color: #ffffff; border: 1px solid rgba(255,215,0,0.3); box-shadow: 0 6px 15px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15); font-size: 14px; font-weight: bold; }
        .footer-left i, .footer-right i { font-size: 16px; filter: drop-shadow(0 2px 3px black); }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); backdrop-filter: blur(16px); z-index: 200; display: flex; align-items: center; justify-content: center; visibility: hidden; opacity: 0; transition: 0.2s; }
        .modal.active { visibility: visible; opacity: 1; }
        .modal-card { background: #0c1326; width: 300px; border-radius: 50px; padding: 28px 22px; text-align: center; border: 2px solid #FFD700; box-shadow: 0 35px 50px rgba(0,0,0,0.7); color: white; }
        .modal-card h3 { font-size: 26px; margin-bottom: 12px; }
        .fee-amount { font-size: 36px; font-weight: bold; color: #FFD966; margin: 12px 0; }
        .modal-timer { font-size: 52px; font-weight: bold; background: #1a1f33; display: inline-block; width: 90px; height: 90px; line-height: 90px; border-radius: 50%; margin: 15px auto; border: 3px solid gold; }
        .pay-btn { background: #FFD700; border: none; padding: 14px 22px; border-radius: 60px; font-weight: bold; font-size: 20px; margin-top: 15px; width: 100%; cursor: pointer; transition: 0.05s linear; box-shadow: 0 8px 0 #b47c00; color: #1f1f1f; }
        .pay-btn:active { transform: translateY(3px); box-shadow: 0 4px 0 #b47c00; }
        .pay-btn.disabled { background: #5a5a5a; box-shadow: none; transform: none; cursor: not-allowed; }
        .modal-message { font-size: 13px; margin-top: 18px; color: #ffd966; }
        .spectator-message { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); padding: 8px 18px; border-radius: 40px; color: #ffaa33; font-size: 14px; font-weight: bold; border: 1px solid gold; z-index: 110; pointer-events: none; white-space: nowrap; }
        
        /* --- START OVERLAY (NEW, but design consistent) --- */
        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(12px);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: 0.3s;
        }
        .start-overlay.hide {
            display: none;
        }
        .start-btn {
            background: linear-gradient(145deg, #FFD700, #e6b800);
            border: none;
            padding: 20px 40px;
            border-radius: 60px;
            font-size: 28px;
            font-weight: bold;
            color: #1f1f1f;
            cursor: pointer;
            box-shadow: 0 15px 0 #b47c00, 0 10px 30px rgba(0,0,0,0.5);
            transition: 0.05s linear;
            font-family: 'Arial Black', sans-serif;
            text-transform: uppercase;
        }
        .start-btn:active {
            transform: translateY(5px);
            box-shadow: 0 8px 0 #b47c00;
        }
        .start-title {
            color: gold;
            font-size: 32px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
<header class="game-header">
    <div class="header-left">
        <div class="pool-box"><i class="fas fa-coins"></i> POOL: <span id="poolAmount">0</span> MK</div>
        <div class="rank-box"><i class="fas fa-trophy"></i> RANK: <span id="liveRank">5000</span>/5000</div>
    </div>
    <div class="header-right">
        <div class="balance-box"><i class="fas fa-wallet"></i> <span id="balanceVal">0.00</span></div>
        <button class="sound-toggle" id="soundToggle"><i class="fas fa-volume-up"></i></button>
        <div class="hamburger"><span></span><span></span><span></span></div>
    </div>
</header>
<div class="timer-circle" id="gameTimerCircle">30</div>
<div id="game-container">
    <canvas id="bgCanvas"></canvas>
    <div class="vignette"></div>
    <div class="ornament-container" id="targetContainer">
        <div class="string"></div>
        <div class="ring"></div>
        <div class="cap"></div>
        <div class="blue-3d-ball" id="targetBall"></div>
    </div>
    <div class="shooter-wrapper">
        <div class="nozzle" id="nozzle"></div>
        <div class="shooter-base"></div>
        <button class="red-shooter-btn" id="redBtn"><span class="go-text">GO!</span></button>
    </div>
    <div class="game-footer">
        <div class="footer-left"><i class="fas fa-bullseye"></i> SHOTS: <span id="shotsLeftDisplay">0</span></div>
        <div class="footer-right">
            <span><i class="fas fa-star"></i> PTS: <span id="userPoints">0</span></span>
            <span><i class="fas fa-trophy"></i> RANK: <span id="footerRank">5000</span></span>
        </div>
    </div>
</div>
<div id="spectatorMsg" class="spectator-message" style="display: none;">SPECTATOR MODE - Pay MK 150 to play next round</div>
<div id="entryModal" class="modal">
    <div class="modal-card">
        <h3><i class="fas fa-hourglass-half"></i> NEXT ROUND</h3>
        <p>Entry Fee</p>
        <div class="fee-amount"><i class="fas fa-ticket-alt"></i> MK 150</div>
        <div id="modalCountdown" class="modal-timer">10</div>
        <button id="payBtn" class="pay-btn"><i class="fas fa-hand-holding-usd"></i> PAY & ENTER</button>
        <div id="modalMsg" class="modal-message">Pay before timer ends to play</div>
    </div>
</div>

<!-- START OVERLAY -->
<div id="startOverlay" class="start-overlay">
    <div class="start-title">SHOOTER 265</div>
    <button id="startGameBtn" class="start-btn">START GAME</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
    // -------------------- SERVER-AUTHORITATIVE CLIENT WITH START BUTTON --------------------
    const supabase = window.supabaseClient;
    let currentUserId = null;
    let currentRound = 1;
    let hasJoined = false;
    let gameStarted = false;
    
    // DOM elements
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    const btn = document.getElementById('redBtn');
    const targetContainer = document.getElementById('targetContainer');
    const targetBall = document.getElementById('targetBall');
    const balanceEl = document.getElementById('balanceVal');
    const pointsEl = document.getElementById('userPoints');
    const gameTimerCircle = document.getElementById('gameTimerCircle');
    const modal = document.getElementById('entryModal');
    const modalTimerEl = document.getElementById('modalCountdown');
    const payBtn = document.getElementById('payBtn');
    const modalMsg = document.getElementById('modalMsg');
    const poolAmountSpan = document.getElementById('poolAmount');
    const liveRankSpan = document.getElementById('liveRank');
    const footerRankSpan = document.getElementById('footerRank');
    const shotsLeftDisplay = document.getElementById('shotsLeftDisplay');
    const spectatorMsgDiv = document.getElementById('spectatorMsg');
    const soundToggle = document.getElementById('soundToggle');
    const startOverlay = document.getElementById('startOverlay');
    const startGameBtn = document.getElementById('startGameBtn');
    
    // Background clouds
    let width, height;
    let clouds = [];
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    class Cloud {
        constructor(randomY = false) {
            this.x = Math.random() * width;
            this.y = randomY ? Math.random() * (height * 0.7) : -100;
            this.size = Math.random() * 50 + 30;
            this.speed = Math.random() * 0.4 + 0.1;
            this.opacity = Math.random() * 0.2 + 0.05;
        }
        update() { this.y += this.speed; if (this.y > height) { this.y = -100; this.x = Math.random() * width; } }
        draw() { ctx.fillStyle = `rgba(255,255,255,${this.opacity})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); }
    }
    function animateClouds() { ctx.clearRect(0, 0, width, height); clouds.forEach(c => { c.update(); c.draw(); }); requestAnimationFrame(animateClouds); }
    
    // Helper functions
    async function getSessionToken() { return localStorage.getItem('tidye_session_token'); }
    async function callEdgeFunction(funcName, body) {
        const token = await getSessionToken();
        if (!token) throw new Error('Not authenticated');
        const res = await fetch(`${window.SUPABASE_URL}/functions/v1/${funcName}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify(body),
        });
        if (!res.ok) { const err = await res.json(); throw new Error(err.error || `HTTP ${res.status}`); }
        return res.json();
    }
    
    // Start game: call gameloop edge function, then hide overlay and start realtime
    async function startGame() {
        try {
            const token = await getSessionToken();
            if (!token) {
                alert("Please login first");
                window.location.href = 'login.html';
                return;
            }
            // Call gameloop to start the authoritative loop
            const res = await fetch(`${window.SUPABASE_URL}/functions/v1/gameloop`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({}),
            });
            if (res.ok) {
                startOverlay.classList.add('hide');
                gameStarted = true;
                initRealtime(); // now start listening to realtime updates
            } else {
                alert("Failed to start game. Check console.");
            }
        } catch (err) {
            console.error(err);
            alert("Error starting game: " + err.message);
        }
    }
    
    // Update UI from server data
    function updateUI(state, playerStats, userBalance) {
        if (state) {
            targetContainer.style.left = state.target_x + '%';
            gameTimerCircle.innerText = Math.max(0, state.timer_seconds);
            if (state.timer_seconds <= 10 && state.round_status === 'active') gameTimerCircle.classList.add('warning');
            else gameTimerCircle.classList.remove('warning');
            poolAmountSpan.innerText = state.pool_amount;
            currentRound = state.current_round;
            if (state.round_status === 'waiting') {
                if (!hasJoined && state.waiting_ends_at) {
                    const remaining = Math.max(0, Math.ceil((new Date(state.waiting_ends_at) - new Date()) / 1000));
                    modalTimerEl.innerText = remaining;
                    modal.classList.add('active');
                    spectatorMsgDiv.style.display = 'none';
                } else if (hasJoined) {
                    modal.classList.remove('active');
                } else {
                    spectatorMsgDiv.style.display = 'block';
                    modal.classList.remove('active');
                    btn.disabled = true;
                    btn.style.filter = "grayscale(80%)";
                }
            } else {
                modal.classList.remove('active');
                spectatorMsgDiv.style.display = 'none';
                btn.disabled = false;
                btn.style.filter = "none";
            }
        }
        if (playerStats) {
            pointsEl.innerText = playerStats.points || 0;
            shotsLeftDisplay.innerText = playerStats.shots_left || 0;
            let rank = 5000;
            const pts = playerStats.points || 0;
            if (pts >= 1000) rank = 1;
            else if (pts >= 500) rank = 100;
            else if (pts >= 300) rank = 500;
            else if (pts >= 150) rank = 1000;
            else if (pts >= 50) rank = 2500;
            liveRankSpan.innerText = rank;
            footerRankSpan.innerText = rank;
            hasJoined = true;
        } else {
            hasJoined = false;
        }
        if (userBalance !== undefined) balanceEl.innerText = userBalance.toFixed(2);
    }
    
    // Realtime subscriptions (called after game start)
    async function initRealtime() {
        const token = await getSessionToken();
        if (!token) return;
        const { data: { user } } = await supabase.auth.getUser(token);
        if (!user) return;
        currentUserId = user.id;
        
        // Listen to live_state changes
        supabase.channel('game-state')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'live_game_state' }, (payload) => {
                updateUI(payload.new, null, null);
            })
            .subscribe();
        
        // Listen to player changes
        const fetchPlayer = async () => {
            const { data: player } = await supabase.from('game_players').select('points, shots_left').eq('round_id', currentRound).eq('user_id', user.id).single();
            if (player) updateUI(null, player, null);
        };
        await fetchPlayer();
        supabase.channel('player-stats')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'game_players', filter: `user_id=eq.${user.id}` }, (payload) => {
                updateUI(null, payload.new, null);
            })
            .subscribe();
        
        // Balance changes
        supabase.channel('balance')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles', filter: `id=eq.${user.id}` }, (payload) => {
                balanceEl.innerText = payload.new.balance.toFixed(2);
            })
            .subscribe();
        
        const { data: profile } = await supabase.from('profiles').select('balance').eq('id', user.id).single();
        if (profile) balanceEl.innerText = profile.balance.toFixed(2);
    }
    
    // Shoot with visual effect (only if game started)
    btn.addEventListener('click', async () => {
        if (!gameStarted) return;
        try {
            const result = await callEdgeFunction('shoot-action', { round_id: currentRound });
            if (result.success) {
                targetBall.style.transform = "scale(1.2)";
                setTimeout(() => targetBall.style.transform = "scale(1)", 100);
                // Visual marble
                const marble = document.createElement('div');
                marble.className = 'marble';
                const nozzleRect = document.getElementById('nozzle').getBoundingClientRect();
                let marbleX = nozzleRect.left + (nozzleRect.width/2) - 10;
                let marbleY = nozzleRect.top;
                marble.style.left = marbleX + 'px';
                marble.style.top = marbleY + 'px';
                document.body.appendChild(marble);
                let bulletInterval = setInterval(() => {
                    marbleY -= 14;
                    marble.style.top = marbleY + 'px';
                    if (marbleY < -20) { clearInterval(bulletInterval); marble.remove(); }
                }, 14);
                // Particles
                for (let i=0; i<10; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    p.style.left = marbleX + 'px';
                    p.style.top = marbleY + 'px';
                    document.body.appendChild(p);
                    const angle = Math.random() * Math.PI * 2;
                    const vel = Math.random() * 6 + 3;
                    let px = marbleX, py = marbleY;
                    let moveP = setInterval(() => {
                        px += Math.cos(angle) * vel;
                        py += Math.sin(angle) * vel;
                        p.style.left = px + 'px';
                        p.style.top = py + 'px';
                        p.style.opacity = (parseFloat(p.style.opacity) || 1) - 0.07;
                        if (p.style.opacity <= 0) { clearInterval(moveP); p.remove(); }
                    }, 20);
                }
            }
        } catch (err) { console.error(err); }
    });
    
    // Join round
    payBtn.addEventListener('click', async () => {
        if (!gameStarted) return;
        try {
            const result = await callEdgeFunction('join-round', {});
            if (result.success) {
                modal.classList.remove('active');
                modalMsg.innerText = "You have joined!";
                setTimeout(() => modalMsg.innerText = "Pay before timer ends to play", 2000);
            }
        } catch (err) { modalMsg.innerText = err.message; }
    });
    
    // Sound toggle (optional)
    let soundMuted = false;
    const hitSound = new Audio('sounds/hit.mp3');
    const shootSound = new Audio('sounds/shoot.mp3');
    const bgSound = new Audio('sounds/background.mp3');
    bgSound.loop = true;
    soundToggle.addEventListener('click', () => {
        soundMuted = !soundMuted;
        const icon = soundToggle.querySelector('i');
        if (soundMuted) {
            icon.classList.remove('fa-volume-up');
            icon.classList.add('fa-volume-mute');
            bgSound.volume = 0;
            hitSound.volume = 0;
            shootSound.volume = 0;
        } else {
            icon.classList.remove('fa-volume-mute');
            icon.classList.add('fa-volume-up');
            bgSound.volume = 1;
            hitSound.volume = 1;
            shootSound.volume = 1;
            bgSound.play().catch(e=>console.log);
        }
    });
    
    // Check if game already active (timer less than 30 or target moving)
    async function checkGameActive() {
        try {
            const { data: state } = await supabase.from('live_game_state').select('timer_seconds, updated_at').eq('id', 1).single();
            if (state && state.timer_seconds < 30) {
                // Game already running, hide overlay and start realtime
                startOverlay.classList.add('hide');
                gameStarted = true;
                initRealtime();
            } else {
                // Show overlay, wait for user click
                startOverlay.classList.remove('hide');
            }
        } catch (e) {
            startOverlay.classList.remove('hide');
        }
    }
    
    // Initialize clouds and background
    function init() {
        resize();
        for (let i = 0; i < 12; i++) clouds.push(new Cloud(true));
        animateClouds();
        checkGameActive();
    }
    
    startGameBtn.addEventListener('click', startGame);
    init();
</script>
</body>
</html>
