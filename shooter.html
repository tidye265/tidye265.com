<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moskonx Shooter - Live</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --warning-color: #eab308;
            --sync-color: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* --- ERROR & DEBUG CONSOLE --- */
        #debug-console {
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            border-left: 4px solid var(--warning-color);
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 12px;
            height: 80px;
            overflow-y: auto;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        .log-error { color: #fca5a5; }
        .log-success { color: #86efac; }
        .log-info { color: #93c5fd; }

        /* --- GAME UI --- */
        .game-header {
            text-align: center;
            margin-bottom: 20px;
        }
        h2 {
            margin: 0 0 10px 0;
            color: #cbd5e1;
        }
        #timer {
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--sync-color); /* Imayamba ili imvi posonyeza kuti iku sync */
            text-shadow: 0 0 10px rgba(148, 163, 184, 0.5);
            min-width: 100px; /* Kupewa kuti isamalumphadumphe pamene ikusintha manambala */
            display: inline-block;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 12px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        .status-syncing { background-color: var(--sync-color); color: #fff; }
        .status-active { background-color: var(--success-color); color: #000; box-shadow: 0 0 8px var(--success-color); }
        .status-waiting { background-color: var(--warning-color); color: #000; box-shadow: 0 0 8px var(--warning-color); }

        /* --- GAME PLAY AREA --- */
        #game-area {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 160px;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        #target {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            transition: left 0.1s linear; 
            cursor: crosshair;
            user-select: none;
            opacity: 0.3; /* Imayamba ili yosaoneka bwino mpaka ilandire data */
        }

        /* --- CONTROLS --- */
        #shoot-btn {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s, opacity 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #shoot-btn:active {
            transform: scale(0.95);
        }
        #shoot-btn:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div id="debug-console">
        <div class="log-info">System initialized. Waiting for connection...</div>
    </div>

    <div class="game-header">
        <h2>Round: <span id="round-number">--</span></h2>
        <div id="timer">--</div><br>
        <div id="game-status" class="status-badge status-syncing">SYNCING ENGINE...</div>
    </div>

    <div id="game-area">
        <div id="target">🎯</div>
    </div>

    <button id="shoot-btn" disabled>SHOOT TARGET</button>

    <script>
        // --- 1. DOM ELEMENTS ---
        const debugConsole = document.getElementById('debug-console');
        const timerEl = document.getElementById('timer');
        const roundEl = document.getElementById('round-number');
        const statusEl = document.getElementById('game-status');
        const targetEl = document.getElementById('target');
        const shootBtn = document.getElementById('shoot-btn');

        // --- 2. LOGGER FUNCTION (Kuti muwone ma error pompo-pompo) ---
        function addLog(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const logLine = document.createElement('div');
            logLine.className = `log-${type}`;
            logLine.innerText = `[${time}] ${message}`;
            debugConsole.appendChild(logLine);
            debugConsole.scrollTop = debugConsole.scrollHeight; // Auto-scroll pansi
        }

        // --- 3. KULUMIKIZANA NDI SERVER ---
        const SERVER_URL = "https://moskonx-tidye-shooter-game-server.hf.space";
        
        addLog(`Attempting to connect to ${SERVER_URL}...`, 'info');
        
        const socket = io(SERVER_URL, {
            reconnectionAttempts: 10,
            timeout: 10000,
        });

        // --- 4. SOCKET EVENT LISTENERS ---
        socket.on('connect', () => {
            addLog(`Connected successfully! Socket ID: ${socket.id}`, 'success');
        });

        socket.on('connect_error', (error) => {
            addLog(`Connection Error: ${error.message}`, 'error');
            timerEl.innerText = "ERR";
            timerEl.style.color = "var(--danger-color)";
            statusEl.innerText = "CONNECTION LOST";
            statusEl.className = "status-badge status-syncing";
        });

        socket.on('disconnect', (reason) => {
            addLog(`Disconnected: ${reason}`, 'error');
            shootBtn.disabled = true;
        });

        // --- 5. GAME ENGINE SYNC (Kuchokera ku Backend) ---
        let currentStatus = "syncing";
        let isFirstSync = true;

        socket.on('gameTick', (state) => {
            // Ngati ndi kulumikizana koyamba, sinthani UI kukhala yowala
            if (isFirstSync) {
                targetEl.style.opacity = "1";
                timerEl.style.color = "var(--accent-color)";
                timerEl.style.textShadow = "0 0 10px rgba(59, 130, 246, 0.5)";
                isFirstSync = false;
            }

            // Update Timer
            timerEl.innerText = state.timer_seconds;
            
            // Ngati game inatha kusintha mtundu wa timer kuti ukhale wochenjeza
            if(state.timer_seconds <= 5 && state.round_status === 'active') {
                timerEl.style.color = "var(--warning-color)";
                timerEl.style.textShadow = "0 0 15px rgba(234, 179, 8, 0.6)";
            } else if (state.round_status === 'active') {
                timerEl.style.color = "var(--accent-color)";
                timerEl.style.textShadow = "0 0 10px rgba(59, 130, 246, 0.5)";
            }

            // Update Target Position smoothly
            targetEl.style.left = state.target_x + '%';

            // Update Round
            roundEl.innerText = state.current_round;

            // Handle Status Changes (Active vs Waiting)
            if (state.round_status !== currentStatus) {
                currentStatus = state.round_status;
                if (currentStatus === "waiting") {
                    statusEl.innerText = "BREAK TIME - NEXT ROUND SOON";
                    statusEl.className = "status-badge status-waiting";
                    shootBtn.disabled = true;
                    targetEl.style.opacity = "0.2"; 
                    timerEl.style.color = "var(--sync-color)";
                    timerEl.style.textShadow = "none";
                } else {
                    statusEl.innerText = "ACTIVE";
                    statusEl.className = "status-badge status-active";
                    shootBtn.disabled = false;
                    targetEl.style.opacity = "1";
                }
            }
        });

        socket.on('newRoundStarted', (data) => {
            addLog(`Round ${data.round_number} has started!`, 'success');
        });

        socket.on('broadcastLiveHit', (data) => {
             addLog(`${data.username} hit the target!`, 'info');
        });

        // --- 6. USER ACTIONS ---
        shootBtn.addEventListener('click', () => {
            if(currentStatus === 'active') {
                socket.emit('playerHitTarget', {
                    username: "Player_" + Math.floor(Math.random() * 1000),
                    awarded_points: 10
                });
                
                // Kupanga animation ya mfuti powombera
                targetEl.style.transform = "translate(-50%, -50%) scale(0.7)";
                targetEl.style.filter = "drop-shadow(0 0 10px red)";
                
                setTimeout(() => {
                    targetEl.style.transform = "translate(-50%, -50%) scale(1)";
                    targetEl.style.filter = "none";
                }, 100);
            }
        });
    </script>
</body>
</html>
