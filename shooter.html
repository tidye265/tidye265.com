<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOOTER 265 | SUPER 3D EDITION</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --sky-top: #050A1F;
            --sky-bottom: #0B1B3D;
            --red-main: #ff3b3b;
            --red-dark: #b30000;
            --red-deep: #7a0000;
            --white-glass: rgba(255, 255, 255, 0.7);
            --blue-light: #5bc0ff;
            --blue-main: #1a6dff;
            --blue-dark: #0033aa;
            --blue-glow: #00a6ff;
            --gold-light: #fff176;
            --gold-main: #ffd700;
            --gold-dark: #f57f17;
            --gold-glow: #ffea00;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100vh; width: 100vw; overflow: hidden; background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom)); font-family: 'Arial Black', sans-serif; }
        
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 15px;
            letter-spacing: 2px;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        .game-header { position: absolute; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; z-index: 100; }
        .header-left {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.65);
            padding: 6px 14px;
            border-radius: 30px;
            color: #FFD966;
            border: 1px solid rgba(255,215,0,0.5);
            font-size: 13px;
            font-weight: bold;
            backdrop-filter: blur(4px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .header-left i { margin-right: 6px; color: #FFD700; }
        .header-right { display: flex; align-items: center; gap: 10px; position: relative; }
        
        .balance-display {
            background: rgba(0, 0, 0, 0.65);
            padding: 6px 14px;
            border-radius: 30px;
            color: #FFD966;
            border: 1px solid rgba(255,215,0,0.5);
            font-size: 13px;
            font-weight: bold;
            backdrop-filter: blur(4px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .balance-display i { color: #FFD700; margin-right: 4px; }

        .hamburger { display: flex; flex-direction: column; gap: 4px; cursor: pointer; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .hamburger span { width: 20px; height: 3px; background: white; border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        
        .pool-display {
            position: absolute;
            top: 55px;
            left: 16px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255,215,0,0.3);
            font-size: 13px;
            font-weight: bold;
            color: #FFE6A3;
            text-shadow: 0 1px 2px black;
            z-index: 95;
            display: flex;
            gap: 12px;
        }
        .pool-display i { color: #FFD966; margin-right: 4px; }

        .dropdown-menu {
            position: absolute;
            top: 52px;
            right: 0;
            background: rgba(12, 19, 38, 0.95);
            border: 1px solid #FFD700;
            border-radius: 12px;
            width: 160px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 150;
        }
        .dropdown-menu.show { display: flex; }
        .dropdown-item {
            padding: 12px 16px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: background 0.2s;
            text-align: left;
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover, .dropdown-item:active { background: rgba(255, 215, 0, 0.15); color: #FFD700; }

        .timer-circle { position: absolute; top: 105px; right: 16px; width: 85px; height: 42px; border-radius: 20px; background: #0a1428; border: 3px solid #FFD700; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: #ffffff; text-shadow: 0 0 4px #0099ff; box-shadow: 0 0 12px rgba(0,160,255,0.4); z-index: 100; transition: all 0.2s ease; }
        .timer-circle.warning { background: #8b0000; border-color: #ff8800; color: #ffdd44; box-shadow: 0 0 18px red; animation: pulse-red 0.8s infinite; }
        @keyframes pulse-red { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: 0.95; background: #b22222; } 100% { transform: scale(1); opacity: 1; } }
        
        #bgCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 35%, rgba(0,0,0,0.5) 100%); z-index: 2; pointer-events: none; }
        
        .ornament-container { position: absolute; top: 0; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; z-index: 5; animation: swing 4s ease-in-out infinite; transform-origin: top center; transition: left 0.1s linear; filter: drop-shadow(0 12px 20px rgba(0,0,0,0.4)); }
        .string { width: 4px; height: 110px; background: repeating-linear-gradient(45deg, #c0c0c0, #f0f0f0 5px, #a0a0a0 8px); box-shadow: 0 0 3px rgba(255,255,255,0.5), inset 0 0 2px black; border-radius: 2px; }
        .ring { width: 14px; height: 14px; border: 2px solid gold; border-radius: 50%; margin-top: -3px; background: rgba(255,215,0,0.2); box-shadow: 0 0 5px gold; }
        .cap { width: 16px; height: 9px; background: linear-gradient(135deg, #c0c0c0, #f0f0f0, #a0a0a0); border-radius: 4px 4px 2px 2px; margin-top: -6px; box-shadow: 0 2px 5px black; }
        
        .blue-3d-ball { width: 56px; height: 56px; border-radius: 50%; position: relative; background: radial-gradient(circle at 35% 35%, var(--blue-light) 0%, var(--blue-main) 50%, var(--blue-dark) 100%); box-shadow: 0 30px 40px rgba(0,0,0,0.4), inset -15px -15px 25px rgba(0,0,0,0.6), inset 12px 12px 30px rgba(255,255,255,0.5), 0 0 20px var(--blue-glow); transition: transform 0.05s linear, background 0.3s ease; }
        .blue-3d-ball::before { content: ''; position: absolute; top: 12%; left: 18%; width: 38%; height: 28%; background: radial-gradient(ellipse, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 80%); border-radius: 50%; transform: rotate(-25deg); filter: blur(2px); }
        .blue-3d-ball::after { content: ''; position: absolute; bottom: 15%; right: 15%; width: 20%; height: 15%; background: radial-gradient(circle, rgba(255,255,255,0.6), transparent); border-radius: 50%; filter: blur(3px); }
        
        .blue-3d-ball.gold-time-ball {
            background: radial-gradient(circle at 35% 35%, var(--gold-light) 0%, var(--gold-main) 50%, var(--gold-dark) 100%) !important;
            box-shadow: 0 30px 40px rgba(0,0,0,0.4), inset -15px -15px 25px rgba(0,0,0,0.6), inset 12px 12px 30px rgba(255,255,255,0.6), 0 0 35px var(--gold-glow) !important;
            animation: comboPulse 0.5s ease-in-out infinite alternate;
        }
        @keyframes comboPulse {
            0% { transform: scale(1.0); filter: drop-shadow(0 0 5px var(--gold-glow)); }
            100% { transform: scale(1.18); filter: drop-shadow(0 0 25px #ffaa00); }
        }

        @keyframes swing { 0%, 100% { transform: translateX(-50%) rotate(-10deg); } 50% { transform: translateX(-50%) rotate(10deg); } }
        
        .shooter-wrapper { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; width: 170px; z-index: 10; filter: drop-shadow(0 15px 20px rgba(0,0,0,0.5)); }
        .nozzle { width: 44px; height: 22px; background: linear-gradient(145deg, #444, #888, #333); border-radius: 10px 10px 0 0; margin-bottom: -6px; box-shadow: inset 0 2px 3px rgba(255,255,255,0.3), 0 2px 4px black; }
        .shooter-base { width: 140px; height: 40px; background: linear-gradient(145deg, #b0b0b0, #707070, #505050); border-radius: 60% 60% 15px 15px; box-shadow: 0 15px 25px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.5); }
        .red-shooter-btn { width: 85px; height: 85px; border-radius: 50%; border: none; cursor: pointer; position: absolute; bottom: 20px; background: radial-gradient(circle at 40% 35%, #ff6666 0%, var(--red-main) 50%, var(--red-dark) 100%); box-shadow: 0 14px 0 var(--red-deep), 0 25px 35px rgba(0,0,0,0.7), inset 0 6px 12px var(--white-glass), inset 0 -12px 20px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; transition: all 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .go-text { color: white; font-size: 22px; text-transform: uppercase; text-shadow: 2px 3px 6px rgba(0,0,0,0.6); pointer-events: none; }
        .red-shooter-btn:active { transform: translateY(10px); box-shadow: 0 4px 0 var(--red-deep), 0 8px 20px rgba(0,0,0,0.6); }
        
        .marble {
            position: absolute;
            width: 22px;
            height: 22px;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #8b0000);
            border-radius: 50%;
            box-shadow: 0 3px 8px rgba(0,0,0,0.4);
            z-index: 8;
        }
        .particle {
            position: absolute;
            width: 7px;
            height: 7px;
            background: radial-gradient(circle, #ff4444, #aa0000);
            border-radius: 2px;
            pointer-events: none;
            z-index: 9;
        }
        .shockwave {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
            pointer-events: none;
            z-index: 15;
            transform: scale(0);
            opacity: 1;
            animation: shockwaveExpand 0.4s ease-out forwards;
        }
        @keyframes shockwaveExpand {
            0% { transform: scale(0); opacity: 0.8; }
            100% { transform: scale(4); opacity: 0; }
        }
        
        .game-footer { position: absolute; bottom: 15px; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 12px; z-index: 100; gap: 8px; }
        .footer-left { display: flex; align-items: center; background: rgba(0, 5, 30, 0.75); backdrop-filter: blur(10px); padding: 8px 14px; border-radius: 40px; color: #ffffff; border: 1px solid rgba(255,215,0,0.3); box-shadow: 0 6px 15px rgba(0,0,0,0.5); font-size: 11px; font-weight: bold; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .footer-right { display: flex; align-items: center; gap: 8px; background: rgba(0, 5, 30, 0.75); backdrop-filter: blur(10px); padding: 8px 14px; border-radius: 40px; color: #ffffff; border: 1px solid rgba(255,215,0,0.3); box-shadow: 0 6px 15px rgba(0,0,0,0.5); font-size: 11px; font-weight: bold; }
        .footer-left i, .footer-right i { font-size: 13px; color: #FFD700; margin-right: 4px; }
        
        .modal { 
            position: absolute; 
            top: 155px; 
            right: 16px; 
            width: 210px; 
            height: auto; 
            background: transparent; 
            z-index: 200; 
            visibility: hidden; 
            opacity: 0; 
            transition: opacity 0.3s ease, visibility 0.3s; 
            pointer-events: none;
        }
        .modal.active { visibility: visible; opacity: 1; }
        .modal-card { 
            background: rgba(12, 19, 38, 0.96); 
            width: 100%; 
            border-radius: 20px; 
            padding: 14px; 
            text-align: center; 
            border: 2px solid #FFD700; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.6); 
            color: white; 
            pointer-events: auto;
        }
        .modal-card h3 { font-size: 14px; margin-bottom: 4px; font-family: 'Arial Black', sans-serif; color: #ffffff; }
        .modal-card p { font-size: 11px; opacity: 0.9; margin-bottom: 2px; }
        .fee-amount { font-size: 20px; font-weight: bold; color: #FFD966; margin: 4px 0; }
        .modal-timer { font-size: 18px; font-weight: bold; background: #1a1f33; display: inline-block; width: 65px; height: 36px; line-height: 36px; border-radius: 18px; margin: 4px auto; border: 2px solid gold; }
        .pay-btn { background: #FFD700; border: none; padding: 10px 14px; border-radius: 30px; font-weight: bold; font-size: 13px; margin-top: 6px; width: 100%; cursor: pointer; transition: 0.05s linear; box-shadow: 0 3px 0 #b47c00; color: #1f1f1f; }
        .pay-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b47c00; }
        
        .spectator-message { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 40px; color: #ffaa33; font-size: 12px; font-weight: bold; border: 1px solid gold; z-index: 110; pointer-events: none; white-space: nowrap; }
        
        .winner-toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #FFD700, #e6b800);
            color: #1f1f1f;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            z-index: 250;
            white-space: nowrap;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            animation: fadeOut 3s ease forwards;
            pointer-events: none;
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); visibility: hidden; }
        }

        /* COMBO ANIMATION */
        .combo-indicator {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid #FFD700;
            font-size: 18px;
            font-weight: bold;
            color: #FFD700;
            white-space: nowrap;
            z-index: 120;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
            box-shadow: 0 0 12px rgba(0,0,0,0.4);
            font-family: 'Lexend', sans-serif;
        }
        .combo-indicator.animate {
            animation: comboPop 0.3s ease-out;
        }
        @keyframes comboPop {
            0% { transform: translateX(-50%) scale(0.8); opacity: 0; }
            50% { transform: translateX(-50%) scale(1.2); opacity: 1; }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }
    </style>

</head>

<script src="supabase.js"></script>
<script>
    "use strict";

    // --- 1. LOGIN_265 AUTHENTICATION & WALLET MANAGER (unchanged) ---
    const GameAuthManager = (function() {
        const DOM = { walletBalance: document.getElementById('balanceVal') };
        async function checkAuthAndLoadBalance() {
            const token = localStorage.getItem('tidye_session_token');
            if (!token) { secureLogout(); return; }
            try {
                const walletResponse = await fetch(`${window.SUPABASE_URL}/functions/v1/wallet-api`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
                });
                if (walletResponse.status === 401) { secureLogout(); return; }
                const walletData = await walletResponse.json();
                if (walletData && DOM.walletBalance) {
                    const formattedBalance = Number(walletData.balance).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                    DOM.walletBalance.textContent = formattedBalance;
                    window.currentUserBalance = Number(walletData.balance);
                }
            } catch (err) { console.error("Error loading balance:", err); }
        }
        function secureLogout() { localStorage.clear(); window.location.replace('login.html'); }
        return { init: checkAuthAndLoadBalance, sync: checkAuthAndLoadBalance, logout: secureLogout };
    })();

    let currentUserId = localStorage.getItem('user_username') || "Guest";
    let currentUsername = currentUserId;
    let currentRoundId = 1;
    let comboCount = 0;
    let lastHitTime = 0;
    const COMBO_WINDOW = 1800; // ms
    let comboTimeout = null;
    const comboEl = document.getElementById('comboIndicator');

    function updateComboDisplay() {
        if (comboCount <= 1) {
            comboEl.style.opacity = "0";
            return;
        }
        comboEl.style.opacity = "1";
        comboEl.innerHTML = `🔥 COMBO x${comboCount}`;
        comboEl.classList.remove('animate');
        void comboEl.offsetWidth; // reflow
        comboEl.classList.add('animate');
    }

    function resetCombo() {
        comboCount = 0;
        updateComboDisplay();
        if (comboTimeout) clearTimeout(comboTimeout);
    }

    function incrementCombo() {
        const now = Date.now();
        if (now - lastHitTime <= COMBO_WINDOW) {
            comboCount++;
        } else {
            comboCount = 1;
        }
        lastHitTime = now;
        updateComboDisplay();
        if (comboTimeout) clearTimeout(comboTimeout);
        comboTimeout = setTimeout(() => {
            if (comboCount > 1) {
                comboCount = 0;
                updateComboDisplay();
            }
        }, COMBO_WINDOW);
    }

    document.addEventListener('DOMContentLoaded', GameAuthManager.init);

    // --- 2. DOM ELEMENTS (unchanged) ---
    const loadingScreen = document.getElementById('loading-screen');
    const timerEl = document.getElementById('gameTimerCircle');
    const targetContainer = document.getElementById('targetContainer');
    const targetBall = document.getElementById('targetBall');
    const btn = document.getElementById('redBtn');
    const goText = document.getElementById('goText');
    const modal = document.getElementById('entryModal');
    const modalTimerEl = document.getElementById('modalCountdown');
    const payBtn = document.getElementById('payBtn');
    const poolAmountSpan = document.getElementById('poolAmount');
    const rankValSpan = document.getElementById('rankVal');
    const pointsEl = document.getElementById('userPoints');
    const ballLimitSpan = document.getElementById('ballLimit');
    const spectatorMsgDiv = document.getElementById('spectatorMsg');
    const hamburgerMenu = document.getElementById('hamburgerMenu');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    let hasJoined = false; 
    let shooterLimit = 150;
    let userPoints = 0;
    let audioInitialized = false;
    let currentTargetX = 50;
    let mySocketId = null;
    let allPlayersPoints = new Map();

    // --- SOUND ENGINE (unchanged) ---
    const sndBg = new Audio('background.mp3'); sndBg.loop = true; sndBg.setAttribute('playsinline', '');
    const sndHit = new Audio('hit.mp3'); sndHit.setAttribute('playsinline', '');
    const sndWaiting = new Audio('waiting.mp3'); sndWaiting.loop = true; sndWaiting.setAttribute('playsinline', '');
    const sndShoot = new Audio('shoot.mp3'); sndShoot.setAttribute('playsinline', '');

    function initAudioContext() {
        if (audioInitialized) return;
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'none';
        audioInitialized = true;
    }
    function safePlay(audioObj) { initAudioContext(); audioObj.play().catch(e => console.log("Audio blocked")); }

    // --- MENU & CLOUDS (unchanged) ---
    hamburgerMenu.addEventListener('click', (e) => { e.stopPropagation(); dropdownMenu.classList.toggle('show'); });
    document.addEventListener('click', () => { dropdownMenu.classList.remove('show'); });

    let width, height;
    let clouds = [];
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    class Cloud {
        constructor(randomY = false) {
            this.x = Math.random() * width;
            this.y = randomY ? Math.random() * (height * 0.7) : -100;
            this.size = Math.random() * 40 + 20;
            this.speed = Math.random() * 0.3 + 0.1;
            this.opacity = Math.random() * 0.15 + 0.05;
        }
        update() { this.y += this.speed; if (this.y > height) { this.y = -100; this.x = Math.random() * width; } }
        draw() { ctx.fillStyle = `rgba(255,255,255,${this.opacity})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); }
    }
    function animateClouds() { ctx.clearRect(0, 0, width, height); clouds.forEach(c => { c.update(); c.draw(); }); requestAnimationFrame(animateClouds); }

    // --- SOCKET CONNECTION (updated to match backend) ---
    const SERVER_URL = "https://moskonx-tidye-shooter-game-server.hf.space";
    const socket = io(SERVER_URL, { reconnectionAttempts: 10, timeout: 10000 });
    let currentStatus = "syncing";
    let isFirstSync = true;

    socket.on('connect', () => {
        console.log(`Connected socket: ${socket.id}, user: ${currentUserId}`);
        mySocketId = socket.id;
    });
    socket.on('connect_error', () => timerEl.innerText = "ERR");
    socket.on('disconnect', () => { btn.disabled = true; btn.style.filter = "grayscale(80%)"; });

    // --- UPDATE RANK (based on broadcastLiveHit) ---
    function updateRankDisplay() {
        if (!mySocketId) return;
        const totalUsers = allPlayersPoints.size;
        if (totalUsers === 0) {
            rankValSpan.innerText = "Rank: --/--";
            return;
        }
        const myPoints = allPlayersPoints.get(mySocketId) || 0;
        const sorted = Array.from(allPlayersPoints.entries()).sort((a,b) => b[1] - a[1]);
        let myRank = sorted.findIndex(([key]) => key === mySocketId) + 1;
        if (myRank === 0) myRank = totalUsers;
        const top40Percent = Math.floor(totalUsers * 0.4);
        const isInTop40 = myRank <= top40Percent;
        rankValSpan.innerText = `Rank: ${myRank}/${totalUsers}`;
        rankValSpan.style.color = isInTop40 ? "#22c55e" : "#FFD966";
    }

    socket.on('broadcastLiveHit', (hitData) => {
        const playerKey = hitData.socketId || hitData.username;
        const currentPoints = allPlayersPoints.get(playerKey) || 0;
        allPlayersPoints.set(playerKey, currentPoints + hitData.points);
        if (hitData.socketId === socket.id) {
            userPoints += hitData.points;
            pointsEl.innerText = userPoints;
            incrementCombo(); // beautiful combo on hit
        }
        updateRankDisplay();
    });

    // --- GAME TICK (backend sends only essential fields) ---
    socket.on('gameTick', (state) => {
        if (isFirstSync) {
            loadingScreen.style.opacity = "0";
            setTimeout(() => loadingScreen.style.display = "none", 400);
            targetContainer.style.opacity = "1";
            isFirstSync = false;
        }
        currentStatus = state.round_status;
        if (currentStatus === "active") GameAuthManager.sync();
        
        const displaySeconds = Math.max(0, Math.ceil(state.timer_seconds));
        timerEl.innerText = displaySeconds;
        if (state.timer_seconds <= 5 && state.round_status === 'active') {
            timerEl.classList.add('warning');
        } else {
            timerEl.classList.remove('warning');
        }
        currentTargetX = state.target_x;
        targetContainer.style.left = state.target_x + '%';
        if (state.current_round) currentRoundId = state.current_round;
        
        if (state.is_gold_time) targetBall.classList.add('gold-time-ball');
        else targetBall.classList.remove('gold-time-ball');

        // WAITING MODAL & SPECTATOR
        if (state.round_status === "waiting") {
            hasJoined = false;
            goText.innerText = "BREAK";
            btn.disabled = true;
            btn.style.filter = "grayscale(80%)";
            targetContainer.style.opacity = "0.2";
            safePlay(sndBg);
            if (sndWaiting.paused) { sndWaiting.currentTime = 0; safePlay(sndWaiting); }
            let waitingRemaining = 10;
            if (state.waiting_ends_at) {
                const end = new Date(state.waiting_ends_at);
                const now = new Date();
                waitingRemaining = Math.max(0, Math.ceil((end - now) / 1000));
            }
            modalTimerEl.innerText = waitingRemaining;
            modal.classList.add('active');
            spectatorMsgDiv.style.display = 'none';
            if (displaySeconds === 0) timerEl.innerText = "End";
            // reset combo during waiting
            resetCombo();
        } else if (state.round_status === "active") {
            modal.classList.remove('active');
            goText.innerText = "GO !!";
            targetContainer.style.opacity = "1";
            sndBg.volume = 1.0;
            safePlay(sndBg);
            sndWaiting.pause();
            sndWaiting.currentTime = 0;
            if (hasJoined && shooterLimit > 0) {
                btn.disabled = false;
                btn.style.filter = "none";
                spectatorMsgDiv.style.display = 'none';
            } else {
                btn.disabled = true;
                btn.style.filter = "grayscale(80%)";
                if(!hasJoined) spectatorMsgDiv.style.display = 'block';
            }
        }
    });

    // --- NEW ROUND STARTED ---
    socket.on('newRoundStarted', (data) => {
        allPlayersPoints.clear();
        hasJoined = false;
        shooterLimit = 150;
        userPoints = 0;
        ballLimitSpan.innerText = shooterLimit;
        pointsEl.innerText = userPoints;
        resetCombo();
        updateRankDisplay();
    });

    // --- ROUND ENDED (winner notification with proper username) ---
    socket.on('roundEnded', (data) => {
        const toast = document.createElement('div');
        toast.className = 'winner-toast';
        if (data.has_winner) {
            let winnerText = data.winner_username;
            if (winnerText && winnerText !== "No Player" && winnerText !== "No Winner") {
                toast.innerText = `🏆 ${winnerText} won MWK ${data.pool_won || 0}! 🏆`;
            } else {
                toast.innerText = `🏆 ${winnerText || "A player"} won MWK ${data.pool_won || 0}! 🏆`;
            }
        } else {
            toast.innerText = `No player won this round. Next round in ${data.next_round_in}s`;
        }
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    });

    // --- ENTRY STATUS (after playerVerified) ---
    socket.on('entryStatus', (data) => {
        if (data.success) {
            hasJoined = true;
            spectatorMsgDiv.style.display = 'none';
            modal.classList.remove('active');
            console.log("Entry successful");
        } else {
            console.error("Entry failed:", data.message);
            alert("Failed to join round: " + data.message);
        }
    });

    // --- BALANCE UPDATED (optional, from wallet-api) ---
    socket.on('balanceUpdated', (data) => {
        const balanceVal = document.getElementById('balanceVal');
        if (balanceVal) {
            const formatted = Number(data.new_balance).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            balanceVal.textContent = formatted;
            window.currentUserBalance = Number(data.new_balance);
        }
    });

    // --- VISUAL EFFECTS (unchanged) ---
    function shakeScreen(intensity = 5, duration = 150) {
        const container = document.getElementById('game-container');
        if (!container) return;
        const originalTransform = container.style.transform;
        let startTime = performance.now();
        function shakeFrame(now) {
            const elapsed = now - startTime;
            if (elapsed >= duration) {
                container.style.transform = originalTransform;
                return;
            }
            const magnitude = intensity * (1 - elapsed / duration);
            const x = (Math.random() - 0.5) * magnitude;
            const y = (Math.random() - 0.5) * magnitude;
            container.style.transform = `translate(${x}px, ${y}px)`;
            requestAnimationFrame(shakeFrame);
        }
        requestAnimationFrame(shakeFrame);
    }

    function createShockwave(x, y) {
        const ring = document.createElement('div');
        ring.className = 'shockwave';
        ring.style.left = (x - 10) + 'px';
        ring.style.top = (y - 10) + 'px';
        document.body.appendChild(ring);
        setTimeout(() => ring.remove(), 400);
    }

    function createBurst(x, y, isGold = false) {
        for (let i = 0; i < 10; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            if (isGold) {
                p.style.background = 'radial-gradient(circle, #fff176, #ffd700)';
                p.style.boxShadow = '0 0 6px gold';
            } else {
                p.style.background = 'radial-gradient(circle, #ff6666, #cc0000)';
            }
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            document.body.appendChild(p);
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 6 + 2;
            let px = x;
            let py = y;
            let moveP = setInterval(() => {
                px += Math.cos(angle) * velocity;
                py += Math.sin(angle) * velocity;
                p.style.left = px + 'px';
                p.style.top = py + 'px';
                p.style.opacity = (parseFloat(p.style.opacity) || 1) - 0.05;
                if (p.style.opacity <= 0) {
                    clearInterval(moveP);
                    p.remove();
                }
            }, 16);
        }
    }

    function squashBall() {
        targetBall.style.transform = "scale(0.7)";
        setTimeout(() => targetBall.style.transform = "scale(1)", 120);
    }
    function flashTarget() {
        const originalFilter = targetBall.style.filter;
        targetBall.style.filter = "brightness(2) drop-shadow(0 0 15px white)";
        setTimeout(() => targetBall.style.filter = originalFilter, 100);
    }

    // --- SHOOT (send hit to server, local visual effects) ---
    function shoot() {
        if (currentStatus !== 'active' || shooterLimit <= 0) return;
        
        sndShoot.currentTime = 0;
        safePlay(sndShoot);
        
        shooterLimit--;
        ballLimitSpan.innerText = shooterLimit;
        if (shooterLimit <= 0) {
            btn.disabled = true;
            btn.style.filter = "grayscale(80%)";
        }
        
        // Visual marble
        const marble = document.createElement('div');
        marble.className = 'marble';
        const nozzleRect = document.getElementById('nozzle').getBoundingClientRect();
        let marbleX = nozzleRect.left + (nozzleRect.width / 2) - 11;
        let marbleY = nozzleRect.top;
        marble.style.left = marbleX + 'px';
        marble.style.top = marbleY + 'px';
        document.body.appendChild(marble);
        
        let bulletInterval = setInterval(() => {
            marbleY -= 14;
            marble.style.top = marbleY + 'px';
            const mRect = marble.getBoundingClientRect();
            const tRect = targetBall.getBoundingClientRect();
            if (mRect.top <= tRect.bottom && 
                mRect.left >= tRect.left - 12 && 
                mRect.right <= tRect.right + 12 &&
                mRect.bottom >= tRect.top) {
                clearInterval(bulletInterval);
                marble.remove();
                sndHit.currentTime = 0;
                safePlay(sndHit);
                const isGold = targetBall.classList.contains('gold-time-ball');
                const ballRect = targetBall.getBoundingClientRect();
                const hitX = ballRect.left + ballRect.width/2;
                const hitY = ballRect.top + ballRect.height/2;
                createBurst(hitX, hitY, isGold);
                createShockwave(hitX, hitY);
                squashBall();
                flashTarget();
                shakeScreen(6, 180);
                // Increment combo will be done when broadcastLiveHit arrives
                socket.emit('playerHitTarget', {});
            }
            if (marbleY < -50) {
                clearInterval(bulletInterval);
                marble.remove();
            }
        }, 16);
    }

    // --- PAY ENTRY (call Edge Function first, then emit playerVerified) ---
    async function payEntry() {
        initAudioContext();
        if (!currentUserId || currentUserId === "Guest") {
            alert("Please login first.");
            window.location.href = 'login.html';
            return;
        }
        try {
            const response = await fetch(`${window.SUPABASE_URL}/functions/v1/game-vault`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-secure-engine-key': 'tidye265SecureSecretEngineKey101'
                },
                body: JSON.stringify({
                    action: 'DEDUCT_ENTRY',
                    userId: currentUserId,
                    username: currentUsername,
                    roundId: currentRoundId
                })
            });
            const result = await response.json();
            if (result.success) {
                await GameAuthManager.sync();
                socket.emit('playerVerified', {
                    user_id: currentUserId,
                    username: currentUsername
                });
            } else {
                alert("Payment failed: " + (result.error || "Insufficient balance"));
            }
        } catch (err) {
            console.error("DEDUCT_ENTRY error:", err);
            alert("Network error while processing entry fee. Please try again.");
        }
    }

    // --- BUTTON EVENT LISTENERS ---
    btn.addEventListener('click', () => {
        shoot();
    });

    payBtn.addEventListener('click', () => {
        payEntry();
    });

    // --- INITIALIZATION ---
    function init() {
        resize();
        for (let i = 0; i < 12; i++) clouds.push(new Cloud(true));
        animateClouds();
    }
    init();
</script>
</body>
