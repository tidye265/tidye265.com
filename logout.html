<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging out...</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        body {
            background: #121212;
            color: #fff;
            font-family: system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,215,0,0.3);
            border-top: 4px solid #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p>Securely logging out...</p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        async function logoutUser() {
            // Retrieve the stored session details
            let sessionToken = null;
            try {
                const raw = localStorage.getItem('tidye_session_token');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    sessionToken = parsed.access_token || parsed;
                }
            } catch (e) {}

            const userId = localStorage.getItem('tidye_user_code') || localStorage.getItem('tidye_user_id');

            // If we have the necessary data, call the backend to delete the session
            if (userId && sessionToken) {
                try {
                    await fetch(`${window.SUPABASE_URL}/functions/v1/api-logout`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${window.SUPABASE_ANON_KEY}`
                        },
                        body: JSON.stringify({
                            user_id: userId,
                            session_token: sessionToken
                        })
                    });
                } catch (e) {
                    console.warn('Logout API call failed, clearing locally anyway');
                }
            }

            // Clear all authentication data from localStorage
            localStorage.removeItem('tidye_session_token');
            localStorage.removeItem('tidye_user_code');
            localStorage.removeItem('tidye_user_id');
            localStorage.removeItem('tidye_user_favorites');
            // (add any other user-specific keys if needed)

            // Redirect to login page
            window.location.href = 'login.html';
        }

        logoutUser();
    </script>
</body>
</html>
