<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- High-End Security Policies -->
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Secure Logout - Tidye265</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    :root {
        --dark: #111827;
        --soft: #f3f4f6;
        --gold: #FFD700;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #fff;
        color: var(--dark);
        font-family: 'Inter', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
    }
    .logout-container {
        text-align: center;
        padding: 40px 20px;
        max-width: 350px;
        width: 100%;
    }
    .spinner-box {
        width: 80px;
        height: 80px;
        margin: 0 auto 25px auto;
        position: relative;
    }
    /* Smooth Professional Spinner */
    .circular-loader {
        width: 100%;
        height: 100%;
        border: 4px solid var(--soft);
        border-top-color: var(--gold);
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    .icon-center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 24px;
        color: var(--dark);
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    h2 {
        font-family: 'Lexend', sans-serif;
        font-size: 22px;
        margin-bottom: 10px;
    }
    p {
        font-size: 14px;
        color: #6b7280;
        line-height: 1.5;
    }
</style>
</head>
<body>

<div class="logout-container">
    <div class="spinner-box">
        <div class="circular-loader"></div>
        <i class="fa-solid fa-lock icon-center"></i>
    </div>
    <h2>Signing Out</h2>
    <p>Please wait while we securely clear your session...</p>
</div>

<script src="supabase.js"></script>

<script>
    // ==========================================
    // SECURE SESSION DESTRUCTION LOGIC
    // ==========================================
    document.addEventListener("DOMContentLoaded", async () => {
        const Logger = {
            info: (msg) => console.log(`[INFO] ${new Date().toISOString()} - ${msg}`),
            error: (msg, err) => console.error(`[ERROR] ${new Date().toISOString()} - ${msg}`, err)
        };

        try {
            Logger.info("Initiating secure logout process...");

            // 1. CLEAR LOCAL STORAGE (Frontend State)
            localStorage.removeItem("tidye_user");
            localStorage.removeItem("tidye_session");
            sessionStorage.clear();

            // 2. CALL BACKEND TO DESTROY HTTP-ONLY COOKIES (Production Standard)
            // Ngati muli ndi Supabase Edge function ya logout, iyi ndiyo code yake:
            try {
                /* 
                await fetch(`${SUPABASE_URL}/functions/v1/logout_265`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                }); 
                */
               // Ngati mukugwiritsa ntchito Supabase Auth Service mwachindunji:
               // await supabase.auth.signOut();
            } catch (backendErr) {
                Logger.error("Backend token destruction failed, proceeding with local clear.", backendErr);
            }

            // 3. CLEAR BROWSER HISTORY STATE (Prevent Back-Button Access)
            window.history.replaceState(null, null, window.location.href);

        } catch (err) {
            Logger.error("Critical error during logout", err);
        } finally {
            // 4. REDIRECT TO REGISTER (With a slight professional delay for UX)
            setTimeout(() => {
                window.location.replace("login.html");
            }, 1500);
        }
    });
</script>

</body>
</html>
