<style>
        /* --- BOTTOM NAVIGATION BAR --- */
        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            background: #ffffff; 
            display: flex; 
            justify-content: space-around; 
            padding: 12px 0 25px 0; 
            z-index: 1000; 
            border-top: 1px solid var(--border); 
        }
        .nav-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 4px; 
            text-decoration: none; 
            color: var(--text-dim); 
            font-size: 10px; 
            font-family: 'Lexend', sans-serif; 
            transition: 0.3s;
        }
        .nav-item.active { 
            color: var(--primary); 
        }
        .nav-item i { font-size: 18px; }
        
        .trade-btn-container {
            position: relative;
            margin-top: -20px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .trade-btn-outer {
            width: 66px; 
            height: 66px;
            border-radius: 50%;
            border: 2px solid var(--primary); 
            background: #ffffff; 
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .trade-btn-outer:active {
            transform: scale(0.95);
        }
        .trade-btn-main { 
            width: 50px; 
            height: 50px; 
            background: var(--primary); 
            color: #000; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 20px; 
            box-shadow: none; 
        }
        
        .modal-overlay { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.4); 
            display: none; 
            align-items: center; 
            justify-content: center; 
            z-index: 3000; 
            padding: 20px; 
            backdrop-filter: blur(4px); 
        }
        .modal-content { 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 28px; 
            width: 100%; 
            max-width: 300px; 
            text-align: center; 
            border: 1px solid var(--border); 
        }
        .modal-btn { 
            background: var(--primary); 
            color: #000; 
            border: none; 
            padding: 12px; 
            border-radius: 12px; 
            margin-top: 20px; 
            font-weight: 700; 
            width: 100%; 
            cursor: pointer; 
        }

        .side-menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.2); backdrop-filter: blur(5px);
            z-index: 4000; opacity: 0; visibility: hidden; transition: 0.3s ease;
        }
        .side-menu-overlay.active { opacity: 1; visibility: visible; }

        .slide-menu {
            position: fixed; bottom: -100%; left: 0; width: 100%;
            background: #ffffff; border-radius: 30px 30px 0 0;
            z-index: 4001; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px 20px 40px 20px; border-top: 1px solid var(--border);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
        }
        .slide-menu.active { bottom: 0; }

        .menu-header {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }
        .menu-drag-handle { 
            width: 40px; height: 5px; background: #e5e7eb; 
            border-radius: 10px; 
        }
        .menu-close-btn {
            position: absolute;
            right: 0;
            top: -10px;
            width: 32px; height: 32px;
            background: #f3f4f6;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-dim);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .menu-close-btn:active {
            background: var(--primary);
            color: #000;
            transform: rotate(90deg) scale(0.9);
        }

        .slide-menu-list { list-style: none; padding: 0; margin: 0; }
        .slide-menu-list li { 
            margin-bottom: 10px; 
            opacity: 0; 
            transform: translateY(20px); 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .slide-menu.active .slide-menu-list li {
            opacity: 1;
            transform: translateY(0);
        }
        .slide-menu.active .slide-menu-list li:nth-child(1) { transition-delay: 0.1s; }
        .slide-menu.active .slide-menu-list li:nth-child(2) { transition-delay: 0.15s; }
        .slide-menu.active .slide-menu-list li:nth-child(3) { transition-delay: 0.2s; }
        .slide-menu.active .slide-menu-list li:nth-child(4) { transition-delay: 0.25s; }
        .slide-menu.active .slide-menu-list li:nth-child(5) { transition-delay: 0.3s; }
        .slide-menu.active .slide-menu-list li:nth-child(6) { transition-delay: 0.35s; }

        .slide-menu-list a {
            display: flex; align-items: center; gap: 15px; padding: 15px;
            color: var(--text-light); text-decoration: none; font-family: 'Lexend', sans-serif; font-size: 15px; font-weight: 600;
            background: #f9fafb; border-radius: 16px; transition: 0.2s; border: 1px solid var(--border);
        }
        .slide-menu-list a:active { background: rgba(255, 215, 0, 0.1); border-color: var(--primary); color: #000; transform: scale(0.98); }
        .slide-menu-list i { font-size: 18px; color: var(--text-dim); width: 24px; text-align: center; }
        
        .logout-btn { background: #fef2f2 !important; color: #ff4d4d !important; }
        .logout-btn i { color: #ff4d4d !important; }
    </style>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>

        <a href="market.html" class="nav-item">
            <i class="fa-solid fa-chart-line"></i>
            <span>Market</span>
        </a>

        <div class="trade-btn-container">
            <a href="trade.html" class="trade-btn-outer">
                <div class="trade-btn-main">
                    <i class="fa-solid fa-plus"></i>
                </div>
            </a>
        </div>

        <a href="wallet.html" class="nav-item">
            <i class="fa-solid fa-wallet"></i>
            <span>Wallet</span>
        </a>

        <a href="javascript:void(0)" class="nav-item" onclick="openAppMenu()">
            <i class="fa-solid fa-bars"></i>
            <span>Menu</span>
        </a>
    </nav>

    <div class="side-menu-overlay" id="menuOverlay" onclick="closeAppMenu()"></div>
    <div class="slide-menu" id="slideMenu">
        
        <div class="menu-header">
            <div class="menu-drag-handle" onclick="closeAppMenu()"></div>
            <div class="menu-close-btn" onclick="closeAppMenu()">
                <i class="fa-solid fa-xmark"></i>
            </div>
        </div>

        <ul class="slide-menu-list">
            <li><a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a></li>
            <li><a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a></li>
            <li><a href="support.html"><i class="fa-solid fa-headset"></i> Support</a></li>
            <li><a href="faq.html"><i class="fa-solid fa-circle-question"></i> FaQ</a></li>
            <li><a href="about.html"><i class="fa-solid fa-circle-info"></i> About us</a></li>
            <li style="margin-top: 20px;"><a href="logout.html" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
        </ul>
    </div>

    <div id="comingSoon" class="modal-overlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <i class="fa-solid fa-rocket" style="font-size: 40px; color: var(--primary); margin-bottom: 15px;"></i>
            <h3 style="font-family:'Lexend'; margin-bottom: 10px;">Coming Soon</h3>
            <p style="font-size:13px; color:var(--text-dim);">This feature is under development for tidye265 Live.</p>
            <button class="modal-btn" onclick="closeModal()">Got it</button>
        </div>
    </div>

    <script>
        function showSoon() { document.getElementById('comingSoon').style.display = 'flex'; }
        function closeModal() { document.getElementById('comingSoon').style.display = 'none'; }

        function openAppMenu() {
            document.getElementById('menuOverlay').classList.add('active');
            document.getElementById('slideMenu').classList.add('active');
        }
        function closeAppMenu() {
            document.getElementById('menuOverlay').classList.remove('active');
            document.getElementById('slideMenu').classList.remove('active');
        }
    </script>
