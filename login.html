<body>

    <!-- ===== STICKY HEADER (matching casino.html) ===== -->

    <!-- ===== LOGIN MAIN ===== -->
    <main class="login-wrapper" id="loginContent">
        <!-- Skeleton loader shown while checking existing session -->
        <div id="skeletonLoader">
            <div class="skeleton-circle"></div>
            <div class="skeleton-line"></div>

    <script src="supabase.js"></script>
    <script>
        // ========== SESSION CHECK – REDIRECT IF ALREADY LOGGED IN ==========
        function getCleanSessionToken() {
            let rawToken = localStorage.getItem('tidye_session_token');
            if (!rawToken || rawToken === 'null' || rawToken === 'undefined') return null;
            try {
                let parsed = JSON.parse(rawToken);
                if (parsed?.access_token) return parsed.access_token;
                if (typeof parsed === 'string') return parsed;
            } catch (e) {}
            return rawToken.replace(/^["']|["']$/g, '').trim();
        }

        async function checkExistingSession() {
            const token = getCleanSessionToken();
            if (!token) {
                // No session – show login form
                document.getElementById('skeletonLoader').style.display = 'none';
                document.getElementById('loginFormContainer').style.display = 'block';
                return;
            }

            // Verify the token is still valid by calling wallet-api
            try {
                const res = await fetch(`${SUPABASE_URL}/functions/v1/wallet-api`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    // Valid session – redirect to dashboard
                    window.location.href = 'dashboard.html';
                    return;
                }
            } catch (e) {
                console.warn('Session check failed, showing login form');
            }

            // Token invalid – clear it and show login
            localStorage.removeItem('tidye_session_token');
            document.getElementById('skeletonLoader').style.display = 'none';
            document.getElementById('loginFormContainer').style.display = 'block';
        }

        // ========== TURNSTILE (invisible) ==========
        const TURNSTILE_SITEKEY = "0x4AAAAAADQhPHJB5viRCO84";
        let turnstileWidgetId = null;
        let turnstileToken = null;
        let turnstileTokenCreatedAt = 0;

        function initializeTurnstile() {
            if (typeof turnstile === 'undefined') {
                setTimeout(initializeTurnstile, 300);
                return;
            }
            try {
                turnstileWidgetId = turnstile.render('#turnstileWidget', {
                    sitekey: TURNSTILE_SITEKEY,
                    action: 'login',
                    size: 'invisible',
                    callback: function(token) {
                        turnstileToken = token;
                        turnstileTokenCreatedAt = Date.now();
                    },
                    'expired-callback': function() {
                        turnstileToken = null;
                        turnstile.reset(turnstileWidgetId);
                        turnstile.execute(turnstileWidgetId);
                    },
                    'error-callback': function() {
                        turnstileToken = null;
                    }
                });
                // Execute immediately so token is ready when user submits
                setTimeout(() => {
                    if (turnstileWidgetId !== null) {
                        turnstile.execute(turnstileWidgetId);
                    }
                }, 500);
            } catch (err) {
                console.error('Turnstile init error:', err);
            }
        }

        function isTokenValid() {
            return turnstileToken && (Date.now() - turnstileTokenCreatedAt < 120000); // 2 minutes
        }

        function refreshTurnstile() {
            turnstileToken = null;
            if (typeof turnstile !== 'undefined' && turnstileWidgetId !== null) {
                turnstile.reset(turnstileWidgetId);
                turnstile.execute(turnstileWidgetId);
            }
        }

        // ========== PASSWORD TOGGLE ==========
        const passwordInput = document.getElementById('passwordInput');
        const togglePassword = document.getElementById('togglePassword');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            if (type === 'text') {
                togglePassword.classList.remove('bi-eye');
                togglePassword.classList.add('bi-eye-slash');
            } else {
                togglePassword.classList.remove('bi-eye-slash');
                togglePassword.classList.add('bi-eye');
            }
        });

        // ========== RATE LIMITING ==========
        function hitRateLimit() {
            const now = Date.now();
            let attempts = JSON.parse(localStorage.getItem('log_rate_limit') || '[]');
            attempts = attempts.filter(time => now - time < 3 * 60 * 1000);
            if (attempts.length >= 5) return false;
            attempts.push(now);
            localStorage.setItem('log_rate_limit', JSON.stringify(attempts));
            return true;
        }

        // ========== FORM SUBMISSION ==========
        const form = document.getElementById('loginForm');
        const btn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Honeypot
            if (document.getElementById('botSecurity').value !== '') return;

            // Refresh Turnstile token if expired
            if (!isTokenValid()) {
                refreshTurnstile();
                showAlert('Security check in progress, please try again in a moment.', 'error');
                return;
            }

            // Rate limiting
            if (!hitRateLimit()) {
                showAlert('Too many attempts. Please wait 3 minutes.', 'error');
                return;
            }

            if (typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined') {
                showAlert('System configuration error. Please try again later.', 'error');
                return;
            }

            let rawPhone = document.getElementById('phone').value.trim().replace(/\s+/g, '');
            const pin = passwordInput.value.trim();

            // Phone normalization
            if (rawPhone.startsWith('+265')) rawPhone = '0' + rawPhone.slice(4);
            else if (rawPhone.startsWith('265')) rawPhone = '0' + rawPhone.slice(3);
            else if (rawPhone.length === 9 && /^[8934]/.test(rawPhone)) rawPhone = '0' + rawPhone;

            const malawiRegex = /^0(88|99|98|89|97|31|41)\d{7}$/;
            if (!malawiRegex.test(rawPhone)) {
                showAlert('Enter a valid Malawi phone number (e.g. 088xxxxxxx)', 'error');
                return;
            }

            btn.classList.add('loading');
            btn.innerHTML = '<i class="bi bi-arrow-repeat spin-icon"></i> Signing in...';

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/login_265`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    },
                    body: JSON.stringify({
                        phone_number: rawPhone,
                        pin: pin,
                        turnstileToken: turnstileToken
                    })
                });

                let dataResult = null;
                try { dataResult = await response.json(); } catch (e) {}

                if (!response.ok) {
                    const msg = dataResult?.error || `Server error: ${response.status}`;
                    throw new Error(msg);
                }

                if (dataResult.success && dataResult.sessionToken) {
                    localStorage.setItem('tidye_session_token', dataResult.sessionToken);
                    showAlert('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1200);
                } else {
                    showAlert('Login failed. Please check your credentials.', 'error');
                    btn.classList.remove('loading');
                    btn.innerHTML = 'LOGIN NOW';
                }
            } catch (error) {
                console.error('Login error:', error);
                if (error.message === 'INVALID_CREDENTIALS' || error.message.includes('Invalid login')) {
                    showAlert('The phone number or PIN is incorrect.', 'error');
                } else {
                    showAlert(`Error: ${error.message}`, 'error');
                }
                btn.classList.remove('loading');
                btn.innerHTML = 'LOGIN NOW';
                refreshTurnstile();
            }
        });

        function showAlert(msg, type) {
            alertBox.style.display = 'block';
            alertBox.className = `alert ${type}`;
            alertBox.innerText = msg;
            if (type === 'success') return;
            setTimeout(() => { alertBox.style.display = 'none'; }, 6000);
        }

        // ========== INIT ==========
        document.addEventListener('DOMContentLoaded', async () => {
            await checkExistingSession();
            initializeTurnstile();

            // Auto-refresh Turnstile token every 90 seconds
            setInterval(() => {
                if (!isTokenValid()) refreshTurnstile();
            }, 90000);
        });
    </script>
