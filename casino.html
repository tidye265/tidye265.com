<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Casino Dashboard | Premium Games</title>
    <style>
        /* ----- GLOBAL RESET & VARIABLES (Matches Dashboard) ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-body: #0d1721;
            --bg-sidebar: #15222f;
            --bg-card: #1e2a38;
            --bg-input: #081017;
            --color-text: #9ab0c6;
            --color-white: #e3edf7;
            --color-accent: #509304;
            --color-accent-hover: #5da800;
            --color-danger: #e74c3c;
            --shadow-sm: 0 8px 20px rgba(0,0,0,0.3);
            --border-glow: 0 0 0 2px rgba(80,147,4,0.3);
        }

        body {
            background-color: var(--bg-body);
            color: var(--color-text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* main app wrapper */
        .app {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 20px 30px;
        }

        /* ========== HEADER & SUBHEADER ========== */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            background: var(--bg-sidebar);
            padding: 15px 25px;
            border-radius: 28px;
            box-shadow: var(--shadow-sm);
        }

        .logo-area h1 {
            font-size: 1.6rem;
            color: var(--color-white);
            letter-spacing: -0.5px;
        }
        .logo-area span {
            color: var(--color-accent);
        }

        .user-info {
            background: var(--bg-input);
            padding: 8px 20px;
            border-radius: 40px;
            display: flex;
            align-items: baseline;
            gap: 12px;
            font-weight: bold;
        }
        .user-info span:first-child {
            color: var(--color-text);
            font-size: 0.85rem;
        }
        .user-balance {
            color: #ffd966;
            font-size: 1.4rem;
            font-weight: 800;
        }
        .currency {
            font-size: 0.8rem;
            color: var(--color-text);
            margin-left: 4px;
        }

        /* subheader with click effects */
        .subheader {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
            background: rgba(21,34,47,0.6);
            padding: 10px 20px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
        }
        .category-chip {
            background: var(--bg-input);
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            color: var(--color-white);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .category-chip:hover {
            background: var(--bg-tile-hover);
            transform: translateY(-2px);
        }
        .category-chip:active {
            transform: scale(0.94);
            background: var(--color-accent);
        }
        .category-chip.active {
            background: var(--color-accent);
            box-shadow: 0 0 8px var(--color-accent);
        }

        /* Games grid - 3 columns responsive */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .game-card {
            background: var(--bg-card);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.25s ease;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 8px 18px rgba(0,0,0,0.4);
        }
        .game-card:hover {
            transform: translateY(-6px);
            border-color: var(--color-accent);
            box-shadow: 0 18px 28px -8px black;
        }
        .game-card:active {
            transform: scale(0.97);
        }
        .card-img {
            width: 100%;
            aspect-ratio: 16 / 10;
            background: #0f1a24;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            background-size: cover;
            background-position: center;
            background-color: #111f2c;
        }
        .card-info {
            padding: 16px;
        }
        .card-info h3 {
            color: var(--color-white);
            font-size: 1.25rem;
            margin-bottom: 6px;
        }
        .card-info p {
            font-size: 0.8rem;
            color: var(--color-text);
        }
        .game-badge {
            display: inline-block;
            background: var(--color-accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-top: 10px;
        }

        /* Game container (Mines embed) */
        .game-embed-container {
            margin-top: 20px;
            border-radius: 32px;
            background: var(--bg-sidebar);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: all 0.2s;
        }
        .back-to-lobby {
            background: var(--bg-tile);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            margin-bottom: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .back-to-lobby:hover {
            background: var(--color-accent);
            transform: translateX(-4px);
        }

        /* Loading & errors */
        .loader {
            text-align: center;
            padding: 60px;
            color: var(--color-white);
        }
        .error-msg {
            background: rgba(231,76,60,0.2);
            padding: 16px;
            border-radius: 20px;
            text-align: center;
            color: #ff9e8f;
        }

        /* responsive */
        @media (max-width: 700px) {
            .app { padding: 16px; }
            .top-header { flex-direction: column; align-items: stretch; text-align: center; }
            .user-info { justify-content: center; }
            .subheader { justify-content: center; }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="top-header">
        <div class="logo-area">
            <h1>🎰 CASINO<span>HUB</span></h1>
        </div>
        <div class="user-info">
            <span>👤 BALANCE</span>
            <span class="user-balance" id="dashboardBalance">0.00</span>
            <span class="currency">MWK</span>
        </div>
    </div>

    <!-- subheader with click effects -->
    <div class="subheader" id="subheader">
        <button class="category-chip active" data-cat="all">🎲 ALL GAMES</button>
        <button class="category-chip" data-cat="crash">💥 CRASH</button>
        <button class="category-chip" data-cat="mines">💣 MINES</button>
        <button class="category-chip" data-cat="slots">🎰 SLOTS</button>
    </div>

    <!-- Dynamic content: either games grid or game embed -->
    <div id="dynamic-area">
        <div class="loader" id="loader">Loading premium games... 🎲</div>
        <div class="games-grid" id="gamesGrid" style="display: none;"></div>
    </div>
</div>

<script>
    // ======================== CONFIGURATION ========================
    // === IMPORTANT: Set your Edge Function URL here (production) ===
    const EDGE_FUNCTION_URL = "/functions/v1/all-games-api";   // replace with your actual URL e.g. https://xxxx.supabase.co/functions/v1/all-games-api
    // If you need absolute URL, set it below:
    // const EDGE_FUNCTION_URL = "https://your-project-ref.supabase.co/functions/v1/all-games-api";
    
    // Session handling: retrieve token from cookie 'tidye_session' or localStorage
    function getSessionToken() {
        // cookie
        const match = document.cookie.match(/tidye_session=([^;]+)/);
        if (match) return match[1];
        return localStorage.getItem("tidye_session");
    }

    // Global state
    let currentUser = null;      // { username, balance, session_valid }
    let allGames = [];
    let activeGameComponent = null;   // hold current opened game
    let activeFilter = "all";

    // DOM elements
    const dashboardBalanceSpan = document.getElementById("dashboardBalance");
    const dynamicArea = document.getElementById("dynamic-area");
    const gamesGridDiv = document.getElementById("gamesGrid");
    const loaderDiv = document.getElementById("loader");

    // Helper: update dashboard balance display
    function updateDashboardBalanceUI(balanceValue) {
        if (dashboardBalanceSpan) dashboardBalanceSpan.innerText = balanceValue.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
    }

    // ========== FETCH GAMES & USER DATA FROM EDGE FUNCTION ==========
    async function fetchGamesAndUser() {
        try {
            const token = getSessionToken();
            const headers = {
                "Content-Type": "application/json",
            };
            if (token) {
                headers["Authorization"] = `Bearer ${token}`;
            }

            const response = await fetch(EDGE_FUNCTION_URL, {
                method: "POST",
                headers: headers,
                credentials: "include",
                body: JSON.stringify({ action: "get_dashboard" })   // action from your edge function
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const result = await response.json();
            console.log("[API Response]", result);

            if (result.success) {
                // user data (might be null if not logged in)
                if (result.user && result.user.balance !== undefined) {
                    currentUser = result.user;
                    updateDashboardBalanceUI(currentUser.balance);
                } else {
                    // Fallback demo balance (but still show dashboard)
                    currentUser = { username: "Guest", balance: 5000.00, session_valid: false };
                    updateDashboardBalanceUI(currentUser.balance);
                }

                // games list
                if (result.data && Array.isArray(result.data)) {
                    allGames = result.data;
                    renderGamesGrid(allGames);
                } else {
                    throw new Error("No games array from API");
                }
            } else {
                throw new Error(result.error || "Unknown API error");
            }
        } catch (err) {
            console.error("[Fetch Error]", err);
            loaderDiv.innerHTML = `<div class="error-msg">⚠️ Failed to load games: ${err.message}<br>Make sure Edge Function URL is correct and CORS is enabled.</div>`;
            loaderDiv.style.display = "block";
            gamesGridDiv.style.display = "none";
        } finally {
            if (loaderDiv) loaderDiv.style.display = "none";
        }
    }

    // Render games grid (3 column layout by CSS)
    function renderGamesGrid(games) {
        if (!gamesGridDiv) return;
        let filtered = games;
        if (activeFilter !== "all") {
            filtered = games.filter(g => (g.category || g.category_tag || "").toLowerCase() === activeFilter);
        }
        if (filtered.length === 0) {
            gamesGridDiv.innerHTML = `<div class="error-msg" style="grid-column:1/-1; text-align:center;">🎮 No games in this category yet.</div>`;
            gamesGridDiv.style.display = "grid";
            return;
        }
        gamesGridDiv.innerHTML = filtered.map(game => `
            <div class="game-card" data-game-id="${game.id}" data-game-name="${escapeHtml(game.name)}" data-game-url="${game.game_url || ''}" data-category="${game.category_tag || game.category || ''}">
                <div class="card-img" style="background-image: url('${game.image_url || ''}'); background-size: cover; background-position: center;">
                    ${!game.image_url ? '🎰' : ''}
                </div>
                <div class="card-info">
                    <h3>${escapeHtml(game.name)}</h3>
                    <p>${escapeHtml(game.category || 'Casino')}</p>
                    <div class="game-badge">PLAY NOW</div>
                </div>
            </div>
        `).join('');
        gamesGridDiv.style.display = "grid";

        // attach click handlers
        document.querySelectorAll('.game-card').forEach(card => {
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                const gameId = card.dataset.gameId;
                const gameName = card.dataset.gameName;
                const category = card.dataset.category;
                // Check if this is Mines category or "Mines" in name
                if (category === 'mines' || gameName.toLowerCase().includes('mines')) {
                    launchMinesGame();
                } else {
                    // For other games: open in new tab or show placeholder
                    alert(`🎮 "${gameName}" will be available soon. Full integration ready via Edge Function.`);
                }
            });
        });
    }

    // Helper: escapeHtml
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    // ========== MINES GAME (FULL INTEGRATION WITH DASHBOARD BALANCE) ==========
    function launchMinesGame() {
        // Hide games grid, show Mines game UI
        gamesGridDiv.style.display = "none";
        loaderDiv.style.display = "none";
        // remove previous game embed if exists
        const existingEmbed = document.getElementById('mines-game-embed');
        if(existingEmbed) existingEmbed.remove();

        const embedContainer = document.createElement('div');
        embedContainer.id = 'mines-game-embed';
        embedContainer.className = 'game-embed-container';
        embedContainer.innerHTML = `
            <div style="padding: 20px;">
                <button class="back-to-lobby" id="backToLobbyBtn">← BACK TO LOBBY</button>
            </div>
            <div id="minesRoot" style="min-height: 600px;"></div>
        `;
        dynamicArea.appendChild(embedContainer);

        // Render Mines Game inside #minesRoot
        const minesRoot = document.getElementById('minesRoot');
        if(!minesRoot) return;
        
        // Transfer current dashboard balance to Mines game
        const initialBalance = currentUser ? currentUser.balance : 5000;
        renderMinesGame(minesRoot, initialBalance, (newBalance) => {
            // callback when balance changes inside Mines
            currentUser.balance = newBalance;
            updateDashboardBalanceUI(newBalance);
            // Optional: persist via API endpoint (future)
            console.log("[Balance updated locally]", newBalance);
        });

        // attach back button
        const backBtn = document.getElementById('backToLobbyBtn');
        if(backBtn) {
            backBtn.addEventListener('click', () => {
                embedContainer.remove();
                gamesGridDiv.style.display = "grid";
                // re-render grid to keep fresh
                renderGamesGrid(allGames);
            });
        }
    }

    // ---------- MINES GAME CORE (matching exact premium design, uses real balance) ----------
    function renderMinesGame(container, startingBalance, onBalanceUpdate) {
        // inject full Mines HTML/CSS (same premium style)
        const gameHTML = `
        <style>
            /* Mines embedded style - matches original premium design */
            .mines-wrapper {
                background: var(--bg-sidebar);
                padding: 20px 16px 30px;
                border-radius: 28px;
                color: var(--color-text);
            }
            .mines-grid {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: 10px;
                max-width: 500px;
                margin: 20px auto;
                aspect-ratio: 1/1;
            }
            .mines-tile {
                background: linear-gradient(145deg, var(--bg-tile), #1e2c3a);
                border-radius: 12px;
                cursor: pointer;
                transition: 0.2s;
                box-shadow: 0 4px 0 #0b1116;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .mines-tile:active { transform: scale(0.94); }
            .mines-tile.revealed { background: #081017; transform: scale(0.96); }
            .mines-tile img { width: 60%; opacity: 0; transition: 0.2s; }
            .mines-tile.revealed img { opacity: 1; }
            .mine-controls {
                background: var(--bg-input);
                border-radius: 32px;
                padding: 18px;
                margin-top: 20px;
            }
            .bet-row {
                display: flex;
                gap: 12px;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
            }
            .bet-input-group {
                background: #0a121c;
                border-radius: 44px;
                padding: 5px 15px;
                flex: 1;
            }
            .bet-input-group input {
                background: transparent;
                border: none;
                color: white;
                font-size: 1.2rem;
                font-weight: bold;
                width: 100%;
                outline: none;
            }
            .action-mines-btn {
                background: var(--color-accent);
                border: none;
                padding: 12px 24px;
                border-radius: 44px;
                font-weight: bold;
                color: white;
                cursor: pointer;
                transition: 0.2s;
                font-size: 1rem;
            }
            .action-mines-btn.cashout { background: #e67e22; }
            .action-mines-btn:disabled { opacity: 0.5; cursor: not-allowed; }
            .multiplier-box {
                background: #00000055;
                padding: 8px 16px;
                border-radius: 28px;
                font-weight: bold;
                font-size: 1.2rem;
            }
            .balance-mines {
                font-size: 1rem;
                background: #0a111c;
                padding: 6px 12px;
                border-radius: 28px;
            }
            .error-msg { color: #ffaa88; text-align: center; margin: 10px; }
        </style>
        <div class="mines-wrapper">
            <div style="display: flex; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">
                <div class="balance-mines">💰 Balance: <span id="minesBalance">${startingBalance.toFixed(2)}</span> MWK</div>
                <div class="multiplier-box" id="multiplierDisplay">1.00x</div>
            </div>
            <div class="mines-grid" id="minesGrid"></div>
            <div class="mine-controls">
                <div class="bet-row">
                    <div class="bet-input-group">
                        <label style="font-size:12px;">BET AMOUNT</label>
                        <input type="number" id="minesBetInput" value="100" step="50" min="10">
                    </div>
                    <button id="minesActionBtn" class="action-mines-btn">💣 BET</button>
                </div>
                <div style="margin-top: 12px; display: flex; gap: 12px; justify-content: space-between;">
                    <button id="minesRestartBtn" style="background:#2c3e50;" class="action-mines-btn">🔄 RESTART</button>
                    <span id="minesStatus" style="font-size:13px;">⚡ Start new round</span>
                </div>
            </div>
        </div>
        `;
        container.innerHTML = gameHTML;

        // Game state
        let balance = startingBalance;
        let isGameActive = false;
        let currentBet = 0;
        let currentMines = 3;
        let minePositions = [];
        let revealedCount = 0;
        let currentMultiplier = 1;
        const HOUSE_EDGE = 0.97;
        let autoRestartTimer = null;

        const minesBalanceSpan = document.getElementById('minesBalance');
        const minesGridDiv = document.getElementById('minesGrid');
        const minesBetInput = document.getElementById('minesBetInput');
        const minesActionBtn = document.getElementById('minesActionBtn');
        const minesRestartBtn = document.getElementById('minesRestartBtn');
        const multiplierSpan = document.getElementById('multiplierDisplay');
        const statusSpan = document.getElementById('minesStatus');

        function updateMinesUI() {
            minesBalanceSpan.innerText = balance.toFixed(2);
            if(onBalanceUpdate) onBalanceUpdate(balance);
            // Also update main dashboard
            if(dashboardBalanceSpan) dashboardBalanceSpan.innerText = balance.toLocaleString('en-US', {minimumFractionDigits:2});
        }

        function getRandomPositions(count) {
            const positions = [];
            while(positions.length < count) {
                const r = Math.floor(Math.random() * 25);
                if(!positions.includes(r)) positions.push(r);
            }
            return positions;
        }

        function getMultiplier(mines, clicks) {
            let prob = 1;
            for(let i=0; i<clicks; i++) prob *= (25 - mines - i) / (25 - i);
            let mult = (1 / prob) * HOUSE_EDGE;
            return parseFloat(mult.toFixed(2));
        }

        function initGridUI() {
            minesGridDiv.innerHTML = '';
            for(let i=0;i<25;i++) {
                const tile = document.createElement('div');
                tile.className = 'mines-tile';
                tile.dataset.idx = i;
                tile.innerHTML = `<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffd966' width='30'%3E%3Cpolygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/%3E%3C/svg%3E" style="display:none;">`;
                tile.addEventListener('click', () => onTileClick(i, tile));
                minesGridDiv.appendChild(tile);
            }
        }

        function revealAllTiles(winMode) {
            for(let i=0;i<25;i++) {
                const tile = minesGridDiv.children[i];
                if(!tile.classList.contains('revealed')) {
                    tile.classList.add('revealed');
                    if(minePositions.includes(i)) {
                        tile.innerHTML = `<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e74c3c' width='30'%3E%3Ccircle cx='12' cy='12' r='10' fill='%23c0392b'/%3E%3Crect x='11' y='4' width='2' height='6' fill='black'/%3E%3C/svg%3E" style="display:block;">`;
                    } else {
                        tile.innerHTML = `<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f1c40f' width='30'%3E%3Cpolygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/%3E%3C/svg%3E" style="display:block;">`;
                    }
                }
            }
        }

        function endGame(isWin, winAmount = 0) {
            if(!isGameActive) return;
            isGameActive = false;
            revealAllTiles(isWin);
            if(isWin && winAmount>0) {
                balance += winAmount;
                statusSpan.innerText = `🎉 YOU WON ${winAmount.toFixed(2)} MWK!`;
            } else {
                statusSpan.innerText = `💥 BOMB! You lost ${currentBet.toFixed(2)} MWK.`;
            }
            updateMinesUI();
            minesActionBtn.innerText = "💣 BET";
            minesActionBtn.classList.remove('cashout');
            minesActionBtn.disabled = false;
            minesBetInput.disabled = false;
            if(autoRestartTimer) clearTimeout(autoRestartTimer);
            autoRestartTimer = setTimeout(() => {
                if(!isGameActive && balance >= 10) {
                    startNewRound();
                }
            }, 2000);
        }

        function cashout() {
            if(!isGameActive) return;
            const winAmount = currentBet * currentMultiplier;
            balance += winAmount;
            updateMinesUI();
            endGame(true, winAmount);
        }

        function onTileClick(index, tileEl) {
            if(!isGameActive || tileEl.classList.contains('revealed')) return;
            tileEl.classList.add('revealed');
            if(minePositions.includes(index)) {
                tileEl.innerHTML = `<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e74c3c' width='30'%3E%3Ccircle cx='12' cy='12' r='10' fill='%23c0392b'/%3E%3Crect x='11' y='4' width='2' height='6' fill='black'/%3E%3C/svg%3E" style="display:block;">`;
                endGame(false);
            } else {
                tileEl.innerHTML = `<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffd966' width='30'%3E%3Cpolygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/%3E%3C/svg%3E" style="display:block;">`;
                revealedCount++;
                currentMultiplier = getMultiplier(currentMines, revealedCount);
                multiplierSpan.innerText = `${currentMultiplier}x`;
                if(revealedCount === (25 - currentMines)) {
                    cashout();
                } else {
                    // update cashout amount preview
                    const potentialWin = currentBet * currentMultiplier;
                    minesActionBtn.innerText = `💰 CASHOUT ${potentialWin.toFixed(2)}`;
                    minesActionBtn.classList.add('cashout');
                }
            }
        }

        function startNewRound() {
            if(isGameActive) return;
            const betVal = parseFloat(minesBetInput.value);
            if(isNaN(betVal) || betVal <= 0 || balance < betVal) {
                statusSpan.innerText = "❌ Invalid bet or insufficient balance";
                return;
            }
            balance -= betVal;
            updateMinesUI();
            currentBet = betVal;
            isGameActive = true;
            revealedCount = 0;
            currentMultiplier = 1;
            multiplierSpan.innerText = "1.00x";
            currentMines = 3; // fixed 3 mines, can be extended later
            minePositions = getRandomPositions(currentMines);
            initGridUI();
            minesActionBtn.innerText = `💰 CASHOUT ${currentBet.toFixed(2)}`;
            minesActionBtn.classList.add('cashout');
            minesBetInput.disabled = true;
            statusSpan.innerText = "✨ Pick safe tiles!";
        }

        // event bindings
        minesActionBtn.onclick = () => {
            if(!isGameActive) startNewRound();
            else cashout();
        };
        minesRestartBtn.onclick = () => {
            if(autoRestartTimer) clearTimeout(autoRestartTimer);
            if(isGameActive) {
                endGame(false);
            }
            setTimeout(() => { startNewRound(); }, 200);
        };
        // initial grid
        initGridUI();
        updateMinesUI();
        statusSpan.innerText = "Press BET to start";
        minesActionBtn.classList.remove('cashout');
        minesActionBtn.innerText = "💣 BET";
    }

    // ========== SUBHEADER CLICK EFFECTS & FILTER ==========
    function initSubheader() {
        const chips = document.querySelectorAll('.category-chip');
        chips.forEach(chip => {
            chip.addEventListener('click', (e) => {
                chips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                activeFilter = chip.dataset.cat;
                renderGamesGrid(allGames);
            });
        });
    }

    // ========== BOOTSTRAP ==========
    (async function init() {
        await fetchGamesAndUser();
        initSubheader();
        // if there's any open mines embed, ensure balance sync
    })();
</script>
</body>
