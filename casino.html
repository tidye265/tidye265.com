<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Casino | Premium Gaming</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a1f2e;
            --accent: #00f2fe;
            --accent2: #4facfe;
            --gold: #ffd700;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #1e293b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --gradient-1: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --gradient-2: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-3: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-4: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --shadow-glow: 0 0 30px rgba(0, 242, 254, 0.15);
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.3);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(0, 242, 254, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(79, 172, 254, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(102, 126, 234, 0.03) 0%, transparent 50%);
        }

        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* Header */
        .header {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: var(--gradient-1);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: var(--shadow-glow);
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .balance-display {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            padding: 10px 18px;
            border-radius: 50px;
            border: 1px solid var(--border);
        }

        .balance-icon {
            color: var(--gold);
            font-size: 18px;
        }

        .balance-amount {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: var(--gold);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gradient-2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Main Container */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* Hero Section */
        .hero-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 12px;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .hero-subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        /* Category Tabs */
        .category-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .category-tab {
            padding: 10px 24px;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 15px;
        }

        .category-tab:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .category-tab.active {
            background: var(--gradient-1);
            color: var(--bg-primary);
            border-color: transparent;
            font-weight: 600;
            box-shadow: var(--shadow-glow);
        }

        /* Search Bar */
        .search-container {
            margin-bottom: 32px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 16px;
            font-family: 'Rajdhani', sans-serif;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
        }

        /* Games Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        /* Game Card */
        .game-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--border);
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-glow), var(--shadow-card);
            border-color: rgba(0, 242, 254, 0.3);
        }

        .game-thumbnail {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: var(--bg-secondary);
            position: relative;
        }

        .game-thumbnail-placeholder {
            width: 100%;
            height: 180px;
            background: var(--gradient-2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: rgba(255, 255, 255, 0.3);
        }

        .game-provider-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
        }

        .game-info {
            padding: 16px;
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
        }

        .game-rating {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--gold);
        }

        .play-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 20px;
            border-radius: 50px;
            background: var(--gradient-1);
            color: var(--bg-primary);
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            width: 100%;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
        }

        .play-btn:hover {
            box-shadow: var(--shadow-glow);
            transform: scale(1.02);
        }

        /* Loading Spinner */
        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 0;
            gap: 16px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 16px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Modal / Iframe Container */
        .game-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .game-modal.active {
            display: flex;
        }

        .modal-content {
            width: 95%;
            height: 90%;
            max-width: 1200px;
            background: var(--bg-secondary);
            border-radius: var(--radius-xl);
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 16px;
            color: var(--text-primary);
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .modal-close:hover {
            background: rgba(239, 68, 68, 0.4);
        }

        .game-iframe {
            width: 100%;
            height: calc(100% - 50px);
            border: none;
        }

        .iframe-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        /* Error Message */
        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--danger);
            padding: 14px 20px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 28px;
            }
            
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
            }
            
            .game-thumbnail {
                height: 130px;
            }
            
            .game-thumbnail-placeholder {
                height: 130px;
                font-size: 32px;
            }
            
            .category-tab {
                padding: 8px 16px;
                font-size: 13px;
            }
            
            .modal-content {
                width: 100%;
                height: 100%;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="bg-animation"></div>
    <div class="bg-grid"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="fa-solid fa-crown"></i>
                </div>
                <span class="logo-text">GALACTIC CASINO</span>
            </div>
            <div class="user-section">
                <div class="balance-display">
                    <i class="fa-solid fa-coins balance-icon"></i>
                    <span class="balance-amount" id="userBalance">0.00</span>
                </div>
                <div class="user-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <!-- Hero Section -->
        <section class="hero-section">
            <h1 class="hero-title">PREMIUM CASINO</h1>
            <p class="hero-subtitle">Discover our exclusive collection of premium games</p>
        </section>

        <!-- Category Tabs -->
        <div class="category-tabs" id="categoryTabs">
            <button class="category-tab active" data-category="all">🎮 All Games</button>
            <button class="category-tab" data-category="slots">🎰 Slots</button>
            <button class="category-tab" data-category="live">🎥 Live Casino</button>
            <button class="category-tab" data-category="table">🃏 Table Games</button>
            <button class="category-tab" data-category="fishing">🎣 Fishing</button>
            <button class="category-tab" data-category="arcade">🕹️ Arcade</button>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <i class="fa-solid fa-search search-icon"></i>
            <input 
                type="text" 
                class="search-input" 
                id="searchInput" 
                placeholder="Search games by name or provider..."
            >
        </div>

        <!-- Error Message -->
        <div class="error-message" id="errorMessage" style="display: none;"></div>

        <!-- Games Grid -->
        <div class="games-grid" id="gamesGrid">
            <!-- Loading Spinner -->
            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner"></div>
                <span class="loading-text">Loading games...</span>
            </div>
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <i class="fa-solid fa-gamepad"></i>
            <h3>No games found</h3>
            <p>Try adjusting your search or category filter</p>
        </div>
    </main>

    <!-- Game Modal (Iframe) -->
    <div class="game-modal" id="gameModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" id="modalGameTitle">Game Title</span>
                <button class="modal-close" id="modalClose" title="Close Game">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <!-- Iframe for game -->
            <iframe 
                class="game-iframe" 
                id="gameIframe" 
                src="" 
                allow="camera; microphone; fullscreen; payment"
                allowfullscreen
            ></iframe>
            <!-- Loading overlay for iframe -->
            <div class="iframe-loading" id="iframeLoading" style="display: none;">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script>
        // ==================== CONFIGURATION ====================
        const SUPABASE_URL = window.SUPABASE_URL || 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'YOUR_SUPABASE_ANON_KEY';
        const sessionToken = window.sessionToken || localStorage.getItem('session_token') || '';
        const userCode = window.userCode || localStorage.getItem('user_code') || '';

        // ==================== STATE ====================
        let allGames = [];
        let currentCategory = 'all';
        let searchQuery = '';

        // ==================== DOM ELEMENTS ====================
        const gamesGrid = document.getElementById('gamesGrid');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const emptyState = document.getElementById('emptyState');
        const errorMessage = document.getElementById('errorMessage');
        const searchInput = document.getElementById('searchInput');
        const categoryTabs = document.getElementById('categoryTabs');
        const gameModal = document.getElementById('gameModal');
        const gameIframe = document.getElementById('gameIframe');
        const modalGameTitle = document.getElementById('modalGameTitle');
        const iframeLoading = document.getElementById('iframeLoading');
        const userBalanceEl = document.getElementById('userBalance');

        // ==================== INITIALIZATION ====================
        document.addEventListener('DOMContentLoaded', () => {
            fetchGames();
            fetchUserBalance();
            setupEventListeners();
        });

        // ==================== EVENT LISTENERS ====================
        function setupEventListeners() {
            // Category tabs
            categoryTabs.addEventListener('click', (e) => {
                const tab = e.target.closest('.category-tab');
                if (!tab) return;
                
                document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.dataset.category;
                filterAndRenderGames();
            });

            // Search input
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase().trim();
                filterAndRenderGames();
            });

            // Modal close
            document.getElementById('modalClose').addEventListener('click', closeGameModal);
            
            // Close modal on background click
            gameModal.addEventListener('click', (e) => {
                if (e.target === gameModal) {
                    closeGameModal();
                }
            });

            // Iframe load event
            gameIframe.addEventListener('load', () => {
                iframeLoading.style.display = 'none';
            });

            // Close modal with Escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && gameModal.classList.contains('active')) {
                    closeGameModal();
                }
            });
        }

        // ==================== FETCH GAMES FROM DATABASE ====================
        async function fetchGames() {
            showLoading(true);
            hideError();
            
            try {
                // UPGRADE: Kugwiritsa ntchito all-games-api kuchokera ku database yanu
                const response = await fetch(`${SUPABASE_URL}/functions/v1/all-games-api`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`Failed to fetch games: ${response.status}`);
                }

                const data = await response.json();
                
                if (data && data.games && Array.isArray(data.games)) {
                    allGames = data.games;
                    filterAndRenderGames();
                } else if (Array.isArray(data)) {
                    allGames = data;
                    filterAndRenderGames();
                } else {
                    throw new Error('Invalid games data format');
                }
                
            } catch (error) {
                console.error('Error fetching games:', error);
                showError('Failed to load games. Please try again later.');
                allGames = [];
                renderGames([]);
            } finally {
                showLoading(false);
            }
        }

        // ==================== FETCH USER BALANCE ====================
        async function fetchUserBalance() {
            if (!userCode) return;
            
            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/api-casino-getaway`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Callback-Token': 'YOUR_CALLBACK_TOKEN' // Ikani token yanu
                    },
                    body: JSON.stringify({
                        action: 'GetBalance',
                        user_code: userCode
                    })
                });

                const data = await response.json();
                if (data.code === 0 && data.data) {
                    userBalanceEl.textContent = parseFloat(data.data.point).toLocaleString('en-US', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    });
                }
            } catch (error) {
                console.error('Error fetching balance:', error);
            }
        }

        // ==================== LAUNCH GAME (UPGRADED) ====================
        async function launchGame(gameSymbol, gameName) {
            if (!sessionToken || !userCode) {
                showError('Please login to play games');
                return;
            }

            // Show modal with loading state
            openGameModal(gameName);

            try {
                // UPGRADE: Kugwiritsa ntchito api-casino-links kulumikiza ku MegaNodes
                const response = await fetch(`${SUPABASE_URL}/functions/v1/api-casino-links`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${sessionToken}`
                    },
                    body: JSON.stringify({
                        user_code: userCode,
                        game_symbol: gameSymbol
                    })
                });

                const data = await response.json();

                if (data.success && data.launch_url) {
                    // UPGRADE: Kutsegula game mu iframe m'malo mwa window.open
                    gameIframe.src = data.launch_url;
                    iframeLoading.style.display = 'block';
                } else {
                    throw new Error(data.error || 'Failed to get game launch URL');
                }
                
            } catch (error) {
                console.error('Error launching game:', error);
                showError('Failed to launch game. Please try again.');
                closeGameModal();
            }
        }

        // ==================== GAME MODAL FUNCTIONS ====================
        function openGameModal(gameTitle) {
            modalGameTitle.textContent = gameTitle || 'Loading Game...';
            gameModal.classList.add('active');
            gameIframe.src = '';
            iframeLoading.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeGameModal() {
            gameModal.classList.remove('active');
            gameIframe.src = '';
            iframeLoading.style.display = 'none';
            document.body.style.overflow = '';
            
            // Refresh balance after playing
            fetchUserBalance();
        }

        // ==================== FILTER & RENDER ====================
        function filterAndRenderGames() {
            let filtered = [...allGames];

            // Filter by category
            if (currentCategory !== 'all') {
                filtered = filtered.filter(game => {
                    const category = (game.category || game.game_category || '').toLowerCase();
                    const type = (game.type || game.game_type || '').toLowerCase();
                    return category.includes(currentCategory) || type.includes(currentCategory);
                });
            }

            // Filter by search
            if (searchQuery) {
                filtered = filtered.filter(game => {
                    const name = (game.name || game.game_name || '').toLowerCase();
                    const provider = (game.provider || game.game_provider || '').toLowerCase();
                    const symbol = (game.symbol || game.game_symbol || '').toLowerCase();
                    return name.includes(searchQuery) || 
                           provider.includes(searchQuery) || 
                           symbol.includes(searchQuery);
                });
            }

            renderGames(filtered);
        }

        // ==================== RENDER GAMES ====================
        function renderGames(games) {
            gamesGrid.innerHTML = '';

            if (games.length === 0) {
                emptyState.style.display = 'block';
                gamesGrid.style.display = 'none';
                return;
            }

            emptyState.style.display = 'none';
            gamesGrid.style.display = 'grid';

            games.forEach(game => {
                const card = createGameCard(game);
                gamesGrid.appendChild(card);
            });
        }

        // ==================== CREATE GAME CARD ====================
        function createGameCard(game) {
            const card = document.createElement('div');
            card.className = 'game-card';
            
            const gameName = game.name || game.game_name || 'Unknown Game';
            const gameSymbol = game.symbol || game.game_symbol || '';
            const gameProvider = game.provider || game.game_provider || 'Casino';
            const gameImage = game.image || game.thumbnail || game.image_url || '';
            const gameCategory = game.category || game.game_category || 'Slots';
            const gameRating = game.rating || (Math.random() * 2 + 3).toFixed(1); // Fallback rating

            card.innerHTML = `
                <div style="position: relative;">
                    ${gameImage 
                        ? `<img class="game-thumbnail" src="${gameImage}" alt="${gameName}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">`
                        : ''
                    }
                    <div class="game-thumbnail-placeholder" style="${gameImage ? 'display: none;' : 'display: flex;'}">
                        <i class="fa-solid fa-gamepad"></i>
                    </div>
                    <span class="game-provider-badge">${gameProvider}</span>
                </div>
                <div class="game-info">
                    <div class="game-title" title="${gameName}">${gameName}</div>
                    <div class="game-meta">
                        <span>${gameCategory}</span>
                        <span class="game-rating">
                            <i class="fa-solid fa-star"></i>
                            ${gameRating}
                        </span>
                    </div>
                    <button class="play-btn" onclick="launchGame('${gameSymbol}', '${gameName.replace(/'/g, "\\'")}')">
                        ▶ Play Now
                    </button>
                </div>
            `;

            return card;
        }

        // ==================== UTILITY FUNCTIONS ====================
        function showLoading(show) {
            loadingSpinner.style.display = show ? 'flex' : 'none';
            if (show) {
                gamesGrid.innerHTML = '';
                gamesGrid.appendChild(loadingSpinner);
                emptyState.style.display = 'none';
            }
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }
    </script>
</body>
</html>
