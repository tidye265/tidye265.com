<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mines Casino Game - Premium</title>
    <style>
        /* --- 100% ORIGINAL CSS – unchanged --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* ... (all your existing CSS rules – exactly as you wrote them) ... */
        /* (I've omitted the full CSS here for brevity, but it's the same as your original) */
    </style>
</head>
<body>
    <!-- ... (all original HTML structure – nothing changed) ... -->
    <!-- (only the JavaScript part is updated) -->

    <!-- CryptoJS (for HMAC if needed, but now we use session token) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <script>
        // --------------------------------------------------------------
        //  SUPABASE EDGE FUNCTION INTEGRATION – YOUR DESIGN, BACKED BY MINE-API
        // --------------------------------------------------------------
        const API_BASE = 'https://www.tidye265.com/api/mine-api'; // Your actual endpoint
        // Alternatively, the Supabase Edge Function URL:
        // const API_BASE = 'https://<project-ref>.supabase.co/functions/v1/mine-api';

        let sessionToken = ''; // From login_265 (stored in cookie/localStorage)
        let balance = 0;
        let isGameActive = false;
        let isAutoPlaying = false;
        let soundEnabled = true;
        let currentBet = 0;
        let currentMines = 3;
        let currentMultiplier = 1.00;
        let currentGameId = null;

        const STAR_SVG = 'star.svg';
        const BOMB_SVG = 'bomb.svg';

        // DOM Elements
        const grid = document.getElementById('grid');
        const betInput = document.getElementById('bet-input');
        const actionBtn = document.getElementById('action-btn');
        const btnMainText = document.getElementById('btn-main-text');
        const btnSubText = document.getElementById('btn-sub-text');
        const btnIcon = document.getElementById('btn-icon');
        const balanceEl = document.getElementById('balance-amount');
        const autoSwitch = document.getElementById('auto-switch');
        const selectedMinesDisplay = document.getElementById('selected-mines-display');

        // ---------- Helper: Get session token (from login_265) ----------
        function getSessionToken() {
            // Attempt to read from cookie (same as your existing site uses)
            const match = document.cookie.match(/tidye_session=([^;]+)/);
            if (match) return match[1];
            // Fallback: you can also read from localStorage
            return localStorage.getItem('tidye_session') || '';
        }

        // ---------- API calls to mine-api Edge Function ----------
        async function apiCall(action, body = {}) {
            const token = getSessionToken();
            const res = await fetch(API_BASE, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ action, ...body })
            });
            const data = await res.json();
            if (!data.success) throw new Error(data.error);
            return data;
        }

        // ---------- Initialize App ----------
        function initApp() {
            initGrid();
            populateMinesSelector();
            loadBalance();
        }

        async function loadBalance() {
            try {
                const data = await apiCall('balance');
                balance = data.balance;
                updateBalanceDisplay();
            } catch(e) {
                console.error('Balance load failed:', e);
            }
        }

        // ---------- Audio ----------
        const sounds = {
            click: document.getElementById('sfx-click'),
            star: document.getElementById('sfx-star'),
            bomb: document.getElementById('sfx-bomb'),
            win: document.getElementById('sfx-win')
        };
        function playSound(type) {
            if (!soundEnabled) return;
            try {
                sounds[type].currentTime = 0;
                sounds[type].play().catch(() => {});
            } catch(e) {}
        }
        function toggleSound() { soundEnabled = document.getElementById('sound-switch').checked; }

        // ---------- Modal ----------
        function openModal(id) {
            if(isGameActive && !isAutoPlaying && id === 'mines-modal') return;
            document.getElementById('overlay').classList.add('active');
            document.getElementById(id).classList.add('active');
            playSound('click');
        }
        function closeAllModals() {
            document.getElementById('overlay').classList.remove('active');
            document.querySelectorAll('.slide-modal, .slide-modal-left').forEach(m => m.classList.remove('active'));
            playSound('click');
        }

        // ---------- Mines Selector ----------
        function populateMinesSelector() {
            const container = document.getElementById('mines-grid-selector');
            container.innerHTML = '';
            for (let i = 1; i <= 24; i++) {
                let btn = document.createElement('button');
                btn.className = `mine-select-btn ${i === currentMines ? 'selected' : ''}`;
                btn.innerText = i;
                btn.onclick = () => {
                    if (isGameActive) return;
                    currentMines = i;
                    selectedMinesDisplay.innerText = i;
                    document.querySelectorAll('.mine-select-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    closeAllModals();
                };
                container.appendChild(btn);
            }
        }

        // ---------- Balance & Betting ----------
        function updateBalanceDisplay() {
            balanceEl.innerText = balance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }
        function adjustBet(amount) {
            if(isGameActive || isAutoPlaying) return;
            playSound('click');
            let val = parseFloat(betInput.value) || 0;
            betInput.value = Math.max(10.00, (val + amount)).toFixed(2);
        }

        // ---------- Grid ----------
        function initGrid() {
            grid.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const tile = document.createElement('button');
                tile.classList.add('tile');
                tile.dataset.index = i;
                tile.onclick = () => handleTileClick(i, tile);
                grid.appendChild(tile);
            }
        }

        // ---------- Main actions ----------
        function handleRestart() {
            playSound('click');
            if (isGameActive) {
                cashout();
                setTimeout(() => { if (balance >= parseFloat(betInput.value)) startGame(); }, 500);
            } else {
                if (balance >= parseFloat(betInput.value)) startGame();
                else alert("Insufficient balance");
            }
        }

        function toggleAutoModeUI() {
            playSound('click');
            if(!autoSwitch.checked && isAutoPlaying) stopAutoPlay();
        }

        function handleMainAction() {
            playSound('click');
            if (autoSwitch.checked) {
                if (isAutoPlaying) stopAutoPlay();
                else startAutoPlay();
                return;
            }
            if (!isGameActive) startGame();
            else cashout();
        }

        // ---------- Auto Play ----------
        async function startAutoPlay() { /* ... same logic, but calling server APIs ... */ }
        function stopAutoPlay() { /* ... */ }

        // ---------- Core game server calls ----------
        async function startGame() {
            currentBet = parseFloat(betInput.value);
            if (isNaN(currentBet) || currentBet <= 0 || balance < currentBet) {
                alert("Invalid bet or insufficient balance.");
                return;
            }
            try {
                const data = await apiCall('new_game', {
                    bet_amount: currentBet,
                    mine_count: currentMines,
                    client_seed: ''   // optional
                });
                currentGameId = data.game_id;
                balance = data.balance; // server returns updated balance
                updateBalanceDisplay();
                isGameActive = true;
                currentMultiplier = 1.00;
                betInput.disabled = true;
                initGrid();
                if(!isAutoPlaying) updateButtonUI(true);
            } catch(e) {
                alert('Error: ' + e.message);
            }
        }

        async function handleTileClick(index, tileElement) {
            if (!isGameActive || !currentGameId) return;
            if (tileElement.classList.contains('revealed')) return;

            tileElement.classList.add('revealed');
            tileElement.disabled = true;

            try {
                const data = await apiCall('reveal', {
                    game_id: currentGameId,
                    tile_index: index
                });

                if (data.result === 'bomb') {
                    playSound('bomb');
                    tileElement.innerHTML = `<img src="${BOMB_SVG}" alt="Bomb" class="bomb-img">`;
                    grid.style.boxShadow = "0 0 40px rgba(231,76,60,0.4)";
                    setTimeout(() => grid.style.boxShadow = "none", 500);
                    gameOver(false);
                } else {
                    playSound('star');
                    tileElement.innerHTML = `<img src="${STAR_SVG}" alt="Star" class="star-img">`;
                    currentMultiplier = data.current_multiplier;
                    if(!isAutoPlaying) updateButtonUI(true);

                    if (data.game_state === 'all_stars') {
                        await cashout(); // auto cashout
                    }
                }
            } catch(e) {
                // Rollback
                tileElement.classList.remove('revealed');
                tileElement.disabled = false;
                tileElement.innerHTML = '';
                alert('Server error: ' + e.message);
            }
        }

        async function cashout() {
            if (!isGameActive || !currentGameId) return;
            try {
                const data = await apiCall('cashout', { game_id: currentGameId });
                balance = data.balance;
                updateBalanceDisplay();
                playSound('win');
                gameOver(true, data.payout);
            } catch(e) {
                alert('Cashout failed: ' + e.message);
            }
        }

        function gameOver(isWin, winAmount = 0) {
            isGameActive = false;
            betInput.disabled = false;
            actionBtn.classList.remove('cashout-state');
            currentGameId = null;
            setTimeout(() => {
                if(!isAutoPlaying) {
                    btnMainText.innerText = 'BET';
                    btnIcon.style.display = 'block';
                    btnSubText.style.display = 'none';
                    actionBtn.disabled = false;
                }
            }, 200);
        }

        function updateButtonUI(canCashout) { /* ... identical to your logic ... */ }

        function randomizeTiles() {
            playSound('click');
            if (isGameActive) cashout();
        }

        // Init
        initApp();
    </script>
</body>
</html>
