<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tidye265 | update</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #FAFAFA;
            --main-dark: #0A0A0A;
            --accent-yellow: #FFD700;
            --pure-white: #FFFFFF;
        }

        body, html {
            height: 100%;
            margin: 0;
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: var(--main-dark);
        }

        /* Top Left Logo */
        .brand-logo {
            position: absolute;
            top: 30px;
            left: 40px;
            height: 55px;
            width: auto;
            z-index: 100;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.05));
        }

        /* Main Container Container */
        .maintenance-wrapper {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* High-End Typography */
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 3.5rem;
            letter-spacing: -1px;
            margin-top: 2rem;
            text-transform: uppercase;
            position: relative;
            z-index: 10;
        }

        h1 span {
            color: var(--accent-yellow);
            text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
        }

        /* Vector & Animation Stage */
        .animation-stage {
            position: relative;
            width: 450px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, rgba(250,250,250,0) 70%);
        }

        /* Center Vector Image */
        .center-vector {
            width: 220px;
            height: auto;
            z-index: 5;
            position: relative;
            animation: gentleFloat 4s ease-in-out infinite;
        }

        /* Floating Game & Casino Elements */
        .floating-asset {
            position: absolute;
            width: 60px;
            height: auto;
            z-index: 10;
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.1));
        }

        .asset-1 { top: 10%; left: 15%; animation: orbitFloat 5s ease-in-out infinite; }
        .asset-2 { top: 15%; right: 10%; animation: orbitFloat 6s ease-in-out infinite 1s; }
        .asset-3 { bottom: 15%; left: 10%; animation: orbitFloat 4.5s ease-in-out infinite 0.5s; }
        .asset-4 { bottom: 10%; right: 15%; animation: orbitFloat 5.5s ease-in-out infinite 1.5s; }

        /* Bootstrap Icon Indicators (Gears, Sports, Casino) */
        .status-icons {
            display: flex;
            gap: 2rem;
            font-size: 2.5rem;
            color: var(--main-dark);
            margin-top: 1rem;
            opacity: 0.8;
            z-index: 10;
        }

        .status-icons i.spin-slow {
            animation: spin 8s linear infinite;
        }
        
        .status-icons i.pulse-icon {
            animation: pulseColor 3s infinite;
        }

        /* Background Decor Lines */
        .bg-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        
        .shape-line {
            position: absolute;
            background-color: var(--accent-yellow);
            height: 4px;
            width: 150px;
            border-radius: 2px;
            opacity: 0.3;
            transform: rotate(-45deg);
        }

        .line-1 { top: 20%; left: -50px; }
        .line-2 { bottom: 30%; right: -20px; width: 250px; }

        /* KEYFRAMES */
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes orbitFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseColor {
            0%, 100% { color: var(--main-dark); transform: scale(1); }
            50% { color: var(--accent-yellow); transform: scale(1.1); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; text-align: center; }
            .animation-stage { width: 320px; height: 320px; }
            .center-vector { width: 160px; }
            .floating-asset { width: 45px; }
            .brand-logo { left: 50%; transform: translateX(-50%); top: 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-shapes">
        <div class="shape-line line-1"></div>
        <div class="shape-line line-2"></div>
    </div>

    <img src="logo.jpg" alt="Platform Logo" class="brand-logo">

    <div class="maintenance-wrapper">
        
        <div class="animation-stage">
            <img src="aviator.png" alt="Aviator" class="floating-asset asset-1">
            <img src="games.svg" alt="Games" class="floating-asset asset-2">
            
            <img src="ava.jpg" alt="Professional Interface Vector" class="center-vector">
            
            <img src="casino.svg" alt="Casino" class="floating-asset asset-3">
            <img src="vi.png" alt="Virtuals" class="floating-asset asset-4">
        </div>

        <h1>Optimizing <span>Arena</span></h1>

        <div class="status-icons">
            <i class="bi bi-gear-wide-connected spin-slow"></i>
            <i class="bi bi-dribbble pulse-icon"></i>
            <i class="bi bi-suit-spade-fill pulse-icon" style="animation-delay: 1s;"></i>
            <i class="bi bi-dice-5-fill pulse-icon" style="animation-delay: 2s;"></i>
            <i class="bi bi-gear spin-slow" style="animation-direction: reverse;"></i>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
