<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data:;">
    <title>tidye265 | System Upgrade</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #FAFAFA;
            --main-dark: #0A0A0A;
            --accent-yellow: #FFD700;
            --pure-white: #FFFFFF;
        }

        body, html {
            height: 100%;
            margin: 0;
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: var(--main-dark);
            /* Frontend Security: Prevent text highlighting */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Prevent image dragging globally */
        img {
            -webkit-user-drag: none;
            pointer-events: none; /* Makes images unclickable/undraggable */
        }

        .brand-logo {
            position: absolute;
            top: 30px;
            left: 40px;
            height: 55px;
            width: auto;
            z-index: 100;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.05));
        }

        .maintenance-wrapper {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* High-End Typography - Exact casing preserved */
        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 1.5rem;
            z-index: 10;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 3.8rem;
            letter-spacing: -1px;
            margin: 0;
            position: relative;
            text-align: center;
            line-height: 1.1;
        }

        h1 span {
            color: var(--accent-yellow);
            text-shadow: 1.5px 1.5px 0 #000, -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000;
            font-size: 4.2rem;
        }

        /* Construction Cones styling */
        .cone-icon {
            font-size: 3.5rem;
            color: var(--accent-yellow);
            filter: drop-shadow(2px 2px 0px #000);
            animation: pulseColor 3s infinite;
        }

        /* Vector & Animation Stage */
        .animation-stage {
            position: relative;
            width: 450px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.15) 0%, rgba(250,250,250,0) 70%);
            box-shadow: inset 0 0 50px rgba(255, 215, 0, 0.05);
        }

        /* Center Vector Image (Upgraded Size & ava.png) */
        .center-vector {
            width: 320px; /* Wamkulu bwino */
            height: auto;
            z-index: 5;
            position: relative;
            animation: gentleFloat 4s ease-in-out infinite;
            filter: drop-shadow(0px 15px 25px rgba(0,0,0,0.15));
        }

        /* Floating Assets Container */
        .floating-asset {
            position: absolute;
            width: 65px;
            height: auto;
            z-index: 10;
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.15));
        }

        /* Upgraded Animations with live.svg */
        .asset-1 { top: 8%; left: 12%; animation: orbitFloat 5s ease-in-out infinite; }
        .asset-2 { top: 18%; right: 5%; animation: orbitFloat 6s ease-in-out infinite 1s; }
        .asset-3 { bottom: 12%; left: 8%; animation: orbitFloat 4.5s ease-in-out infinite 0.5s; }
        .asset-4 { bottom: 8%; right: 12%; animation: orbitFloat 5.5s ease-in-out infinite 1.5s; }
        .asset-5 { top: -5%; left: 45%; width: 75px; animation: orbitFloat 4s ease-in-out infinite 0.2s; } /* live.svg */

        .status-icons {
            display: flex;
            gap: 2.5rem;
            font-size: 2.5rem;
            color: var(--main-dark);
            margin-top: 1.5rem;
            opacity: 0.85;
            z-index: 10;
        }

        .status-icons i.spin-slow { animation: spin 8s linear infinite; }
        .status-icons i.pulse-icon { animation: pulseColor 3s infinite; }

        .bg-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        
        .shape-line {
            position: absolute;
            background-color: var(--accent-yellow);
            height: 4px;
            width: 150px;
            border-radius: 2px;
            opacity: 0.3;
            transform: rotate(-45deg);
        }

        .line-1 { top: 20%; left: -50px; }
        .line-2 { bottom: 30%; right: -20px; width: 250px; }

        /* KEYFRAMES */
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes orbitFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseColor {
            0%, 100% { color: var(--main-dark); transform: scale(1); }
            50% { color: var(--accent-yellow); transform: scale(1.1); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            h1 span { font-size: 2.8rem; }
            .cone-icon { font-size: 2.5rem; }
            .animation-stage { width: 320px; height: 320px; }
            .center-vector { width: 240px; }
            .floating-asset { width: 50px; }
            .asset-5 { width: 60px; }
            .brand-logo { left: 50%; transform: translateX(-50%); top: 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-shapes">
        <div class="shape-line line-1"></div>
        <div class="shape-line line-2"></div>
    </div>

    <img src="logo.jpg" alt="tidye265 Logo" class="brand-logo" draggable="false" style="pointer-events: auto;">

    <div class="maintenance-wrapper">
        
        <div class="animation-stage">
            <img src="live.svg" alt="Live Betting" class="floating-asset asset-5">
            <img src="aviator.png" alt="Aviator" class="floating-asset asset-1">
            <img src="games.svg" alt="Games" class="floating-asset asset-2">
            
            <img src="ava.png" alt="Professional Interface Avatar" class="center-vector">
            
            <img src="casino.svg" alt="Casino" class="floating-asset asset-3">
            <img src="vi.png" alt="Virtuals" class="floating-asset asset-4">
        </div>

        <div class="title-container">
            <i class="bi bi-cone-striped cone-icon"></i>
            <h1>UNder <br><span>MaiNteNaNce</span></h1>
            <i class="bi bi-cone-striped cone-icon"></i>
        </div>

        <div class="status-icons">
            <i class="bi bi-gear-wide-connected spin-slow"></i>
            <i class="bi bi-dribbble pulse-icon"></i>
            <i class="bi bi-suit-spade-fill pulse-icon" style="animation-delay: 1s;"></i>
            <i class="bi bi-dice-5-fill pulse-icon" style="animation-delay: 2s;"></i>
            <i class="bi bi-gear spin-slow" style="animation-direction: reverse;"></i>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // 1. Disable Right-Click (Context Menu)
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // 2. Disable Keyboard Shortcuts for Developer Tools (F12, Ctrl+Shift+I, Ctrl+U)
        document.onkeydown = function(e) {
            // Disable F12
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Disable Ctrl+Shift+I (Inspect)
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.keyCode === 73)) {
                e.preventDefault();
                return false;
            }
            // Disable Ctrl+Shift+J (Console)
            if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j' || e.keyCode === 74)) {
                e.preventDefault();
                return false;
            }
            // Disable Ctrl+U (View Source)
            if (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
        };

        // 3. Disable Dragging for the entire document just to be safe
        document.addEventListener('dragstart', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
