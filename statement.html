<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transaction Statement | tiDye265</title>
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co;">
    <meta name="theme-color" content="#121212">

    <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/400.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/500.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/600.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/700.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/lexend@5.0.18/400.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/lexend@5.0.18/600.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/lexend@5.0.18/700.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        :root {
            --bg: #F4F6F8;
            --primary: #FFD700;
            --card-bg: #FFFFFF;
            --text-light: #1a1d21;
            --text-dim: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); font-family: 'Inter', sans-serif; padding-bottom: 30px; }
        
        /* Header - sticky & frozen */
        .header {
            background: #fff;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-action { color: var(--text-light); font-size: 18px; text-decoration: none; display: flex; align-items: center; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        
        /* Balance widget in header (same as deposit.html) */
        .header-balance {
            background: #EFF2F6;
            border-radius: 40px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #1a1d21;
            white-space: nowrap;
        }
        .header-balance i { font-size: 14px; color: #5b677b; }
        .header-balance .balance-amount-header {
            font-family: 'Lexend', sans-serif;
            font-weight: 700;
            letter-spacing: -0.2px;
        }
        
        /* Stats Row - grey & black */
        .stats-row {
            display: flex;
            gap: 12px;
            margin: 15px 15px 20px 15px;
        }
        .stat-card {
            background: #fff;
            border-radius: 16px;
            padding: 12px 15px;
            flex: 1;
            text-align: center;
            border: 1px solid #eef2f6;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .stat-card .stat-value { font-family: 'Lexend'; font-size: 18px; font-weight: 700; color: #1a1d21; }
        .stat-card .stat-label { font-size: 11px; color: #6b7280; margin-top: 4px; font-weight: 500; }
        
        /* Transactions Container - professional grey/black */
        .transactions-container {
            background: #fff;
            border-radius: 20px;
            margin: 0 15px;
            border: 1px solid #eef2f6;
            overflow: hidden;
        }
        .section-title {
            padding: 14px 18px;
            font-weight: 600;
            font-size: 13px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #eef2f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .transaction-item {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f2f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .transaction-item:active { background: #f9fafb; }
        .transaction-left { display: flex; align-items: center; gap: 12px; }
        .transaction-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .deposit-icon { background: #f0fdf4; color: #15803d; }
        .withdrawal-icon { background: #fef2f2; color: #b91c1c; }
        .transaction-info .type { font-weight: 600; font-size: 13px; color: #1a1d21; }
        .transaction-info .date { font-size: 10px; color: #9ca3af; margin-top: 2px; }
        .transaction-right { text-align: right; }
        .transaction-amount { font-family: 'Lexend'; font-weight: 600; font-size: 14px; }
        .deposit-amount { color: #15803d; }
        .withdrawal-amount { color: #b91c1c; }
        .status-badge {
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 30px;
            margin-top: 3px;
            display: inline-block;
            font-weight: 500;
        }
        .status-success { background: #f0fdf4; color: #15803d; }
        .status-pending { background: #fffbeb; color: #b45309; }
        .status-failed { background: #fef2f2; color: #b91c1c; }
        
        /* Skeleton loader - matching new layout */
        .skeleton-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; background: #fff; border-bottom: 1px solid #eef2f6; }
        .skeleton-header .sk-circle { width: 32px; height: 32px; background: #e5e7eb; border-radius: 50%; }
        .skeleton-header .sk-line { height: 14px; width: 100px; background: #e5e7eb; border-radius: 20px; }
        .skeleton-balance { height: 44px; width: calc(100% - 30px); margin: 15px 15px 0 15px; background: #e5e7eb; border-radius: 40px; }
        .skeleton-stats { display: flex; gap: 12px; margin: 15px; }
        .skeleton-stats div { flex: 1; height: 70px; background: #e5e7eb; border-radius: 16px; }
        .skeleton-transactions { background: #fff; margin: 0 15px; border-radius: 20px; padding: 15px; }
        .skeleton-transactions .sk-title { height: 14px; width: 40%; background: #e5e7eb; border-radius: 6px; margin-bottom: 15px; }
        .skeleton-transactions .sk-item { height: 56px; background: #e5e7eb; border-radius: 12px; margin-bottom: 10px; }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #9ca3af;
        }
        .empty-state i { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
        
        #footer-placeholder { margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Skeleton Loader -->
    <div id="loader" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#F4F6F8;z-index:9999;display:flex;flex-direction:column;">
        <div class="skeleton-header">
            <div class="sk-circle"></div>
            <div class="sk-line"></div>
        </div>
        <div class="skeleton-balance"></div>
        <div class="skeleton-stats"><div></div><div></div></div>
        <div class="skeleton-transactions">
            <div class="sk-title"></div>
            <div class="sk-item"></div>
            <div class="sk-item"></div>
            <div class="sk-item"></div>
        </div>
    </div>

    <header class="header">
        <div class="header-left">
            <a href="dashboard.html" class="header-action"><i class="bi bi-arrow-left"></i></a>
        </div>
        <div class="header-right">
            <div class="header-balance" id="headerBalanceWidget">
                <i class="bi bi-wallet2"></i>
                <span class="balance-amount-header" id="walletBalanceHeader">MWK 0.00</span>
            </div>
        </div>
    </header>

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-value" id="totalDeposits">0</div>
            <div class="stat-label">Total Deposits</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="totalWithdrawals">0</div>
            <div class="stat-label">Total Withdrawals</div>
        </div>
    </div>

    <div class="transactions-container">
        <div class="section-title">
            <span>Recent Transactions</span>
            <i class="bi bi-clock-history" style="color: #9ca3af;"></i>
        </div>
        <div id="transactionsList">
            <!-- Transactions will appear here -->
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="supabase.js"></script>
    <script>
        "use strict";

        let globalBalance = 0;

        function getCleanSessionToken() {
            let rawToken = localStorage.getItem('tidye_session_token');
            if (!rawToken || rawToken === 'null' || rawToken === 'undefined') return null;
            try { 
                let parsed = JSON.parse(rawToken); 
                if (parsed?.access_token) return parsed.access_token; 
                if (typeof parsed === 'string') return parsed; 
            } catch(e) {}
            return rawToken.replace(/^["']|["']$/g, '').trim();
        }

        async function fetchBalance() {
            const token = getCleanSessionToken();
            if (!token) return;
            try {
                const res = await fetch(`${window.SUPABASE_URL}/functions/v1/wallet-api`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    globalBalance = Number(data.balance);
                    document.getElementById('walletBalanceHeader').innerHTML = `MWK ${globalBalance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                }
            } catch(e) { console.error(e); }
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-MW', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
        }

        function getStatusBadge(status) {
            const s = (status || '').toLowerCase();
            if (s === 'success') return '<span class="status-badge status-success"><i class="bi bi-check-circle-fill" style="font-size: 9px;"></i> Success</span>';
            if (s === 'pending') return '<span class="status-badge status-pending"><i class="bi bi-hourglass-split" style="font-size: 9px;"></i> Pending</span>';
            if (s === 'failed') return '<span class="status-badge status-failed"><i class="bi bi-x-circle-fill" style="font-size: 9px;"></i> Failed</span>';
            return `<span class="status-badge">${s}</span>`;
        }

        async function loadTransactions() {
            const token = getCleanSessionToken();
            if (!token) { window.location.replace('login.html'); return; }

            const loader = document.getElementById('loader');
            const container = document.getElementById('transactionsList');

            try {
                const response = await fetch(`${window.SUPABASE_URL}/functions/v1/money-service-api`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (!data.success) throw new Error(data.error);

                document.getElementById('totalDeposits').innerText = data.counts.deposits;
                document.getElementById('totalWithdrawals').innerText = data.counts.withdrawals;

                if (!data.transactions || data.transactions.length === 0) {
                    container.innerHTML = `<div class="empty-state"><i class="bi bi-receipt"></i><p>No transactions yet</p><p style="font-size: 12px;">Deposit or withdraw to see your history</p></div>`;
                    return;
                }

                let html = '';
                for (const tx of data.transactions) {
                    const isDeposit = tx.type === 'deposit';
                    const amountClass = isDeposit ? 'deposit-amount' : 'withdrawal-amount';
                    const amountSign = isDeposit ? '+' : '-';
                    const iconClass = isDeposit ? 'deposit-icon' : 'withdrawal-icon';
                    const iconName = isDeposit ? 'bi-arrow-down-circle' : 'bi-arrow-up-circle';
                    
                    html += `
                        <div class="transaction-item">
                            <div class="transaction-left">
                                <div class="transaction-icon ${iconClass}">
                                    <i class="bi ${iconName}"></i>
                                </div>
                                <div class="transaction-info">
                                    <div class="type">${isDeposit ? 'Deposit' : 'Withdrawal'}</div>
                                    <div class="date">${formatDate(tx.date)}</div>
                                    ${getStatusBadge(tx.status)}
                                </div>
                            </div>
                            <div class="transaction-right">
                                <div class="transaction-amount ${amountClass}">${amountSign} MWK ${tx.amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
                                <div style="font-size: 9px; color: #9ca3af; margin-top: 3px;">${tx.reference.substring(0, 8)}...</div>
                            </div>
                        </div>
                    `;
                }
                container.innerHTML = html;
            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="empty-state"><i class="bi bi-exclamation-triangle-fill"></i><p>Failed to load transactions</p><p style="font-size: 12px;">Please try again later</p></div>`;
            } finally {
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => { if(loader) loader.style.display = 'none'; }, 300);
                }
            }
        }

        async function injectDynamicFooter() {
            try {
                const res = await fetch('footer.html');
                if (res.ok) {
                    const htmlContent = await res.text();
                    document.getElementById('footer-placeholder').innerHTML = htmlContent;
                }
            } catch(err) {}
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await fetchBalance();
            await loadTransactions();
            injectDynamicFooter();
        });
    </script>
</body>
</html>
