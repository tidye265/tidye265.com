<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transaction Statement | tiDye265</title>
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co;">
    <meta name="theme-color" content="#121212">

    <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/400.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/500.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/600.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/700.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/lexend@5.0.18/400.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/lexend@5.0.18/600.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/lexend@5.0.18/700.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        :root {
            --bg: #F4F6F8;
            --primary: #FFD700;
            --card-bg: #FFFFFF;
            --text-light: #1a1d21;
            --text-dim: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); font-family: 'Inter', sans-serif; padding-bottom: 30px; }
        
        /* Header */
        .header {
            background: #fff;
            padding: 14px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-logo { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; }
        .header-action { color: var(--text-light); font-size: 18px; text-decoration: none; }
        .page-title { font-family: 'Lexend'; font-weight: 700; font-size: 16px; flex-grow: 1; text-align: center; }
        .header-right { width: 62px; }
        
        /* Balance Card */
        .balance-card {
            background: linear-gradient(135deg, #1e2329 0%, #111418 100%);
            color: white;
            border-radius: 20px;
            padding: 20px;
            margin: 15px 15px 20px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .balance-card .label { font-size: 12px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.5px; }
        .balance-card .amount { font-family: 'Lexend'; font-size: 24px; font-weight: 700; margin-top: 4px; }
        .balance-card i { font-size: 32px; opacity: 0.8; }
        
        /* Stats Row */
        .stats-row {
            display: flex;
            gap: 12px;
            margin: 0 15px 20px 15px;
        }
        .stat-card {
            background: #fff;
            border-radius: 16px;
            padding: 12px 15px;
            flex: 1;
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-card .stat-value { font-family: 'Lexend'; font-size: 20px; font-weight: 700; color: var(--text-light); }
        .stat-card .stat-label { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
        
        /* Transactions Table */
        .transactions-container {
            background: #fff;
            border-radius: 20px;
            margin: 0 15px;
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .section-title {
            padding: 16px 18px;
            font-weight: 700;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .transaction-item {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .transaction-item:active { background: #f9fafb; }
        .transaction-left { display: flex; align-items: center; gap: 12px; }
        .transaction-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .deposit-icon { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .withdrawal-icon { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .transaction-info .type { font-weight: 600; font-size: 14px; }
        .transaction-info .date { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
        .transaction-right { text-align: right; }
        .transaction-amount { font-family: 'Lexend'; font-weight: 700; font-size: 15px; }
        .deposit-amount { color: var(--success); }
        .withdrawal-amount { color: var(--danger); }
        .status-badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 30px;
            margin-top: 4px;
            display: inline-block;
        }
        .status-success { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .status-pending { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .status-failed { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        
        /* Skeleton loader */
        .skeleton-text { height: 14px; background: #e5e7eb; border-radius: 6px; width: 100px; margin-bottom: 6px; }
        .skeleton-subtext { height: 10px; background: #e5e7eb; border-radius: 4px; width: 60px; }
        .skeleton-amount { height: 16px; background: #e5e7eb; border-radius: 6px; width: 70px; }
        .skeleton-badge { height: 18px; background: #e5e7eb; border-radius: 30px; width: 50px; margin-top: 4px; }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-dim);
        }
        .empty-state i { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
        
        #footer-placeholder { margin-top: 20px; }
    </style>
</head>
<body>

    <div id="loader" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#F4F6F8;z-index:9999;display:flex;flex-direction:column;">
        <div style="height:60px;width:100%;margin:0 15px;display:flex;align-items:center;gap:15px;">
            <div style="width:30px;height:30px;background:#e5e7eb;border-radius:50%;"></div>
            <div style="height:14px;flex:1;background:#e5e7eb;border-radius:8px;"></div>
        </div>
        <div style="height:100px;margin:15px;background:#e5e7eb;border-radius:20px;"></div>
        <div style="display:flex;gap:12px;margin:0 15px 20px;">
            <div style="flex:1;height:70px;background:#e5e7eb;border-radius:16px;"></div>
            <div style="flex:1;height:70px;background:#e5e7eb;border-radius:16px;"></div>
        </div>
        <div style="background:#fff;margin:0 15px;border-radius:20px;">
            <div style="height:50px;background:#e5e7eb;border-radius:20px 20px 0 0;"></div>
            <div style="padding:15px;">
                <div style="height:14px;background:#e5e7eb;border-radius:6px;width:50%;margin-bottom:15px;"></div>
                <div style="height:60px;background:#e5e7eb;border-radius:12px;margin-bottom:10px;"></div>
                <div style="height:60px;background:#e5e7eb;border-radius:12px;margin-bottom:10px;"></div>
                <div style="height:60px;background:#e5e7eb;border-radius:12px;"></div>
            </div>
        </div>
    </div>

    <header class="header">
        <div class="header-left">
            <img src="logo.jpg" alt="Logo" class="header-logo">
            <a href="dashboard.html" class="header-action"><i class="bi bi-arrow-left"></i></a>
        </div>
        <div class="page-title">Transaction Statement</div>
        <div class="header-right"></div>
    </header>

    <div class="balance-card" id="balanceCard">
        <div>
            <div class="label">Current Balance</div>
            <div class="amount" id="balanceAmount">MWK 0.00</div>
        </div>
        <i class="bi bi-wallet2"></i>
    </div>

    <div class="stats-row" id="statsRow">
        <div class="stat-card">
            <div class="stat-value" id="totalDeposits">0</div>
            <div class="stat-label">Total Deposits</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="totalWithdrawals">0</div>
            <div class="stat-label">Total Withdrawals</div>
        </div>
    </div>

    <div class="transactions-container">
        <div class="section-title">
            <span>Recent Transactions</span>
            <i class="bi bi-clock-history" style="color: var(--text-dim);"></i>
        </div>
        <div id="transactionsList">
            <!-- Transactions will appear here -->
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="supabase.js"></script>
    <script>
        "use strict";

        let globalBalance = 0;

        function getCleanSessionToken() {
            let rawToken = localStorage.getItem('tidye_session_token');
            if (!rawToken || rawToken === 'null' || rawToken === 'undefined') return null;
            try { 
                let parsed = JSON.parse(rawToken); 
                if (parsed?.access_token) return parsed.access_token; 
                if (typeof parsed === 'string') return parsed; 
            } catch(e) {}
            return rawToken.replace(/^["']|["']$/g, '').trim();
        }

        async function fetchBalance() {
            const token = getCleanSessionToken();
            if (!token) return;
            try {
                const res = await fetch(`${window.SUPABASE_URL}/functions/v1/wallet-api`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    globalBalance = Number(data.balance);
                    document.getElementById('balanceAmount').innerHTML = `MWK ${globalBalance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                }
            } catch(e) { console.error(e); }
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-MW', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function getStatusBadge(status) {
            const s = (status || '').toLowerCase();
            if (s === 'success') return '<span class="status-badge status-success"><i class="bi bi-check-circle-fill" style="font-size: 10px;"></i> Success</span>';
            if (s === 'pending') return '<span class="status-badge status-pending"><i class="bi bi-hourglass-split" style="font-size: 10px;"></i> Pending</span>';
            if (s === 'failed') return '<span class="status-badge status-failed"><i class="bi bi-x-circle-fill" style="font-size: 10px;"></i> Failed</span>';
            return `<span class="status-badge">${s}</span>`;
        }

        async function loadTransactions() {
            const token = getCleanSessionToken();
            if (!token) { window.location.replace('login.html'); return; }

            const loader = document.getElementById('loader');
            const container = document.getElementById('transactionsList');

            try {
                const response = await fetch(`${window.SUPABASE_URL}/functions/v1/money-service-api`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (!data.success) throw new Error(data.error);

                // Update stats
                document.getElementById('totalDeposits').innerText = data.counts.deposits;
                document.getElementById('totalWithdrawals').innerText = data.counts.withdrawals;

                if (!data.transactions || data.transactions.length === 0) {
                    container.innerHTML = `<div class="empty-state"><i class="bi bi-receipt"></i><p>No transactions yet</p><p style="font-size: 12px;">Deposit or withdraw to see your history</p></div>`;
                    return;
                }

                let html = '';
                for (const tx of data.transactions) {
                    const isDeposit = tx.type === 'deposit';
                    const amountClass = isDeposit ? 'deposit-amount' : 'withdrawal-amount';
                    const amountSign = isDeposit ? '+' : '-';
                    const iconClass = isDeposit ? 'deposit-icon' : 'withdrawal-icon';
                    const iconName = isDeposit ? 'bi-arrow-down-circle' : 'bi-arrow-up-circle';
                    
                    html += `
                        <div class="transaction-item">
                            <div class="transaction-left">
                                <div class="transaction-icon ${iconClass}">
                                    <i class="bi ${iconName}"></i>
                                </div>
                                <div class="transaction-info">
                                    <div class="type">${isDeposit ? 'Deposit' : 'Withdrawal'}</div>
                                    <div class="date">${formatDate(tx.date)}</div>
                                    ${getStatusBadge(tx.status)}
                                </div>
                            </div>
                            <div class="transaction-right">
                                <div class="transaction-amount ${amountClass}">${amountSign} MWK ${tx.amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
                                <div style="font-size: 10px; color: var(--text-dim); margin-top: 4px;">${tx.reference.substring(0, 8)}...</div>
                            </div>
                        </div>
                    `;
                }
                container.innerHTML = html;
            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="empty-state"><i class="bi bi-exclamation-triangle-fill"></i><p>Failed to load transactions</p><p style="font-size: 12px;">Please try again later</p></div>`;
            } finally {
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => { if(loader) loader.style.display = 'none'; }, 300);
                }
            }
        }

        async function injectDynamicFooter() {
            try {
                const res = await fetch('footer.html');
                if (res.ok) {
                    const htmlContent = await res.text();
                    document.getElementById('footer-placeholder').innerHTML = htmlContent;
                }
            } catch(err) {}
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await fetchBalance();
            await loadTransactions();
            injectDynamicFooter();
        });
    </script>
</body>
</html>
