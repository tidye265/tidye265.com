<style>
    /* Exact Match Skeleton Loading */
    #loader { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: #F8F9FA; z-index: 9999; padding: 0; 
        display: flex; flex-direction: column; align-items: center; 
    }
    .skeleton { 
        background: #e5e7eb; 
        background: linear-gradient(90deg, #f0f2f5 25%, #e5e7eb 50%, #f0f2f5 75%); 
        background-size: 200% 100%; 
        animation: skeleton-loading 1.5s infinite; 
    }
    @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    
    .sk-header { height: 75px; width: 100%; margin-bottom: 10px; }
    .sk-sub-header { height: 45px; width: 100%; margin-bottom: 15px; }
    .sk-promo-box { height: 80px; width: 90%; margin: 5px auto; border-radius: 18px; }
    .sk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; width: 100%; }
    .sk-grid-item { height: 150px; border-radius: 20px; }
    .sk-footer { position: fixed; bottom: 0; left: 0; width: 100%; height: 50px; background: #ddd; }
    
    /* Header Structural Components */
    header { 
        padding: 0 15px; display: flex; justify-content: space-between; align-items: center; 
        border-bottom: 1px solid #e5e7eb; height: 75px; position: relative; 
        background: #fff;
    }
    .logo-container img { height: 42px; border-radius: 6px; object-fit: contain; transition: opacity 0.3s ease; }
    
    /* Premium Overlay Search Animation Rules */
    .search-wrapper { 
        position: absolute; left: 0; top: 0; width: 100%; height: 100%; 
        background: #ffffff; display: flex; align-items: center; padding: 0 15px; gap: 12px; 
        transform: translateY(-100%); opacity: 0; pointer-events: none; 
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); z-index: 20; 
    }
    .search-wrapper.active { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .search-inner-box { flex: 1; background: #f3f4f6; height: 46px; border-radius: 12px; display: flex; align-items: center; padding: 0 15px; }
    .search-inner-box input { background: transparent; border: none; outline: none; width: 100%; font-size: 15px; font-family: 'Lexend'; margin-left: 10px; color: #1a1d21; }
    .search-close-btn { background: none; border: none; font-size: 20px; color: #4b5563; cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; }
    
    .header-controls { display: flex; align-items: center; gap: 15px; z-index: 10; }
    .search-trigger { cursor: pointer; color: #4b5563; padding: 8px; font-size: 17px; display: flex; align-items: center; justify-content: center; }
    
    /* Balance Controls Components */
    .header-balance-container { 
        display: flex; align-items: center; gap: 10px; background: #f3f4f6; padding: 6px 6px 6px 14px; 
        border-radius: 12px; border: 1px solid #e5e7eb; cursor: pointer; transition: transform 0.2s; 
    }
    .header-balance-container:active { transform: scale(0.96); }
    .header-balance-info { text-align: right; }
    .header-balance-info .bal-label { font-size: 9px; font-weight: 800; color: #4b5563; text-transform: uppercase; display: block; line-height: 1.1; }
    .header-balance-info .bal-amount { font-size: 15px; font-weight: 800; font-family: 'Lexend'; }
    .bal-cents { opacity: 0.4; font-size: 14px; margin-left: 1px; }
    
    /* Deposit Button Custom Spec */
    .header-dep-btn { 
        background: #FFD700; color: #000; width: 40px; height: 37px; 
        border-radius: 10px; display: flex; align-items: center; justify-content: center; 
        font-size: 16px; border: none; font-weight: 800; 
    }
    
    /* Sub-header Navigation Categories */
    .sub-header { 
        display: flex; overflow-x: auto; white-space: nowrap; padding: 12px 15px; gap: 20px; 
        background: #fff; border-bottom: 1px solid #e5e7eb; scrollbar-width: none; 
    }
    .sub-header::-webkit-scrollbar { display: none; }
    .sub-item { font-family: 'Lexend'; font-size: 13px; font-weight: 600; color: #4b5563; text-decoration: none; display: flex; align-items: center; gap: 6px; }
    .sub-item.active { color: #000; border-bottom: 2px solid #FFD700; padding-bottom: 2px; }
</style>

<div id="loader" aria-hidden="true">  
    <div class="skeleton sk-header"></div>  
    <div class="skeleton sk-sub-header"></div>  
    <div class="skeleton sk-promo-box"></div>  
    <div class="skeleton sk-promo-box"></div>  
    <div class="sk-grid">  
        <div class="skeleton sk-grid-item"></div><div class="skeleton sk-grid-item"></div>  
        <div class="skeleton sk-grid-item"></div><div class="skeleton sk-grid-item"></div>  
    </div>  
    <div class="skeleton sk-footer"></div>  
</div>  

<header id="mainHeader">  
    <div class="logo-container">  
        <img src="logo.jpg" alt="Logo">  
    </div>  

    <div class="search-wrapper" id="searchBar" aria-hidden="true">  
        <div class="search-inner-box">  
            <i class="fa-solid fa-magnifying-glass" style="color:#4b5563"></i>  
            <input type="text" placeholder="Search games, categories..." id="searchInput" aria-label="Search Input">  
        </div>  
        <button class="search-close-btn" id="searchClose" aria-label="Close Search">  
            <i class="fa-solid fa-xmark"></i>  
        </button>  
    </div>  
  
    <div class="header-controls">  
        <button class="search-trigger" id="searchToggle" aria-label="Toggle Search" style="background:none;border:none;">  
            <i class="fa-solid fa-magnifying-glass"></i>  
        </button>  
  
        <div class="header-balance-container generic-soon" role="button" tabindex="0" aria-label="Wallet Balance">  
            <div class="header-balance-info">  
                <span class="bal-label">Balance</span>  
                <span class="bal-amount">MWK 50,496<span class="bal-cents">.81</span></span>  
            </div>  
            <div class="header-dep-btn">  
                <i class="fa-solid fa-plus" aria-hidden="true"></i>  
            </div>  
        </div>  
    </div>  
</header>  
  
<nav class="sub-header" aria-label="Quick Links">  
    <a href="#" class="sub-item active"><i class="fa-solid fa-fire"></i> Trending</a>  
    <a href="#" class="sub-item generic-soon"><i class="fa-solid fa-heart"></i> Favorites</a>  
    <a href="shoot.html" class="sub-item"><i class="fa-solid fa-crosshairs"></i> Shooter265</a>  
    <a href="#" class="sub-item generic-soon"><i class="fa-solid fa-chess"></i> Chess</a>  
    <a href="#" class="sub-item generic-soon"><i class="fa-solid fa-table-cells"></i> Bawo</a>  
    <a href="#" class="sub-item generic-soon"><i class="fa-solid fa-chess-board"></i> Draughts</a>  
</nav>  
  
<script>  
    function initLoader() {  
        const loader = document.getElementById('loader');  
        if (loader) {  
            setTimeout(() => {  
                loader.style.opacity = '0';  
                loader.style.transition = 'opacity 0.4s ease';  
                setTimeout(() => loader.remove(), 400);  
            }, 800);  
        }  
    }  
    if (document.readyState === 'complete') { initLoader(); } else { window.addEventListener('load', initLoader); }  
  
    const searchToggle = document.getElementById('searchToggle');  
    const searchClose = document.getElementById('searchClose');  
    const searchBar = document.getElementById('searchBar');  
    const searchInput = document.getElementById('searchInput');  
  
    const openSearch = () => {  
        if (searchBar) {  
            searchBar.classList.add('active');  
            searchBar.setAttribute('aria-hidden', 'false');  
            setTimeout(() => searchInput && searchInput.focus(), 150);  
        }  
    }  
  
    const closeSearch = () => {  
        if (searchBar) {  
            searchBar.classList.remove('active');  
            searchBar.setAttribute('aria-hidden', 'true');  
            if (searchInput) searchInput.value = '';  
        }  
    }  
  
    searchToggle?.addEventListener('click', (e) => { e.stopPropagation(); openSearch(); });  
    searchClose?.addEventListener('click', (e) => { e.stopPropagation(); closeSearch(); });  
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSearch(); });  
</script>
